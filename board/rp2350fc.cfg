# Boardconfig for CMSIS-DAP probe (Raspberry Pi Debug Probe) with RP2350-FC (RP2350A/B, RP2354A/B)
#
# Needs an OpenOCD build with RP2350 support (raspberrypi/openocd, reports 0.12.0+dev).
# Upstream 0.12.0 only ships rp2040.cfg and can not talk to this chip.

source [find interface/cmsis-dap.cfg]

# target/rp2350.cfg does not set a speed and the probe default is too slow for flashing
adapter speed 5000

source [find target/rp2350.cfg]

reset_config none separate
