    group: v1
    description: Retrieves filter configuration settings (Gyro, D-term, Yaw, Accel). Some fields are BF compatibility placeholders or legacy.
    replaced_by:
      - MSP2_COMMON_SETTING
    request: null
    reply:
      fields:
        gyroMainLpfHz:
          type: uint8
          unit: Hz
          description: Gyro main low-pass filter cutoff frequency (`gyroConfig()->gyro_main_lpf_hz`)

        dtermLpfHz:
          type: uint16
          unit: Hz
          description: D-term low-pass filter cutoff frequency (`pidProfile()->dterm_lpf_hz`)

        yawLpfHz:
          type: uint16
          unit: Hz
          description: Yaw low-pass filter cutoff frequency (`pidProfile()->yaw_lpf_hz`)

        legacyGyroNotchHz:
          type: uint16
          description: Always 0 (Legacy)
          value: 0

        legacyGyroNotchCutoff:
          type: uint16
          description: Always 1 (Legacy)
          value: 1

        bfCompatDtermNotchHz:
          type: uint16
          description: Always 0 (BF compatibility)
          value: 0

        bfCompatDtermNotchCutoff:
          type: uint16
          description: Always 1 (BF compatibility)
          value: 1

        bfCompatGyroNotch2Hz:
          type: uint16
          description: Always 0 (BF compatibility)
          value: 0

        bfCompatGyroNotch2Cutoff:
          type: uint16
          description: Always 1 (BF compatibility)
          value: 1

        accNotchHz:
          type: uint16
          unit: Hz
          description: Accelerometer notch filter center frequency (`accelerometerConfig()->acc_notch_hz`)

        accNotchCutoff:
          type: uint16
          unit: Hz
          description: Accelerometer notch filter cutoff frequency (`accelerometerConfig()->acc_notch_cutoff`)

        legacyGyroStage2LpfHz:
          type: uint16
          description: Always 0 (Legacy)
          value: 0

  MSP_SET_FILTER_CONFIG:
    id: 93
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets filter configuration settings. Handles different payload lengths for backward compatibility.
    notes: Requires at least 22 bytes; intermediate length checks enforce legacy Betaflight frame layout and call `pidInitFilters()` once the D-term notch placeholders are consumed.
    replaced_by:
      - MSP2_COMMON_SET_SETTING
    request:
      fields:
        gyroMainLpfHz:
          type: uint8
          unit: Hz
          description: Sets `gyroConfigMutable()->gyro_main_lpf_hz`. (Size >= 5)

        dtermLpfHz:
          type: uint16
          unit: Hz
          description: Sets `pidProfileMutable()->dterm_lpf_hz` (constrained 0-500). (Size >= 5)

        yawLpfHz:
          type: uint16
          unit: Hz
          description: Sets `pidProfileMutable()->yaw_lpf_hz` (constrained 0-255). (Size >= 5)

        legacyGyroNotchHz:
          type: uint16
          description: Ignored. (Size >= 9)

        legacyGyroNotchCutoff:
          type: uint16
          description: Ignored. (Size >= 9)

        bfCompatDtermNotchHz:
          type: uint16
          description: Ignored. (Size >= 13)

        bfCompatDtermNotchCutoff:
          type: uint16
          description: Ignored. (Size >= 13)

        bfCompatGyroNotch2Hz:
          type: uint16
          description: Ignored. (Size >= 17)

        bfCompatGyroNotch2Cutoff:
          type: uint16
          description: Ignored. (Size >= 17)

        accNotchHz:
          type: uint16
          unit: Hz
          description: Sets `accelerometerConfigMutable()->acc_notch_hz` (constrained 0-255). (Size >= 21)

        accNotchCutoff:
          type: uint16
          unit: Hz
          description: Sets `accelerometerConfigMutable()->acc_notch_cutoff` (constrained 1-255). (Size >= 21)

        legacyGyroStage2LpfHz:
          type: uint16
          description: Ignored. (Size >= 22)
    reply: null

  MSP_PID_ADVANCED:
