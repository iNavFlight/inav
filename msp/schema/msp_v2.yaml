          description: 'Enum (`opticalFlowSensor_e`): Optical flow hardware type (`opticalFlowConfig()->opflow_hardware`). 0 if `USE_OPFLOW` disabled'

  MSP_SET_SENSOR_CONFIG:
    id: 97
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the configured hardware type for various sensors.
