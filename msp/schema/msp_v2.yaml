        accelLimitRollPitch:
          type: uint16
          unit: dps / 10
          description: Axis acceleration limit for Roll/Pitch / 10 (`pidProfile()->axisAccelerationLimitRollPitch / 10`)

        accelLimitYaw:
          type: uint16
          unit: dps / 10
          description: Axis acceleration limit for Yaw / 10 (`pidProfile()->axisAccelerationLimitYaw / 10`)

  MSP_SET_PID_ADVANCED:
    id: 95
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets advanced PID tuning parameters.
