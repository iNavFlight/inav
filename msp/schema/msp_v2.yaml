    request: null
    reply:
      fields:
        boxNamesString:
          type: char[]
          description: String containing mode names separated by ';'. Null termination not guaranteed by MSP, relies on payload size. (`serializeBoxNamesReply()`)

  MSP_PIDNAMES:
    id: 117
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides a semicolon-separated string containing the names of the PID controllers.
    variable_len: true
    request: null
    reply:
      fields:
        pidNamesString:
          type: char[]
          description: String "ROLL;PITCH;YAW;ALT;Pos;PosR;NavR;LEVEL;MAG;VEL;". Null termination not guaranteed by MSP

  MSP_WP:
    id: 118
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Get/Set a single waypoint from the mission plan.
    notes: See `navWaypoint_t` and `navWaypointActions_e`.
    request:
      fields:
        waypointIndex:
          type: uint8
          description: Index of the waypoint to retrieve (0 to `NAV_MAX_WAYPOINTS - 1`)
    reply:
      fields:

        waypointIndex:
          type: uint8
          unit: Index
          description: Index of the returned waypoint

        action:
          type: uint8
          enum: navWaypointActions_e
          description: Enum `navWaypointActions_e` Waypoint action type

        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude coordinate

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude coordinate

        altitude:
          type: int32
          unit: cm
          description: Altitude coordinate (relative to home or sea level, see flag)

        param1:
          type: int16
          unit: Varies
          description: Parameter 1 (meaning depends on action)

        param2:
          type: int16
          unit: Varies
          description: Parameter 2 (meaning depends on action)

        param3:
          type: int16
          unit: Varies
          description: Parameter 3 (meaning depends on action)

        flag:
          type: uint8
          bitmask: true
          description: 'Bitmask: Waypoint flags (`NAV_WP_FLAG_*`)'

  MSP_BOXIDS:
    id: 119
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides a list of permanent IDs associated with the available flight modes (boxes).
    notes: Useful for mapping mode range configurations (`MSP_MODE_RANGES`) back to user-understandable modes via `MSP_BOXNAMES`.
    variable_len: true
    request: null
    reply:
      fields:
        boxIds:
          type: uint8[]
          description: Array of permanent IDs for each configured box (`serializeBoxReply()`). Length depends on number of boxes

  MSP_SERVO_CONFIGURATIONS:
    id: 120
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the configuration parameters for all supported servos (min, max, middle, rate). Legacy format with unused fields.
    notes: Superseded by `MSP2_INAV_SERVO_CONFIG` which has a cleaner structure.
    variable_len: MAX_SUPPORTED_SERVOS
    request: null
    reply:
      repeat: MAX_SUPPORTED_SERVOS
      fields:
        min:
          type: int16
          unit: PWM
          description: Minimum servo endpoint (`servoParams(i)->min`)

        max:
          type: int16
          unit: PWM
          description: Maximum servo endpoint (`servoParams(i)->max`)

        middle:
          type: int16
          unit: PWM
          description: Middle/Neutral servo position (`servoParams(i)->middle`)

        rate:
          type: int8
          unit: '% (-100 to 100)'
          description: Servo rate/scaling (`servoParams(i)->rate`, -125..125). Encoded as two's complement

        reserved1:
          type: uint8
          description: Always 0
          value: 0

        reserved2:
          type: uint8
          description: Always 0
          value: 0

        legacyForwardChan:
          type: uint8
          description: Always 255 (Legacy)
          value: 255

        legacyReversedSources:
          type: uint32
          description: Always 0 (Legacy)
          value: 0

  MSP_NAV_STATUS:
    id: 121
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the current status of the navigation system.
    notes: Requires `USE_GPS`.
    request: null
    reply:
      fields:
        navMode:
          type: uint8
          enum: navSystemStatus_Mode_e
          description: 'Enum (`navSystemStatus_Mode_e`): Current navigation mode (None, RTH, NAV, Hold, etc.) (`NAV_Status.mode`)'

        navState:
          type: uint8
          enum: navSystemStatus_State_e
          description: 'Enum (`navSystemStatus_State_e`): Current navigation state (`NAV_Status.state`)'

        activeWpAction:
          type: uint8
          enum: navWaypointActions_e
          description: 'Enum (`navWaypointActions_e`): Action of the currently executing waypoint (`NAV_Status.activeWpAction`)'

        activeWpNumber:
          type: uint8
          description: 'Index: Index of the currently executing waypoint (`NAV_Status.activeWpNumber`)'

        navError:
          type: uint8
          enum: navSystemStatus_Error_e
          description: 'Enum (`navSystemStatus_Error_e`): Current navigation error code (`NAV_Status.error`)'

        targetHeading:
          type: int16
          unit: degrees
          description: Target heading for heading controller (`getHeadingHoldTarget()`)

        desiredHeading:
          type: uint16
          unit: centi-degrees
          description: Guidance course/track the navigation controller is steering to (`navDesiredHeading`, `wrap_36000()` of the desired yaw)

  MSP_NAV_CONFIG:
    id: 122
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    not_implemented: true

  MSP_3D:
    id: 124
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves settings related to 3D/reversible motor operation.
    notes: Requires reversible motor support.
    request: null
    reply:
      fields:
        deadbandLow:
          type: uint16
          unit: PWM
          description: Lower deadband limit for 3D mode (`reversibleMotorsConfig()->deadband_low`)

        deadbandHigh:
          type: uint16
          unit: PWM
          description: Upper deadband limit for 3D mode (`reversibleMotorsConfig()->deadband_high`)

        neutral:
          type: uint16
          unit: PWM
          description: Neutral throttle point for 3D mode (`reversibleMotorsConfig()->neutral`)

  MSP_RC_DEADBAND:
    id: 125
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves RC input deadband settings.
    request: null
    reply:
      fields:
        deadband:
          type: uint8
          unit: PWM
          description: General RC deadband for Roll/Pitch (`rcControlsConfig()->deadband`)

        yawDeadband:
          type: uint8
          unit: PWM
          description: Specific deadband for Yaw (`rcControlsConfig()->yaw_deadband`)

        altHoldDeadband:
          type: uint8
          unit: PWM
          description: Deadband for altitude hold adjustments (`rcControlsConfig()->alt_hold_deadband`)

        throttleDeadband:
          type: uint16
          unit: PWM
          description: Deadband around throttle mid-stick (`rcControlsConfig()->mid_throttle_deadband`)

  MSP_SENSOR_ALIGNMENT:
    id: 126
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves sensor alignment settings (legacy format).
    notes: Board alignment is now typically handled by `MSP_BOARD_ALIGNMENT`. This returns legacy enum values where applicable.
    request: null
    reply:
      fields:
        gyroAlign:
          type: uint8
          description: Always 0 (Legacy alignment enum)
          value: 0

        accAlign:
          type: uint8
          description: Always 0 (Legacy alignment enum)
          value: 0

        magAlign:
          type: uint8
          description: Magnetometer alignment (`compassConfig()->mag_align`). 0 if `USE_MAG` disabled

        opflowAlign:
          type: uint8
          description: Optical flow alignment (`opticalFlowConfig()->opflow_align`). 0 if `USE_OPFLOW` disabled

  MSP_LED_STRIP_MODECOLOR:
    id: 127
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the color index assigned to each LED mode and function/direction combination, including special colors.
    notes: Only available if `USE_LED_STRIP` is defined. Entries where `modeIndex == LED_MODE_COUNT` describe special colors.
    variable_len: LED_MODE_COUNT * LED_DIRECTION_COUNT + LED_SPECIAL_COLOR_COUNT
    request: null
    reply:
      repeat: 51
      fields:
        modeIndex:
          type: uint8
          enum: ledModeIndex_e
          description: Index of the LED mode Enum (`ledModeIndex_e`). `LED_MODE_COUNT` for special colors

        directionOrSpecialIndex:
          type: uint8
          description: Index of the direction (`ledDirectionId_e`) or special color (`ledSpecialColorIds_e`)

        colorIndex:
          type: uint8
          description: Index of the color assigned from `ledStripConfig()->colors`

  MSP_BATTERY_STATE:
    id: 130
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides battery state information, formatted primarily for DJI FPV Goggles compatibility.
    notes: Only available if `USE_DJI_HD_OSD` or `USE_MSP_DISPLAYPORT` is defined. Some values are duplicated from `MSP_ANALOG` / `MSP2_INAV_ANALOG` but potentially with different scaling/types.
    request: null
    reply:
      fields:
        cellCount:
          type: uint8
          unit: Count
          description: Number of battery cells (`getBatteryCellCount()`)

        capacity:
          type: uint16
          unit: mAh
          description: Battery capacity (`currentBatteryProfile->capacity.value`)

        vbatScaled:
          type: uint8
          unit: 0.1V
          description: Battery voltage / 10 (`getBatteryVoltage() / 10`)

        mAhDrawn:
          type: uint16
          unit: mAh
          description: Consumed capacity (`getMAhDrawn()`)

        amperage:
          type: int16
          unit: 0.01A
          description: Current draw (`getAmperage()`)

        batteryState:
          type: uint8
          enum: batteryState_e
          description: Enum `batteryState_e` Current battery state (`getBatteryState()`, see `BATTERY_STATE_*`)

        vbatActual:
          type: uint16
          unit: 0.01V
          description: Actual battery voltage (`getBatteryVoltage()`)

  MSP_VTXTABLE_BAND:
    id: 137
    inav_version:
      since: "7.0"
    mspv: 1
    group: v1
    description: Retrieves information about a specific VTX band from the VTX table. (Implementation missing in provided `fc_msp.c`)
    notes: The ID is defined, but no handler exists in the provided C code. Likely intended to query band names and frequencies.
    request: null
    reply: null

  MSP_VTXTABLE_POWERLEVEL:
    id: 138
    inav_version:
      since: "7.0"
    mspv: 1
    group: v1
    description: Retrieves information about a specific VTX power level from the VTX table.
    notes: Requires `USE_VTX_CONTROL`. Returns error if index is out of bounds. The `powerValue` field is unused.
    variable_len: true
    request:
      fields:
        powerLevelIndex:
          type: uint8
          description: 1-based index of the power level to query
    reply:
      fields:

        powerLevelIndex:
          type: uint8
          description: 1-based index of the returned power level

        powerValue:
          type: uint16
          description: Always 0 (Actual power value in mW is not stored/returned via MSP)
          value: 0

        labelLength:
          type: uint8
          description: Length of the power level label string that follows

        label:
          type: char[]
          description: Power level label string (e.g., "25", "200"). Length given by previous field

  MSP_STATUS_EX:
    id: 150
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides extended flight controller status, including CPU load, arming flags, and calibration status, in addition to `MSP_STATUS` fields.
    notes: Superseded by `MSP2_INAV_STATUS` which provides the full 32-bit `armingFlags` and other enhancements. The `accCalibAxisFlags` field is not present in `MSP2_INAV_STATUS` but is available via `MSP_CALIBRATION_DATA`.
    replaced_by:
      - MSP2_INAV_STATUS
    request: null
    reply:
      fields:
        cycleTime:
          type: uint16
          unit: "\xB5s"
          description: Main loop cycle time

        i2cErrors:
          type: uint16
          unit: Count
          description: I2C errors

        sensorStatus:
          type: uint16
          enum: sensors_e
          bitmask: true
          description: 'Bitmask: Sensor status'

        activeModesLow:
          type: uint32
          bitmask: true
          description: 'Bitmask: First 32 active modes'

        profile:
          type: uint8
          unit: Index
          description: Current config profile index

        cpuLoad:
          type: uint16
          unit: '%'
          description: Average system load percentage (`averageSystemLoadPercent`)

        armingFlags:
          type: uint16
          enum: armingFlag_e
          bitmask: true
          description: 'Bitmask: Flight controller arming flags (`armingFlags`). Note: Truncated to 16 bits'

        accCalibAxisFlags:
          type: uint8
          bitmask: true
          description: 'Bitmask: Accelerometer calibrated axes flags (`accGetCalibrationAxisFlags()`)'

  MSP_SENSOR_STATUS:
    id: 151
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the hardware status for each individual sensor system.
    notes: 'Status values map to the `hardwareSensorStatus_e` enum: `HW_SENSOR_NONE`, `HW_SENSOR_OK`, `HW_SENSOR_UNAVAILABLE`, `HW_SENSOR_UNHEALTHY`.'
    request: null
    reply:
      fields:
        overallHealth:
          type: uint8
          unit: Boolean
          description: 1 if all essential hardware is healthy, 0 otherwise (`isHardwareHealthy()`)

        gyroStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Gyro hardware status (`getHwGyroStatus()`)

        accStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Accelerometer hardware status (`getHwAccelerometerStatus()`)

        magStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Compass hardware status (`getHwCompassStatus()`)

        baroStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Barometer hardware status (`getHwBarometerStatus()`)

        gpsStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` GPS hardware status (`getHwGPSStatus()`)

        rangefinderStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Rangefinder hardware status (`getHwRangefinderStatus()`)

        pitotStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Pitot hardware status (`getHwPitotmeterStatus()`)

        opflowStatus:
          type: uint8
          enum: hardwareSensorStatus_e
          description: Enum `hardwareSensorStatus_e` Optical Flow hardware status (`getHwOpticalFlowStatus()`)

  MSP_UID:
    id: 160
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the unique identifier of the microcontroller.
    notes: Total 12 bytes, representing a 96-bit unique ID.
    request: null
    reply:
      fields:
        uid0:
          type: uint32
          description: First 32 bits of the unique ID (`U_ID_0`)

        uid1:
          type: uint32
          description: Middle 32 bits of the unique ID (`U_ID_1`)

        uid2:
          type: uint32
          description: Last 32 bits of the unique ID (`U_ID_2`)

  MSP_GPSSVINFO:
    id: 164
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides satellite signal strength information (legacy U-Blox compatibility stub).
    notes: 'Requires `USE_GPS`. This is just a stub in INAV and does not provide actual per-satellite signal info. HDOP digits are not formatted correctly: tens and units both contain `gpsSol.hdop / 100`.'
    request: null
    reply:
      fields:
        protocolVersion:
          type: uint8
          description: Always 1 (Stub version)
          value: 1

        numChannels:
          type: uint8
          description: Always 0 (Number of SV info channels reported)
          value: 0

        hdopHundredsDigit:
          type: uint8
          description: Hundreds digit of HDOP (stub always writes 0)

        hdopTensDigit:
          type: uint8
          description: Tens digit of HDOP (`gpsSol.hdop / 100`, truncated)

        hdopUnitsDigit:
          type: uint8
          description: Units digit of HDOP (`gpsSol.hdop / 100`, duplicated by stub)

  MSP_GPSSTATISTICS:
    id: 166
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides debugging statistics for the GPS communication link.
    notes: Requires `USE_GPS`.
    request: null
    reply:
      fields:
        lastMessageDt:
          type: uint16
          unit: ms
          description: Time since last valid GPS message (`gpsStats.lastMessageDt`)

        errors:
          type: uint32
          unit: Count
          description: Number of GPS communication errors (`gpsStats.errors`)

        timeouts:
          type: uint32
          unit: Count
          description: Number of GPS communication timeouts (`gpsStats.timeouts`)

        packetCount:
          type: uint32
          unit: Count
          description: Number of valid GPS packets received (`gpsStats.packetCount`)

        hdop:
          type: uint16
          unit: HDOP * 100
          description: Horizontal Dilution of Precision (`gpsSol.hdop`)

        eph:
          type: uint16
          unit: cm
          description: Estimated Horizontal Position Accuracy (`gpsSol.eph`)

        epv:
          type: uint16
          unit: cm
          description: Estimated Vertical Position Accuracy (`gpsSol.epv`)

        hwVersion:
          type: uint8
          description: 'GPS hardware version bit-field: bits[7:6]=series (0b01=u-blox Neo/M), bits[5:0]=generation. E.g. 0x48=M8, 0x49=M9, 0x4A=M10, 0=unknown.'

  MSP_OSD_VIDEO_CONFIG:
    id: 180
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    not_implemented: true

  MSP_SET_OSD_VIDEO_CONFIG:
    id: 181
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    not_implemented: true

  MSP_DISPLAYPORT:
    id: 182
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Drives an external MSP DisplayPort OSD (DJI, HDZero, Walksnail). Sent by the flight controller to the display device rather than requested from it, so it carries a reply payload with no request and expects no response.
    notes: Requires an MSP DisplayPort OSD device. Sub-commands are emitted by `io/displayport_msp_osd.c`; `MSP_DP_OPTIONS` is reserved and unused by INAV.
    variable_len: true
    request: null
    reply:
      fields:
        subCommand:
          type: uint8
          enum: displayportMspCommand_e
          description: DisplayPort sub-command (`displayportMspCommand_e` in `io/displayport_msp.h`)

        subCommandData:
          type: uint8[]
          description: 'Sub-command payload. Empty for `MSP_DP_HEARTBEAT`, `MSP_DP_RELEASE`, `MSP_DP_CLEAR_SCREEN` and `MSP_DP_DRAW_SCREEN`. For `MSP_DP_WRITE_STRING`: row, column, attributes (font page in bits 0-1, blink in bit 3), then the character bytes.'

  MSP_SET_TX_INFO:
    id: 186
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Allows a transmitter LUA script (or similar) to send runtime information (currently only RSSI) to the firmware.
    notes: Calls `setRSSIFromMSP()`. Expects 1 byte.
    request:
      fields:
        rssi:
          type: uint8
          unit: Raw
          description: RSSI value (0-255) provided by the external source; firmware scales it to 10-bit (`value << 2`)
    reply: null

  MSP_TX_INFO:
    id: 187
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides information potentially useful for transmitter LUA scripts.
    notes: See `rssiSource_e`.
    request: null
    reply:
      fields:
        rssiSource:
          type: uint8
          enum: rssiSource_e
          description: 'Enum: Source of the RSSI value (`getRSSISource()`, see `rssiSource_e`)'

        rtcDateTimeIsSet:
          type: uint8
          description: 'Boolean: 1 if the RTC has been set, 0 otherwise'

  MSP_SET_RAW_RC:
    id: 200
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides raw RC channel data to the flight controller, typically used when the receiver is connected via MSP (e.g., MSP RX feature).
    notes: Requires `USE_RX_MSP`. Maximum channels `MAX_SUPPORTED_RC_CHANNEL_COUNT`. Calls `rxMspFrameReceive()`.
    variable_len: true
    request:
      fields:
        rcChannels:
          type: uint16[]
          unit: PWM
          description: Array of RC channel values (typically 1000-2000). Number of channels determined by payload size
    reply: null

  MSP_SET_RAW_GPS:
    id: 201
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides raw GPS data to the flight controller, typically for simulation or external GPS injection.
    notes: Requires `USE_GPS`. Expects 14 bytes. Updates `gpsSol` structure and calls `onNewGPSData()`. Note the altitude unit mismatch (meters in MSP, cm internal). Does not provide velocity components.
    request:
      fields:
        fixType:
          type: uint8
          enum: gpsFixType_e
          description: Enum `gpsFixType_e` GPS fix type

        numSat:
          type: uint8
          unit: Count
          description: Number of satellites

        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude

        altitude:
          type: uint16
          unit: m
          description: Altitude in meters (converted to centimeters internally; limited to 0-65535 m)

        speed:
          type: uint16
          unit: cm/s
          description: Ground speed (`gpsSol.groundSpeed`)
    reply: null

  MSP_SET_BOX:
    id: 203
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the state of flight modes (boxes). (Likely unused/obsolete in INAV).
    notes: Not implemented in INAV `fc_msp.c`. Mode changes are typically handled via RC channels (`MSP_MODE_RANGES`).
    not_implemented: true

  MSP_SET_RC_TUNING:
    id: 204
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets RC tuning parameters (rates, expos, TPA) for the current control rate profile.
    notes: Expects 10 or 11 bytes. Calls `schedulePidGainsUpdate()`. Superseded by `MSP2_INAV_SET_RATE_PROFILE`.
    request:
      fields:
        legacyRcRate:
          type: uint8
          description: Ignored

        rcExpo:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rcExpo8`

        rollRate:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rates[FD_ROLL]` (constrained)

        pitchRate:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rates[FD_PITCH]` (constrained)

        yawRate:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rates[FD_YAW]` (constrained)

        dynamicThrottlePID:
          type: uint8
          description: Sets `currentControlRateProfile->throttle.dynPID` (constrained)

        throttleMid:
          type: uint8
          description: Sets `currentControlRateProfile->throttle.rcMid8`

        throttleExpo:
          type: uint8
          description: Sets `currentControlRateProfile->throttle.rcExpo8`

        tpaBreakpoint:
          type: uint16
          description: Sets `currentControlRateProfile->throttle.tpa_breakpoint`

        rcYawExpo:
          type: optional uint8
          description: (Optional) Sets `currentControlRateProfile->stabilized.rcYawExpo8`
    reply: null

  MSP_ACC_CALIBRATION:
    id: 205
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Starts the accelerometer calibration procedure.
    notes: Will fail if armed. Calls `accStartCalibration()`.
    request: null
    reply: null

  MSP_MAG_CALIBRATION:
    id: 206
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Starts the magnetometer calibration procedure.
    notes: Will fail if armed. Enables the `CALIBRATE_MAG` state flag.
    request: null
    reply: null

  MSP_SET_MISC:
    id: 207
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets miscellaneous configuration settings (legacy formats/scaling).
    notes: Expects 22 bytes. Superseded by `MSP2_INAV_SET_MISC`.
    replaced_by:
      - MSP2_INAV_SET_MISC
    request:
      fields:
        midRc:
          type: uint16
          unit: PWM
          description: Ignored

        legacyMinThrottle:
          type: uint16
          description: Ignored

        legacyMaxThrottle:
          type: uint16
          description: Ignored

        minCommand:
          type: uint16
          unit: PWM
          description: Sets `motorConfigMutable()->mincommand` (constrained 0-PWM_RANGE_MAX)

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->failsafe_throttle` (constrained PWM_RANGE_MIN/MAX)

        gpsType:
          type: uint8
          enum: gpsProvider_e
          description: Enum `gpsProvider_e` (Sets `gpsConfigMutable()->provider`)

        legacyGpsBaud:
          type: uint8
          description: Ignored

        gpsSbasMode:
          type: uint8
          enum: sbasMode_e
          description: Enum `sbasMode_e` (Sets `gpsConfigMutable()->sbasMode`)

        legacyMwCurrentOut:
          type: uint8
          description: Ignored

        rssiChannel:
          type: uint8
          unit: Index
          description: Sets `rxConfigMutable()->rssi_channel` (constrained 0-MAX_SUPPORTED_RC_CHANNEL_COUNT). Updates source

        reserved1:
          type: uint8
          description: Ignored

        magDeclination:
          type: uint16
          unit: 0.1 degrees
          description: Sets `compassConfigMutable()->mag_declination = value * 10` (if `USE_MAG`)

        vbatScale:
          type: uint8
          unit: Scale / 10
          description: Sets `batteryMetersConfigMutable()->voltage.scale = value * 10` (if `USE_ADC`)

        vbatMinCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellMin = value * 10` (if `USE_ADC`)

        vbatMaxCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellMax = value * 10` (if `USE_ADC`)

        vbatWarningCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellWarning = value * 10` (if `USE_ADC`)
    reply: null

  MSP_RESET_CONF:
    id: 208
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Resets all configuration settings to their default values and saves to EEPROM.
    notes: Will fail if armed. Suspends RX, calls `resetEEPROM()`, `writeEEPROM()`, `readEEPROM()`, resumes RX. Use with caution!
    request: null
    reply: null

  MSP_SET_WP:
    id: 209
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets a single waypoint in the mission plan.
    notes: Expects 21 bytes. Calls `setWaypoint()`. If `USE_FW_AUTOLAND` is enabled, this also interacts with autoland approach settings based on waypoint index and flags.
    request:
      fields:
        waypointIndex:
          type: uint8
          unit: Index
          description: Index of the waypoint to set (0 to `NAV_MAX_WAYPOINTS - 1`)

        action:
          type: uint8
          enum: navWaypointActions_e
          description: Enum `navWaypointActions_e` Waypoint action type

        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude coordinate

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude coordinate

        altitude:
          type: int32
          unit: cm
          description: Altitude coordinate

        param1:
          type: uint16
          unit: Varies
          description: Parameter 1

        param2:
          type: uint16
          unit: Varies
          description: Parameter 2

        param3:
          type: uint16
          unit: Varies
          description: Parameter 3

        flag:
          type: uint8
          enum: navWaypointFlags_e
          bitmask: true
          description: 'Bitmask: Waypoint flags (`navWaypointFlags_e`)'
    reply: null

  MSP_SELECT_SETTING:
    id: 210
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Selects the active configuration profile and saves it.
    notes: Will fail if armed. Calls `setConfigProfileAndWriteEEPROM()`.
    request:
      fields:
        profileIndex:
          type: uint8
          description: Index of the profile to activate (0-based)
    reply: null

  MSP_SET_HEAD:
    id: 211
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the target heading for the heading hold controller (e.g., during MAG mode).
    notes: Expects 2 bytes. Calls `updateHeadingHoldTarget()`. Also synchronizes navigation yaw targets (including cruise/course) when NAV is controlling yaw.
    request:
      fields:
        heading:
          type: uint16
          unit: degrees
          description: Target heading (0-359)
    reply: null

  MSP_SET_SERVO_CONFIGURATION:
    id: 212
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the configuration for a single servo (legacy format).
    notes: Expects 15 bytes. Returns error if index is invalid. Calls `servoComputeScalingFactors()`. Superseded by `MSP2_INAV_SET_SERVO_CONFIG`.
    request:
      fields:
        servoIndex:
          type: uint8
          unit: Index
          description: Index of the servo to configure (0 to `MAX_SUPPORTED_SERVOS - 1`)

        min:
          type: uint16
          unit: PWM
          description: Minimum servo endpoint

        max:
          type: uint16
          unit: PWM
          description: Maximum servo endpoint

        middle:
          type: uint16
          unit: PWM
          description: Middle/Neutral servo position

        rate:
          type: uint8
          unit: '%'
          description: Servo rate/scaling

        reserved1:
          type: uint8
          description: Ignored

        reserved2:
          type: uint8
          description: Ignored

        legacyForwardChan:
          type: uint8
          description: Ignored

        legacyReversedSources:
          type: uint32
          description: Ignored
    reply: null

  MSP_SET_MOTOR:
    id: 214
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the disarmed motor values, typically used for motor testing or propeller balancing functions in a configurator.
    notes: Expects 16 bytes. Modifies the `motor_disarmed` array. These values are *not* saved persistently.
    request:
      fields:
        motorValues:
          type: uint16[8]
          unit: PWM
          description: Array of motor values to set when disarmed. Only affects first `MAX_SUPPORTED_MOTORS` entries
    reply: null

  MSP_SET_NAV_CONFIG:
    id: 215
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    not_implemented: true

  MSP_SET_3D:
    id: 217
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets parameters related to 3D/reversible motor operation.
    notes: Expects 6 bytes. Requires reversible motor support.
    request:
      fields:
        deadbandLow:
          type: uint16
          unit: PWM
          description: Sets `reversibleMotorsConfigMutable()->deadband_low`

        deadbandHigh:
          type: uint16
          unit: PWM
          description: Sets `reversibleMotorsConfigMutable()->deadband_high`

        neutral:
          type: uint16
          unit: PWM
          description: Sets `reversibleMotorsConfigMutable()->neutral`
    reply: null

  MSP_SET_RC_DEADBAND:
    id: 218
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets RC input deadband values.
    notes: Expects 5 bytes.
    request:
      fields:
        deadband:
          type: uint8
          unit: PWM
          description: Sets `rcControlsConfigMutable()->deadband`

        yawDeadband:
          type: uint8
          unit: PWM
          description: Sets `rcControlsConfigMutable()->yaw_deadband`

        altHoldDeadband:
          type: uint8
          unit: PWM
          description: Sets `rcControlsConfigMutable()->alt_hold_deadband`

        throttleDeadband:
          type: uint16
          unit: PWM
          description: Sets `rcControlsConfigMutable()->mid_throttle_deadband`
    reply: null

  MSP_SET_RESET_CURR_PID:
    id: 219
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Resets the PIDs of the *current* profile to their default values. Does not save.
    notes: Calls `PG_RESET_CURRENT(pidProfile)`. To save, follow with `MSP_EEPROM_WRITE`.
    request: null
    reply: null

  MSP_SET_SENSOR_ALIGNMENT:
    id: 220
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets sensor alignment (legacy format).
    notes: Expects 4 bytes. Use `MSP_SET_BOARD_ALIGNMENT` for primary board orientation.
    request:
      fields:
        gyroAlign:
          type: uint8
          description: Ignored

        accAlign:
          type: uint8
          description: Ignored

        magAlign:
          type: uint8
          description: Sets `compassConfigMutable()->mag_align` (if `USE_MAG`)

        opflowAlign:
          type: uint8
          description: Sets `opticalFlowConfigMutable()->opflow_align` (if `USE_OPFLOW`)
    reply: null

  MSP_SET_LED_STRIP_MODECOLOR:
    id: 221
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the color index for a specific LED mode/function combination.
    notes: Only available if `USE_LED_STRIP` is defined. Expects 3 bytes. Returns error if setting fails (invalid index).
    request:
      fields:
        modeIndex:
          type: uint8
          enum: ledModeIndex_e
          description: Index of the LED mode (`ledModeIndex_e` or `LED_MODE_COUNT` for special)

        directionOrSpecialIndex:
          type: uint8
          description: Index of the direction (`ledDirectionId_e`) or special color (`ledSpecialColorIds_e`)

        colorIndex:
          type: uint8
          description: Index of the color to assign from `ledStripConfig()->colors`
    reply: null

  MSP_SET_ACC_TRIM:
    id: 239
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the accelerometer trim values (leveling calibration).
    notes: Not implemented in INAV `fc_msp.c`. Use `MSP_ACC_CALIBRATION`.
    not_implemented: true

  MSP_ACC_TRIM:
    id: 240
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Gets the accelerometer trim values.
    notes: Not implemented in INAV `fc_msp.c`. Calibration data via `MSP_CALIBRATION_DATA`.
    not_implemented: true

  MSP_SERVO_MIX_RULES:
    id: 241
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the custom servo mixer rules (legacy format).
    notes: Superseded by `MSP2_INAV_SERVO_MIXER`.
    variable_len: MAX_SERVO_RULES
    replaced_by:
      - MSP2_INAV_SERVO_MIXER
    request: null
    reply:
      repeat: MAX_SERVO_RULES
      fields:
        targetChannel:
          type: uint8
          unit: Index
          description: Servo output channel index (0-based)

        inputSource:
          type: uint8
          enum: inputSource_e
          description: Enum `inputSource_e` Input source for the mix (RC chan, Roll, Pitch...)

        rate:
          type: int16
          unit: '%'
          description: Mixing rate/weight (`-1000` to `+1000`, percent with sign)

        speed:
          type: uint8
          unit: 0-255
          description: Speed/Slew rate limit (`0`=instant, higher slows response)

        reserved1:
          type: uint8
          description: Always 0
          value: 0

        legacyMax:
          type: uint8
          description: Always 100 (Legacy)
          value: 100

        legacyBox:
          type: uint8
          description: Always 0 (Legacy)
          value: 0

  MSP_SET_SERVO_MIX_RULE:
    id: 242
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets a single custom servo mixer rule (legacy format).
    notes: Expects 9 bytes. Returns error if index invalid. Calls `loadCustomServoMixer()`. Superseded by `MSP2_INAV_SET_SERVO_MIXER`.
    replaced_by:
      - MSP2_INAV_SET_SERVO_MIXER
    request:
      fields:
        ruleIndex:
          type: uint8
          unit: Index
          description: Index of the rule to set (0 to `MAX_SERVO_RULES - 1`)

        targetChannel:
          type: uint8
          unit: Index
          description: Servo output channel index

        inputSource:
          type: uint8
          enum: inputSource_e
          description: Enum `inputSource_e` Input source for the mix

        rate:
          type: int16
          unit: '%'
          description: Mixing rate/weight (`-1000` to `+1000`, percent with sign)

        speed:
          type: uint8
          unit: 0-255
          description: Speed/Slew rate limit (`0`=instant, higher slows response)

        legacyMinMax:
          type: uint16
          description: Ignored

        legacyBox:
          type: uint8
          description: Ignored
    reply: null

  MSP_SET_PASSTHROUGH:
    id: 245
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Enables serial passthrough mode to peripherals like ESCs (BLHeli 4-way) or other serial devices.
    notes: 'Accepts 0 bytes (defaults to ESC 4-way) or up to 2 bytes for mode/argument. If successful, sets `mspPostProcessFn` to the appropriate handler (`mspSerialPassthroughFn` or `esc4wayProcess`). This handler takes over the serial port after the reply is sent. Requires `USE_SERIAL_4WAY_BLHELI_INTERFACE` for ESC passthrough. ESC 4-way passthrough will fail if the craft is armed: the reply carries `MSP_RESULT_ERROR` and the serial port is not handed over. Serial passthrough to another device is unaffected.'
    request: null
    reply:
      fields:
        status:
          type: uint8
          description: 1 if passthrough started successfully, 0 on error (e.g., port not found). For 4way, returns number of ESCs found

  MSP_RTC:
    id: 246
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the current Real-Time Clock time.
    notes: Requires RTC hardware/support. Returns (0, 0) if time is not available/set.
    request: null
    reply:
      fields:
        seconds:
          type: int32
          unit: Seconds
          description: Seconds since epoch (or relative time if not set). 0 if RTC time unknown

        millis:
          type: uint16
          unit: Milliseconds
          description: Millisecond part of the time. 0 if RTC time unknown

  MSP_SET_RTC:
    id: 247
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the Real-Time Clock time.
    notes: Requires RTC hardware/support. Expects 6 bytes. Uses `rtcSet()`.
    request:
      fields:
        seconds:
          type: int32
          unit: Seconds
          description: Seconds component of time to set

        millis:
          type: uint16
          unit: Milliseconds
          description: Millisecond component of time to set
    reply: null

  MSP_EEPROM_WRITE:
    id: 250
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Saves the current configuration from RAM to non-volatile memory (EEPROM/Flash).
    notes: Will fail if armed. Suspends RX, calls `writeEEPROM()`, `readEEPROM()`, resumes RX.
    request: null
    reply: null

  MSP_RESERVE_1:
    id: 251
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    not_implemented: true

  MSP_RESERVE_2:
    id: 252
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    not_implemented: true

  MSP_DEBUGMSG:
    id: 253
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves debug ("serial printf") messages from the firmware.
    notes: Published via the LOG UART or shared MSP/LOG port using `mspSerialPushPort()`.
    variable_len: true
    request: null
    reply:
      fields:
        messageText:
          type: cstring
          description: Debug message text (not NUL-terminated). See [serial printf debugging](https://github.com/iNavFlight/inav/blob/master/docs/development/serial_printf_debugging.md)

  MSP_DEBUG:
    id: 254
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves values from the firmware's `debug[]` array (legacy 16-bit version).
    notes: Useful for developers. Values are truncated to the lower 16 bits of each `debug[]` entry. See `MSP2_INAV_DEBUG` for full 32-bit values.
    replaced_by:
      - MSP2_INAV_DEBUG
    request: null
    reply:
      fields:
        debugValues:
          type: uint16[4]
          description: First 4 values from the `debug` array

  MSP_V2_FRAME:
    id: 255
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: This ID is used as a *payload indicator* within an MSPv1 message structure (`$M>`) to signify that the following payload conforms to the MSPv2 format. It's not a command itself.
    notes: See MSPv2 documentation for the actual frame structure that follows this indicator.
    request: null
    reply: null

  MSP2_COMMON_TZ:
    id: 4097
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Gets the time zone offset configuration.
    request: null
    reply:
      fields:
        tzOffsetMinutes:
          type: int16
          unit: Minutes
          description: Time zone offset from UTC (`timeConfig()->tz_offset`)

        tzAutoDst:
          type: uint8
          unit: Boolean
          description: Automatic daylight saving time enabled (`timeConfig()->tz_automatic_dst`)

  MSP2_COMMON_SET_TZ:
    id: 4098
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Sets the time zone offset configuration.
    notes: Accepts 2 or 3 bytes.
    variants:
      dataSize == 2:
        description: dataSize == 2
        request:
          fields:
            tz_offset:
              type: int16
              unit: minutes
              description: Timezone offset from UTC.
        reply: null
      dataSize == 3:
        description: dataSize == 3
        request:
          fields:

            tz_offset:
              type: int16
              unit: minutes
              description: Timezone offset from UTC.

            tz_automatic_dst:
              type: uint8
              unit: bool
              description: Automatic DST enable (0/1).
        reply: null

  MSP2_COMMON_SETTING:
    id: 4099
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Gets the value of a specific configuration setting, identified by name or index.
    notes: Returns error if setting not found. Use `MSP2_COMMON_SETTING_INFO` to discover settings, types, and sizes.
    variable_len: true
    request:
      fields:
        settingIdentifier:
          description: Setting name, or an index when the first byte is `0x00`.
          # Two shapes on one field, chosen by the first byte. fc_msp.c:4088
          # reads a byte at a time and switches when the first one is NUL.
          discriminated:
            by: leading-zero
            cases:
              index:
                zero: uint8
                settingIndex: uint16
              name:
                settingName: cstring
    reply:
      fields:

        settingValue:
          type: uint8[]
          description: Raw byte value of the setting. Size depends on the setting's type (`settingGetValueSize()`)

  MSP2_COMMON_SET_SETTING:
    id: 4100
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Sets the value of a specific configuration setting, identified by name or index.
    notes: Performs type checking and range validation (min/max). Returns error if setting not found, value size mismatch, or value out of range. Handles different data types (`uint8`, `int16`, `float`, `string`, etc.) internally.
    variable_len: true
    request:
      fields:
        settingIdentifier:
          description: Setting name, or an index when the first byte is `0x00`.
          # Two shapes on one field, chosen by the first byte. fc_msp.c:4088
          # reads a byte at a time and switches when the first one is NUL.
          discriminated:
            by: leading-zero
            cases:
              index:
                zero: uint8
                settingIndex: uint16
              name:
                settingName: cstring

        settingValue:
          type: uint8[]
          description: Raw byte value to set for the setting. Size must match the setting's type
    reply: null

  MSP2_COMMON_MOTOR_MIXER:
    id: 4101
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Retrieves the current motor mixer configuration (throttle, roll, pitch, yaw weights) for each motor.
    notes: Scaling is `(float_weight + 2.0) * 1000`. `primaryMotorMixer()` provides the data. If multiple mixer profiles are enabled (`MAX_MIXER_PROFILE_COUNT > 1`), an additional block of mixes for the next profile follows immediately.
    variable_len: MAX_SUPPORTED_MOTORS
    request: null
    reply:
      repeat: MAX_SUPPORTED_MOTORS
      fields:
        motorMix:
          type: uint16[4]
          unit: Scaled (0-4000)
          description: Weights for a single motor `[throttle, roll, pitch, yaw]`, each encoded as `(mix + 2.0) * 1000` (range 0-4000)

  MSP2_COMMON_SET_MOTOR_MIXER:
    id: 4102
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Sets the motor mixer weights for a single motor in the primary mixer profile.
    notes: Expects 9 bytes. Modifies `primaryMotorMixerMutable()`. Returns error if index is invalid.
    request:
      fields:
        motorIndex:
          type: uint8
          unit: Index
          description: Index of the motor to configure (0 to `MAX_SUPPORTED_MOTORS - 1`)

        throttleWeight:
          type: uint16
          unit: Scaled (0-4000)
          description: Sets throttle weight from `(value / 1000.0) - 2.0

        rollWeight:
          type: uint16
          unit: Scaled (0-4000)
          description: Sets roll weight from `(value / 1000.0) - 2.0

        pitchWeight:
          type: uint16
          unit: Scaled (0-4000)
          description: Sets pitch weight from `(value / 1000.0) - 2.0

        yawWeight:
          type: uint16
          unit: Scaled (0-4000)
          description: Sets yaw weight from `(value / 1000.0) - 2.0
    reply: null

  MSP2_COMMON_SETTING_INFO:
    id: 4103
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Gets detailed information about a specific configuration setting (name, type, range, flags, current value, etc.).
    variable_len: true
    request: null
    reply:
      fields:
        settingName:
          type: cstring
          description: Null-terminated setting name

        pgn:
          type: uint16
          description: Parameter Group Number (PGN) ID

        type:
          type: uint8
          description: Variable type (`VAR_UINT8`, `VAR_FLOAT`, etc.)

        section:
          type: uint8
          description: Setting section (`MASTER_VALUE`, `PROFILE_VALUE`, etc.)

        mode:
          type: uint8
          description: Setting mode (`MODE_NORMAL`, `MODE_LOOKUP`, etc.)

        minValue:
          type: int32
          description: Minimum allowed value (as signed 32-bit)

        maxValue:
          type: uint32
          description: Maximum allowed value (as unsigned 32-bit)

        settingIndex:
          type: uint16
          description: Absolute index of the setting

        profileIndex:
          type: uint8
          description: Current profile index (if applicable, else 0)

        profileCount:
          type: uint8
          description: Total number of profiles (if applicable, else 0)

        lookupNames:
          type: cstring
          description: (If `mode == MODE_LOOKUP`) Series of null-terminated strings for each possible value from min to max

        settingValue:
          type: uint8[]
          description: Current raw byte value of the setting

  MSP2_COMMON_PG_LIST:
    id: 4104
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Gets a list of Parameter Group Numbers (PGNs) used by settings, along with the start and end setting indexes for each group. Can request info for a single PGN.
    notes: 'Allows efficient fetching of related settings by group. Record count is not a constant: mspParameterGroupsCommand(): caller may request one PGN or the full PG_ID_FIRST..PG_ID_LAST range, skipping absent groups; read until the payload is exhausted.'
    variable_len: for each PGN found
    request:
      fields:
        pgn:
          type: optional uint16
          description: (Optional) PGN ID to query. If omitted, returns all used PGNs
    reply:
      repeat: until_end
      fields:

        pgn:
          type: uint16
          description: Parameter Group Number (PGN) ID

        startIndex:
          type: uint16
          description: Absolute index of the first setting in this group

        endIndex:
          type: uint16
          description: Absolute index of the last setting in this group

  MSP2_COMMON_SERIAL_CONFIG:
    id: 4105
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Retrieves the configuration for all available serial ports.
    notes: 'Baud rate indexes map to actual baud rates (e.g., 9600, 115200). See `baudRates` array. Record count is not a constant: loops SERIAL_PORT_COUNT, emitting only ports where serialIsPortAvailable(); read until the payload is exhausted.'
    variable_len: for each available serial port
    request: null
    reply:
      repeat: until_end
      fields:
        identifier:
          type: int8
          enum: serialPortIdentifier_e
          description: Port identifier Enum (`serialPortIdentifier_e`)

        functionMask:
          type: uint32
          enum: serialPortFunction_e
          bitmask: true
          description: 'Bitmask: enabled functions (`FUNCTION_*`)'

        mspBaudIndex:
          type: uint8
          description: Baud rate index for MSP function

        gpsBaudIndex:
          type: uint8
          description: Baud rate index for GPS function

        telemetryBaudIndex:
          type: uint8
          description: Baud rate index for Telemetry function

        peripheralBaudIndex:
          type: uint8
          description: Baud rate index for other peripheral functions

  MSP2_COMMON_SET_SERIAL_CONFIG:
    id: 4106
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Sets the configuration for one or more serial ports.
    notes: 'Payload size must be a multiple of the size of one port config entry (1 + 4 + 4 = 9 bytes). Returns error if identifier is invalid or size is incorrect. Baud rate indexes are constrained `BAUD_MIN` to `BAUD_MAX`. Record count is not a constant: mirrors MSP2_COMMON_SERIAL_CONFIG; the sender chooses how many ports to configure; read until the payload is exhausted.'
    variable_len: for each port being configured
    request:
      repeat: until_end
      fields:
        identifier:
          type: int8
          enum: serialPortIdentifier_e
          description: Port identifier Enum (`serialPortIdentifier_e`)

        functionMask:
          type: uint32
          enum: serialPortFunction_e
          bitmask: true
          description: 'Bitmask: functions to enable'

        mspBaudIndex:
          type: uint8
          description: Baud rate index for MSP

        gpsBaudIndex:
          type: uint8
          description: Baud rate index for GPS

        telemetryBaudIndex:
          type: uint8
          description: Baud rate index for Telemetry

        peripheralBaudIndex:
          type: uint8
          description: Baud rate index for peripherals
    reply: null

  MSP2_COMMON_SET_RADAR_POS:
    id: 4107
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Sets the position and status information for a "radar" Point of Interest (POI). Used for displaying other craft/objects on the OSD map.
    notes: Expects 19 bytes. POI index is clamped to `RADAR_MAX_POIS - 1`. Updates the `radar_pois` array.
    request:
      fields:
        poiIndex:
          type: uint8
          unit: Index
          description: Index of the POI slot (0 to `RADAR_MAX_POIS - 1`)

        state:
          type: uint8
          description: Status of the POI (0=undefined, 1=armed, 2=lost)

        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude of the POI

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude of the POI

        altitude:
          type: int32
          unit: cm
          description: Altitude of the POI

        heading:
          type: uint16
          unit: degrees
          description: Heading of the POI

        speed:
          type: uint16
          unit: cm/s
          description: Speed of the POI

        linkQuality:
          type: uint8
          unit: 0-4
          description: Link quality indicator
    reply: null

  MSP2_COMMON_SET_RADAR_ITD:
    id: 4108
    inav_version:
      since: "1.0"
    mspv: 2
    group: common
    description: Sets radar information to display (likely internal/unused).
    notes: Not implemented in INAV `fc_msp.c`.
    not_implemented: true

  MSP2_COMMON_SET_MSP_RC_LINK_STATS:
    id: 4109
    inav_version:
      since: "8.0"
    mspv: 2
    group: common
    description: Provides RC link statistics (RSSI, LQ) to the FC, typically from an MSP-based RC link (like ExpressLRS). Sent periodically by the RC link.
    notes: Requires `USE_RX_MSP`. Expects at least 7 bytes. Updates `rxLinkStatistics` and sets RSSI via `setRSSIFromMSP_RC()` only if `sublinkID` is 0. This message expects **no reply** (`MSP_RESULT_NO_REPLY`).
    request:
      fields:
        sublinkID:
          type: uint8
          description: Sublink identifier (usually 0)

        validLink:
          type: uint8
          unit: Boolean
          description: Indicates if the link is currently valid (not in failsafe)

        rssiPercent:
          type: uint8
          unit: '%'
          description: Uplink RSSI percentage (0-100)

        uplinkRSSI_dBm:
          type: uint8
          unit: -dBm
          description: Uplink RSSI in dBm (sent as positive, e.g., 70 means -70dBm)

        downlinkLQ:
          type: uint8
          unit: '%'
          description: Downlink Link Quality (0-100)

        uplinkLQ:
          type: uint8
          unit: '%'
          description: Uplink Link Quality (0-100)

        uplinkSNR:
          type: int8
          unit: dB
          description: Uplink Signal-to-Noise Ratio
    reply: null

  MSP2_COMMON_SET_MSP_RC_INFO:
    id: 4110
    inav_version:
      since: "8.0"
    mspv: 2
    group: common
    description: Provides additional RC link information (power levels, band, mode) to the FC from an MSP-based RC link. Sent less frequently than link stats.
    notes: Requires `USE_RX_MSP`. Expects at least 15 bytes. Updates `rxLinkStatistics` only if `sublinkID` is 0. Converts band/mode strings to uppercase. This message expects **no reply** (`MSP_RESULT_NO_REPLY`).
    request:
      fields:
        sublinkID:
          type: uint8
          description: Sublink identifier (usually 0)

        uplinkTxPower:
          type: uint16
          unit: mW
          description: Uplink transmitter power level

        downlinkTxPower:
          type: uint16
          unit: mW
          description: Downlink transmitter power level

        band:
          type: char[4]
          description: Operating band string (e.g., "2G4", "900"), null-terminated/padded

        mode:
          type: char[6]
          description: Operating mode/rate string (e.g., "100HZ", "F1000"), null-terminated/padded
    reply: null

  MSP2_COMMON_GET_RADAR_GPS:
    id: 4111
    inav_version:
      since: "9.0"
    mspv: 2
    group: common
    description: Provides the GPS positions (latitude, longitude, altitude) for each radar point of interest.
    notes: Returns the stored GPS coordinates for all radar POIs (`radar_pois[i].gps`).
    request: null
    reply:
      repeat: RADAR_MAX_POIS
      fields:
        poiLatitude:
          type: int32
          unit: deg * 1e7
          description: Latitude of a radar POI

        poiLongitude:
          type: int32
          unit: deg * 1e7
          description: Longitude of a radar POI

        poiAltitude:
          type: int32
          unit: cm
          description: Altitude of a radar POI

  MSP2_SENSOR_RANGEFINDER:
    id: 7937
    inav_version:
      since: "1.0"
    mspv: 2
    group: sensor
    description: Provides rangefinder data (distance, quality) from an external MSP-based sensor.
    notes: Requires `USE_RANGEFINDER_MSP`. Calls `mspRangefinderReceiveNewData()`.
    request:
      fields:
        quality:
          type: uint8
          unit: 0-255
          description: Quality of the measurement

        distanceMm:
          type: int32
          unit: mm
          description: Measured distance. Negative value indicates out of range
    reply: null

  MSP2_SENSOR_OPTIC_FLOW:
    id: 7938
    inav_version:
      since: "1.0"
    mspv: 2
    group: sensor
    description: Provides optical flow data (motion, quality) from an external MSP-based sensor.
    notes: Requires `USE_OPFLOW_MSP`. Calls `mspOpflowReceiveNewData()`.
    request:
      fields:
        quality:
          type: uint8
          description: Quality of the measurement (0-255)

        motionX:
          type: int32
          description: Raw integrated flow value X

        motionY:
          type: int32
          description: Raw integrated flow value Y
    reply: null

  MSP2_SENSOR_GPS:
    id: 7939
    inav_version:
      since: "1.0"
    mspv: 2
    group: sensor
    description: Provides detailed GPS data from an external MSP-based GPS module.
    notes: Requires `USE_GPS_PROTO_MSP`. Calls `mspGPSReceiveNewData()`.
    request:
      fields:
        instance:
          type: uint8
          description: Sensor instance number (for multi-GPS)

        gpsWeek:
          type: uint16
          description: GPS week number (0xFFFF if unavailable)

        msTOW:
          type: uint32
          unit: ms
          description: Milliseconds Time of Week

        fixType:
          type: uint8
          enum: gpsFixType_e
          description: Enum `gpsFixType_e` Type of GPS fix

        satellitesInView:
          type: uint8
          unit: Count
          description: Number of satellites used in solution

        hPosAccuracy:
          type: uint16
          unit: mm
          description: Horizontal position accuracy estimate in milimeters

        vPosAccuracy:
          type: uint16
          unit: mm
          description: Vertical position accuracy estimate in milimeters

        hVelAccuracy:
          type: uint16
          unit: cm/s
          description: Horizontal velocity accuracy estimate

        hdop:
          type: uint16
          unit: HDOP * 100
          description: Horizontal Dilution of Precision

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude

        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude

        mslAltitude:
          type: int32
          unit: cm
          description: Altitude above Mean Sea Level

        nedVelNorth:
          type: int32
          unit: cm/s
          description: North velocity (NED frame)

        nedVelEast:
          type: int32
          unit: cm/s
          description: East velocity (NED frame)

        nedVelDown:
          type: int32
          unit: cm/s
          description: Down velocity (NED frame)

        groundCourse:
          type: uint16
          unit: deg * 100
          description: Ground course (0-36000)

        trueYaw:
          type: uint16
          unit: deg * 100
          description: True heading/yaw (0-36000, 65535 if unavailable)

        year:
          type: uint16
          description: Year (e.g., 2023)

        month:
          type: uint8
          description: Month (1-12)

        day:
          type: uint8
          description: Day of month (1-31)

        hour:
          type: uint8
          description: Hour (0-23)

        min:
          type: uint8
          description: Minute (0-59)

        sec:
          type: uint8
          description: Second (0-59)
    reply: null

  MSP2_SENSOR_COMPASS:
    id: 7940
    inav_version:
      since: "1.0"
    mspv: 2
    group: sensor
    description: Provides magnetometer data from an external MSP-based compass module.
    notes: Requires `USE_MAG_MSP`. Calls `mspMagReceiveNewData()`.
    request:
      fields:
        instance:
          type: uint8
          description: Sensor instance number

        timeMs:
          type: uint32
          unit: ms
          description: Timestamp from the sensor

        magX:
          type: int16
          unit: mGauss
          description: Front component reading

        magY:
          type: int16
          unit: mGauss
          description: Right component reading

        magZ:
          type: int16
          unit: mGauss
          description: Down component reading
    reply: null

  MSP2_SENSOR_BAROMETER:
    id: 7941
    inav_version:
      since: "1.0"
    mspv: 2
    group: sensor
    description: Provides barometer data from an external MSP-based barometer module.
    notes: Requires `USE_BARO_MSP`. Calls `mspBaroReceiveNewData()`.
    request:
      fields:
        instance:
          type: uint8
          description: Sensor instance number

        timeMs:
          type: uint32
          unit: ms
          description: Timestamp from the sensor

        pressurePa:
          type: float32
          unit: Pa
          description: Absolute pressure

        temp:
          type: int16
          unit: 0.01 deg C
          description: Temperature
    reply: null

  MSP2_SENSOR_AIRSPEED:
    id: 7942
    inav_version:
      since: "1.0"
    mspv: 2
    group: sensor
    description: Provides airspeed data from an external MSP-based pitot sensor module.
    notes: Requires `USE_PITOT_MSP`. Calls `mspPitotmeterReceiveNewData()`.
    request:
      fields:
        instance:
          type: uint8
          description: Sensor instance number

        timeMs:
          type: uint32
          unit: ms
          description: Timestamp from the sensor

        diffPressurePa:
          type: float32
          unit: Pa
          description: Differential pressure

        temp:
          type: int16
          unit: 0.01 deg C
          description: Temperature
    reply: null

  MSP2_SENSOR_HEADTRACKER:
    id: 7943
    inav_version:
      since: "8.0"
    mspv: 2
    group: sensor
    description: Provides head tracker orientation data.
    notes: Requires `USE_HEADTRACKER` and `USE_HEADTRACKER_MSP`. Calls `mspHeadTrackerReceiverNewData()`, which rejects any payload whose size is not exactly `sizeof(headtrackerMspMessage_t)` (9 bytes). Layout matches `headtrackerMspMessage_t` in `io/headtracker_msp.h`. `pan`, `tilt` and `roll` are constrained to `HEADTRACKER_RANGE_MIN`..`HEADTRACKER_RANGE_MAX` on receipt.
    request:
      fields:
        version:
          type: uint8
          description: Message version. Currently 0.

        pan:
          type: int16
          description: -2048~2047. Scale is min/max angle for gimbal

        tilt:
          type: int16
          description: -2048~2047. Scale is min/max angle for gimbal

        roll:
          type: int16
          description: -2048~2047. Scale is min/max angle for gimbal

        sensitivity:
          type: int16
          description: -16~15. Scale is min/max angle for gimbal
    reply: null

  MSP2_INAV_STATUS:
    id: 8192
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Provides comprehensive flight controller status, extending `MSP_STATUS_EX` with full arming flags, battery profile, and mixer profile.
    notes: '`sensorStatus` bits follow `packSensorStatus()` (bit 15 indicates hardware failure). `profileAndBattProfile` packs the current config profile in the low nibble and the battery profile in the high nibble. `activeModes` is emitted as a little-endian array of 32-bit words sized to `CHECKBOX_ITEM_COUNT`.'
    request: null
    reply:
      fields:
        cycleTime:
          type: uint16
          unit: "\xB5s"
          description: Main loop cycle time

        i2cErrors:
          type: uint16
          unit: Count
          description: I2C errors

        sensorStatus:
          type: uint16
          enum: sensors_e
          bitmask: true
          description: 'Bitmask: Sensor status'

        cpuLoad:
          type: uint16
          unit: '%'
          description: Average system load percentage

        profileAndBattProfile:
          type: uint8
          unit: Packed
          description: 'Bits 0-3: Config profile index (`getConfigProfile()`), Bits 4-7: Battery profile index (`getConfigBatteryProfile()`)'

        armingFlags:
          type: uint32
          enum: armingFlag_e
          bitmask: true
          description: 'Bitmask: Full 32-bit flight controller arming flags (`armingFlags`)'

        activeModes:
          type: boxBitmask_t
          bitmask: true
          description: Bitmask words for active flight modes (`packBoxModeFlags()`)

        mixerProfile:
          type: uint8
          unit: Index
          description: Current mixer profile index (`getConfigMixerProfile()`)

  MSP2_INAV_OPTICAL_FLOW:
    id: 8193
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Provides data from the optical flow sensor.
    notes: Requires `USE_OPFLOW`.
    request: null
    reply:
      fields:
        quality:
          type: uint8
          unit: 0-255
          description: Raw quality indicator from the sensor (`opflow.rawQuality`). 0 if `USE_OPFLOW` disabled

        flowRateX:
          type: int16
          unit: degrees/s
          description: Optical flow rate X (roll axis) (`RADIANS_TO_DEGREES(opflow.flowRate[X])`). 0 if `USE_OPFLOW` disabled

        flowRateY:
          type: int16
          unit: degrees/s
          description: Optical flow rate Y (pitch axis) (`RADIANS_TO_DEGREES(opflow.flowRate[Y])`). 0 if `USE_OPFLOW` disabled

        bodyRateX:
          type: int16
          unit: degrees/s
          description: Compensated body rate X (roll axis) (`RADIANS_TO_DEGREES(opflow.bodyRate[X])`). 0 if `USE_OPFLOW` disabled

        bodyRateY:
          type: int16
          unit: degrees/s
          description: Compensated body rate Y (pitch axis) (`RADIANS_TO_DEGREES(opflow.bodyRate[Y])`). 0 if `USE_OPFLOW` disabled

  MSP2_INAV_ANALOG:
    id: 8194
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Provides detailed analog sensor readings, superseding `MSP_ANALOG` with higher precision and additional fields.
    notes: Requires `USE_CURRENT_METER`/`USE_ADC` for current-related fields; values fall back to zero when unavailable. Capacity fields are reported in the units configured by `batteryMetersConfig()->capacity_unit` (mAh or mWh).
    request: null
    reply:
      fields:
        batteryFlags:
          type: uint8
          bitmask: true
          description: 'Bitmask: Bit0=Full on plug-in, Bit1=Use capacity thresholds, Bits2-3=`batteryState_e` (`getBatteryState()`), Bits4-7=Cell count (`getBatteryCellCount()`)'

        vbat:
          type: uint16
          unit: 0.01V
          description: Battery voltage (`getBatteryVoltage()`)

        amperage:
          type: int16
          unit: 0.01A
          description: Current draw (`getAmperage()`)

        powerDraw:
          type: uint32
          unit: 0.01W
          description: Power draw (`getPower()`)

        mAhDrawn:
          type: uint32
          unit: mAh
          description: Consumed capacity (`getMAhDrawn()`)

        mWhDrawn:
          type: uint32
          unit: mWh
          description: Consumed energy (`getMWhDrawn()`)

        remainingCapacity:
          type: uint32
          unit: Capacity unit (`batteryMetersConfig()->capacity_unit`)
          description: Estimated remaining capacity (`getBatteryRemainingCapacity()`)

        percentageRemaining:
          type: uint8
          unit: '%'
          description: Estimated remaining capacity percentage (`calculateBatteryPercentage()`)

        rssi:
          type: uint16
          unit: Raw (0-1023)
          description: RSSI value (`getRSSI()`)

  MSP2_INAV_MISC:
    id: 8195
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves miscellaneous configuration settings, superseding `MSP_MISC` with higher precision and capacity fields.
    request: null
    reply:
      fields:
        midRc:
          type: uint16
          unit: PWM
          description: Mid RC value (`PWM_RANGE_MIDDLE`)

        legacyMinThrottle:
          type: uint16
          description: Always 0 (Legacy)
          value: 0

        maxThrottle:
          type: uint16
          unit: PWM
          description: Maximum throttle command (`getMaxThrottle()`)

        minCommand:
          type: uint16
          unit: PWM
          description: Minimum motor command (`motorConfig()->mincommand`)

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Failsafe throttle level (`currentBatteryProfile->failsafe_throttle`)

        gpsType:
          type: uint8
          enum: gpsProvider_e
          description: Enum `gpsProvider_e` GPS provider type (`gpsConfig()->provider`). 0 if `USE_GPS` disabled

        legacyGpsBaud:
          type: uint8
          description: Always 0 (Legacy)
          value: 0

        gpsSbasMode:
          type: uint8
          enum: sbasMode_e
          description: Enum `sbasMode_e` GPS SBAS mode (`gpsConfig()->sbasMode`). 0 if `USE_GPS` disabled

        rssiChannel:
          type: uint8
          unit: Index
          description: RSSI channel index (1-based, 0 disables) (`rxConfig()->rssi_channel`)

        magDeclination:
          type: int16
          unit: 0.1 degrees
          description: Magnetic declination / 10 (`compassConfig()->mag_declination / 10`). 0 if `USE_MAG` disabled

        vbatScale:
          type: uint16
          unit: Scale
          description: Voltage scale (`batteryMetersConfig()->voltage.scale`). 0 if `USE_ADC` disabled

        vbatSource:
          type: uint8
          enum: batVoltageSource_e
          description: Enum `batVoltageSource_e` Voltage source (`batteryMetersConfig()->voltageSource`). 0 if `USE_ADC` disabled

        cellCount:
          type: uint8
          unit: Count
          description: Configured cell count (`currentBatteryProfile->cells`). 0 if `USE_ADC` disabled

        vbatCellDetect:
          type: uint16
          unit: 0.01V
          description: Cell detection voltage (`currentBatteryProfile->voltage.cellDetect`). 0 if `USE_ADC` disabled

        vbatMinCell:
          type: uint16
          unit: 0.01V
          description: Min cell voltage (`currentBatteryProfile->voltage.cellMin`). 0 if `USE_ADC` disabled

        vbatMaxCell:
          type: uint16
          unit: 0.01V
          description: Max cell voltage (`currentBatteryProfile->voltage.cellMax`). 0 if `USE_ADC` disabled

        vbatWarningCell:
          type: uint16
          unit: 0.01V
          description: Warning cell voltage (`currentBatteryProfile->voltage.cellWarning`). 0 if `USE_ADC` disabled

        capacityValue:
          type: uint32
          unit: mAh/mWh
          description: Battery capacity (`currentBatteryProfile->capacity.value`)

        capacityWarning:
          type: uint32
          unit: mAh/mWh
          description: Capacity warning threshold (`currentBatteryProfile->capacity.warning`)

        capacityCritical:
          type: uint32
          unit: mAh/mWh
          description: Capacity critical threshold (`currentBatteryProfile->capacity.critical`)

        capacityUnit:
          type: uint8
          enum: batCapacityUnit_e
          description: Enum `batCapacityUnit_e` Capacity unit (`batteryMetersConfig()->capacity_unit`)

  MSP2_INAV_SET_MISC:
    id: 8196
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets miscellaneous configuration settings, superseding `MSP_SET_MISC`.
    notes: Expects 41 bytes. Performs validation on `vbatSource` and `capacityUnit`.
    request:
      fields:
        midRc:
          type: uint16
          unit: PWM
          description: Ignored

        legacyMinThrottle:
          type: uint16
          description: Ignored

        legacyMaxThrottle:
          type: uint16
          description: Ignored

        minCommand:
          type: uint16
          unit: PWM
          description: Sets `motorConfigMutable()->mincommand` (constrained)

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->failsafe_throttle` (constrained)

        gpsType:
          type: uint8
          enum: gpsProvider_e
          description: Enum `gpsProvider_e` Sets `gpsConfigMutable()->provider` (if `USE_GPS`)

        legacyGpsBaud:
          type: uint8
          description: Ignored

        gpsSbasMode:
          type: uint8
          enum: sbasMode_e
          description: Enum `sbasMode_e` Sets `gpsConfigMutable()->sbasMode` (if `USE_GPS`)

        rssiChannel:
          type: uint8
          unit: Index
          description: Sets `rxConfigMutable()->rssi_channel` (1-based, 0 disables) when <= `MAX_SUPPORTED_RC_CHANNEL_COUNT`

        magDeclination:
          type: int16
          unit: 0.1 degrees
          description: Sets `compassConfigMutable()->mag_declination = value * 10` (if `USE_MAG`)

        vbatScale:
          type: uint16
          unit: Scale
          description: Sets `batteryMetersConfigMutable()->voltage.scale` (if `USE_ADC`)

        vbatSource:
          type: uint8
          enum: batVoltageSource_e
          description: Enum `batVoltageSource_e` Sets `batteryMetersConfigMutable()->voltageSource` (if `USE_ADC`, validated)

        cellCount:
          type: uint8
          unit: Count
          description: Sets `currentBatteryProfileMutable->cells` (if `USE_ADC`)

        vbatCellDetect:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellDetect` (if `USE_ADC`)

        vbatMinCell:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellMin` (if `USE_ADC`)

        vbatMaxCell:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellMax` (if `USE_ADC`)

        vbatWarningCell:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellWarning` (if `USE_ADC`)

        capacityValue:
          type: uint32
          unit: mAh/mWh
          description: Sets `currentBatteryProfileMutable->capacity.value`

        capacityWarning:
          type: uint32
          unit: mAh/mWh
          description: Sets `currentBatteryProfileMutable->capacity.warning`

        capacityCritical:
          type: uint32
          unit: mAh/mWh
          description: Sets `currentBatteryProfileMutable->capacity.critical`

        capacityUnit:
          type: uint8
          enum: batCapacityUnit_e
          description: Enum `batCapacityUnit_e` Sets `batteryMetersConfigMutable()->capacity_unit` (validated, updates OSD energy unit if changed)
    reply: null

  MSP2_INAV_BATTERY_CONFIG:
    id: 8197
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the configuration specific to the battery voltage and current sensors and capacity settings for the current battery profile.
    notes: Fields are 0 if `USE_ADC` is not defined.
    request: null
    reply:
      fields:
        vbatScale:
          type: uint16
          unit: Scale
          description: Voltage scale (`batteryMetersConfig()->voltage.scale`)

        vbatSource:
          type: uint8
          enum: batVoltageSource_e
          description: Enum `batVoltageSource_e` Voltage source (`batteryMetersConfig()->voltageSource`)

        cellCount:
          type: uint8
          unit: Count
          description: Configured cell count (`currentBatteryProfile->cells`)

        vbatCellDetect:
          type: uint16
          unit: 0.01V
          description: Cell detection voltage (`currentBatteryProfile->voltage.cellDetect`)

        vbatMinCell:
          type: uint16
          unit: 0.01V
          description: Min cell voltage (`currentBatteryProfile->voltage.cellMin`)

        vbatMaxCell:
          type: uint16
          unit: 0.01V
          description: Max cell voltage (`currentBatteryProfile->voltage.cellMax`)

        vbatWarningCell:
          type: uint16
          unit: 0.01V
          description: Warning cell voltage (`currentBatteryProfile->voltage.cellWarning`)

        currentOffset:
          type: int16
          unit: mV
          description: Current sensor offset (`batteryMetersConfig()->current.offset`)

        currentScale:
          type: int16
          unit: 0.1 mV/A
          description: Current sensor scale (`batteryMetersConfig()->current.scale`)

        capacityValue:
          type: uint32
          unit: mAh/mWh
          description: Battery capacity (`currentBatteryProfile->capacity.value`)

        capacityWarning:
          type: uint32
          unit: mAh/mWh
          description: Capacity warning threshold (`currentBatteryProfile->capacity.warning`)

        capacityCritical:
          type: uint32
          unit: mAh/mWh
          description: Capacity critical threshold (`currentBatteryProfile->capacity.critical`)

        capacityUnit:
          type: uint8
          enum: batCapacityUnit_e
          description: Enum `batCapacityUnit_e` Capacity unit (`batteryMetersConfig()->capacity_unit`)

  MSP2_INAV_SET_BATTERY_CONFIG:
    id: 8198
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the battery voltage/current sensor configuration and capacity settings for the current battery profile.
    notes: Expects 29 bytes. Performs validation on `vbatSource` and `capacityUnit`.
    request:
      fields:
        vbatScale:
          type: uint16
          unit: Scale
          description: Sets `batteryMetersConfigMutable()->voltage.scale` (if `USE_ADC`)

        vbatSource:
          type: uint8
          enum: batVoltageSource_e
          description: Enum `batVoltageSource_e` Sets `batteryMetersConfigMutable()->voltageSource` (if `USE_ADC`, validated)

        cellCount:
          type: uint8
          unit: Count
          description: Sets `currentBatteryProfileMutable->cells` (if `USE_ADC`)

        vbatCellDetect:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellDetect` (if `USE_ADC`)

        vbatMinCell:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellMin` (if `USE_ADC`)

        vbatMaxCell:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellMax` (if `USE_ADC`)

        vbatWarningCell:
          type: uint16
          unit: 0.01V
          description: Sets `currentBatteryProfileMutable->voltage.cellWarning` (if `USE_ADC`)

        currentOffset:
          type: int16
          unit: mV
          description: Sets `batteryMetersConfigMutable()->current.offset`

        currentScale:
          type: int16
          unit: 0.1 mV/A
          description: Sets `batteryMetersConfigMutable()->current.scale`

        capacityValue:
          type: uint32
          unit: mAh/mWh
          description: Sets `currentBatteryProfileMutable->capacity.value`

        capacityWarning:
          type: uint32
          unit: mAh/mWh
          description: Sets `currentBatteryProfileMutable->capacity.warning`

        capacityCritical:
          type: uint32
          unit: mAh/mWh
          description: Sets `currentBatteryProfileMutable->capacity.critical`

        capacityUnit:
          type: uint8
          enum: batCapacityUnit_e
          description: Enum `batCapacityUnit_e` Sets `batteryMetersConfigMutable()->capacity_unit` (validated, updates OSD energy unit if changed)
    reply: null

  MSP2_INAV_RATE_PROFILE:
    id: 8199
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the rates and expos for the current control rate profile, including both stabilized and manual flight modes. Supersedes `MSP_RC_TUNING`.
    request: null
    reply:
      fields:
        throttleMid:
          type: uint8
          description: Throttle Midpoint (`currentControlRateProfile->throttle.rcMid8`)

        throttleExpo:
          type: uint8
          description: Throttle Expo (`currentControlRateProfile->throttle.rcExpo8`)

        dynamicThrottlePID:
          type: uint8
          description: TPA value (`currentControlRateProfile->throttle.dynPID`)

        tpaBreakpoint:
          type: uint16
          description: TPA breakpoint (`currentControlRateProfile->throttle.tpa_breakpoint`)

        stabRcExpo:
          type: uint8
          description: Stabilized Roll/Pitch Expo (`currentControlRateProfile->stabilized.rcExpo8`)

        stabRcYawExpo:
          type: uint8
          description: Stabilized Yaw Expo (`currentControlRateProfile->stabilized.rcYawExpo8`)

        stabRollRate:
          type: uint8
          description: Stabilized Roll Rate (`currentControlRateProfile->stabilized.rates[FD_ROLL]`)

        stabPitchRate:
          type: uint8
          description: Stabilized Pitch Rate (`currentControlRateProfile->stabilized.rates[FD_PITCH]`)

        stabYawRate:
          type: uint8
          description: Stabilized Yaw Rate (`currentControlRateProfile->stabilized.rates[FD_YAW]`)

        manualRcExpo:
          type: uint8
          description: Manual Roll/Pitch Expo (`currentControlRateProfile->manual.rcExpo8`)

        manualRcYawExpo:
          type: uint8
          description: Manual Yaw Expo (`currentControlRateProfile->manual.rcYawExpo8`)

        manualRollRate:
          type: uint8
          description: Manual Roll Rate (`currentControlRateProfile->manual.rates[FD_ROLL]`)

        manualPitchRate:
          type: uint8
          description: Manual Pitch Rate (`currentControlRateProfile->manual.rates[FD_PITCH]`)

        manualYawRate:
          type: uint8
          description: Manual Yaw Rate (`currentControlRateProfile->manual.rates[FD_YAW]`)

  MSP2_INAV_SET_RATE_PROFILE:
    id: 8200
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the rates and expos for the current control rate profile (stabilized and manual). Supersedes `MSP_SET_RC_TUNING`.
    notes: Expects 15 bytes. Constraints applied to rates based on axis.
    request:
      fields:
        throttleMid:
          type: uint8
          description: Sets `currentControlRateProfile->throttle.rcMid8`

        throttleExpo:
          type: uint8
          description: Sets `currentControlRateProfile->throttle.rcExpo8`

        dynamicThrottlePID:
          type: uint8
          description: Sets `currentControlRateProfile->throttle.dynPID`

        tpaBreakpoint:
          type: uint16
          description: Sets `currentControlRateProfile->throttle.tpa_breakpoint`

        stabRcExpo:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rcExpo8`

        stabRcYawExpo:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rcYawExpo8`

        stabRollRate:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rates[FD_ROLL]` (constrained)

        stabPitchRate:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rates[FD_PITCH]` (constrained)

        stabYawRate:
          type: uint8
          description: Sets `currentControlRateProfile->stabilized.rates[FD_YAW]` (constrained)

        manualRcExpo:
          type: uint8
          description: Sets `currentControlRateProfile->manual.rcExpo8`

        manualRcYawExpo:
          type: uint8
          description: Sets `currentControlRateProfile->manual.rcYawExpo8`

        manualRollRate:
          type: uint8
          description: Sets `currentControlRateProfile->manual.rates[FD_ROLL]` (constrained)

        manualPitchRate:
          type: uint8
          description: Sets `currentControlRateProfile->manual.rates[FD_PITCH]` (constrained)

        manualYawRate:
          type: uint8
          description: Sets `currentControlRateProfile->manual.rates[FD_YAW]` (constrained)
    reply: null

  MSP2_INAV_AIR_SPEED:
    id: 8201
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the estimated or measured airspeed.
    notes: Requires `USE_PITOT`; returns 0 when pitot functionality is not enabled or calibrated.
    request: null
    reply:
      fields:
        airspeed:
          type: uint32
          unit: cm/s
          description: Estimated/measured airspeed (`getAirspeedEstimate()`, cm/s). 0 if unavailable

  MSP2_INAV_OUTPUT_MAPPING:
    id: 8202
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the output mapping configuration (identifies which timer outputs are used for Motors/Servos). Legacy version sending only 8-bit usage flags.
    notes: 'Superseded by `MSP2_INAV_OUTPUT_MAPPING_EXT2`. Only includes timers *not* used for PPM/PWM input. Record count is not a constant: loops timerHardwareCount, skipping timers flagged TIM_USE_PPM or TIM_USE_PWM; read until the payload is exhausted.'
    variable_len: for each Motor/Servo timer
    request: null
    reply:
      repeat: until_end
      fields:
        usageFlags:
          type: uint8
          description: Timer usage flags (lower 8 bits of `timerHardware[i].usageFlags`, e.g. `TIM_USE_MOTOR`, `TIM_USE_SERVO`)

  MSP2_INAV_MC_BRAKING:
    id: 8203
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves configuration parameters for the multirotor braking mode feature.
    notes: Payload is empty if `USE_MR_BRAKING_MODE` is not defined.
    request: null
    reply:
      fields:
        brakingSpeedThreshold:
          type: uint16
          unit: cm/s
          description: Speed above which braking engages (`navConfig()->mc.braking_speed_threshold`)

        brakingDisengageSpeed:
          type: uint16
          unit: cm/s
          description: Speed below which braking disengages (`navConfig()->mc.braking_disengage_speed`)

        brakingTimeout:
          type: uint16
          unit: ms
          description: Timeout before braking force reduces (`navConfig()->mc.braking_timeout`)

        brakingBoostFactor:
          type: uint8
          unit: '%'
          description: Boost factor applied during braking (`navConfig()->mc.braking_boost_factor`)

        brakingBoostTimeout:
          type: uint16
          unit: ms
          description: Timeout for the boost factor (`navConfig()->mc.braking_boost_timeout`)

        brakingBoostSpeedThreshold:
          type: uint16
          unit: cm/s
          description: Speed threshold for boost engagement (`navConfig()->mc.braking_boost_speed_threshold`)

        brakingBoostDisengageSpeed:
          type: uint16
          unit: cm/s
          description: Speed threshold for boost disengagement (`navConfig()->mc.braking_boost_disengage_speed`)

        brakingBankAngle:
          type: uint8
          unit: degrees
          description: Maximum bank angle allowed during braking (`navConfig()->mc.braking_bank_angle`)

  MSP2_INAV_SET_MC_BRAKING:
    id: 8204
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets configuration parameters for the multirotor braking mode feature.
    notes: Expects 14 bytes. Returns error if `USE_MR_BRAKING_MODE` is not defined.
    request:
      fields:
        brakingSpeedThreshold:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->mc.braking_speed_threshold`

        brakingDisengageSpeed:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->mc.braking_disengage_speed`

        brakingTimeout:
          type: uint16
          unit: ms
          description: Sets `navConfigMutable()->mc.braking_timeout`

        brakingBoostFactor:
          type: uint8
          unit: '%'
          description: Sets `navConfigMutable()->mc.braking_boost_factor`

        brakingBoostTimeout:
          type: uint16
          unit: ms
          description: Sets `navConfigMutable()->mc.braking_boost_timeout`

        brakingBoostSpeedThreshold:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->mc.braking_boost_speed_threshold`

        brakingBoostDisengageSpeed:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->mc.braking_boost_disengage_speed`

        brakingBankAngle:
          type: uint8
          unit: degrees
          description: Sets `navConfigMutable()->mc.braking_bank_angle`
    reply: null

  MSP2_INAV_OUTPUT_MAPPING_EXT:
    id: 8205
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Retrieves extended output mapping configuration (timer ID and usage flags). Obsolete, use `MSP2_INAV_OUTPUT_MAPPING_EXT2`.
    notes: 'Usage flags are truncated to 8 bits. `timerId` mapping is target-specific. Record count is not a constant: loops timerHardwareCount, skipping timers flagged TIM_USE_PPM or TIM_USE_PWM; read until the payload is exhausted.'
    variable_len: for each Motor/Servo timer
    request: null
    reply:
      repeat: until_end
      fields:
        timerId:
          type: uint8
          description: Hardware timer identifier (e.g., `TIM1`, `TIM2`). Value depends on target

        usageFlags:
          type: uint8
          description: Timer usage flags (lower 8 bits of `timerHardware[i].usageFlags`, e.g. `TIM_USE_MOTOR`, `TIM_USE_SERVO`)

  MSP2_INAV_TIMER_OUTPUT_MODE:
    id: 8206
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Reads timer output mode overrides.
    notes: Non-SITL only. HARDWARE_TIMER_DEFINITION_COUNT is target specific. Returns MSP_RESULT_ACK on success, MSP_RESULT_ERROR on invalid timer index.
    variable_len: true
    variants:
      dataSize == 0:
        description: List all timers
        request: null
        reply:
          repeat: HARDWARE_TIMER_DEFINITION_COUNT
          fields:
            timerIndex:
              type: uint8
              description: Timer index

            outputMode:
              type: uint8
              enum: outputMode_e
              description: OUTPUT_MODE_*
      dataSize == 1:
        description: Query one timer
        request:
          fields:

            timerIndex:
              type: uint8
              description: 0..HARDWARE_TIMER_DEFINITION_COUNT-1
        reply:
          fields:

            timerIndex:
              type: uint8
              description: Echoed timer index

            outputMode:
              type: uint8
              enum: outputMode_e
              description: OUTPUT_MODE_*

  MSP2_INAV_SET_TIMER_OUTPUT_MODE:
    id: 8207
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Set the output mode override for a specific hardware timer.
    notes: Only available on non-SITL builds. Expects 2 bytes. Returns error if `timerIndex` is invalid.
    request:
      fields:
        timerIndex:
          type: uint8
          description: Index of the hardware timer definition

        outputMode:
          type: uint8
          enum: outputMode_e
          description: Output mode override (`outputMode_e` enum) to set
    reply: null

  MSP2_INAV_MIXER:
    id: 8208
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves INAV-specific mixer configuration details.
    request: null
    reply:
      fields:
        motorDirectionInverted:
          type: uint8
          description: 'Boolean: 1 if motor direction is reversed globally (`mixerConfig()->motorDirectionInverted`)'

        reserved1:
          type: uint8
          description: Always 0 (Was yaw jump prevention limit)
          value: 0

        motorStopOnLow:
          type: uint8
          description: 'Boolean: 1 if motors stop at minimum throttle (`mixerConfig()->motorstopOnLow`)'

        platformType:
          type: uint8
          enum: flyingPlatformType_e
          description: Enum (`mixerConfig()->platformType`)

        hasFlaps:
          type: uint8
          description: 'Boolean: 1 if the current mixer configuration includes flaps (`mixerConfig()->hasFlaps`)'

        appliedMixerPreset:
          type: int16
          description: 'Mixer preset currently applied (`mixerConfig()->appliedMixerPreset`). Plain integer, not an enum: the firmware never interprets it and only stores whatever the configurator wrote, defaulting to `SETTING_MODEL_PREVIEW_TYPE_DEFAULT`.'

        maxMotors:
          type: uint8
          description: 'Constant: Maximum motors supported (`MAX_SUPPORTED_MOTORS`)'

        maxServos:
          type: uint8
          description: 'Constant: Maximum servos supported (`MAX_SUPPORTED_SERVOS`)'

  MSP2_INAV_SET_MIXER:
    id: 8209
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets INAV-specific mixer configuration details.
    notes: Expects 9 bytes. Calls `mixerUpdateStateFlags()`.
    request:
      fields:
        motorDirectionInverted:
          type: uint8
          description: Sets `mixerConfigMutable()->motorDirectionInverted`

        reserved1:
          type: uint8
          description: Ignored

        motorStopOnLow:
          type: uint8
          description: Sets `mixerConfigMutable()->motorstopOnLow`

        platformType:
          type: uint8
          enum: flyingPlatformType_e
          description: Sets `mixerConfigMutable()->platformType`

        hasFlaps:
          type: uint8
          description: Sets `mixerConfigMutable()->hasFlaps`

        appliedMixerPreset:
          type: int16
          description: Sets `mixerConfigMutable()->appliedMixerPreset`

        maxMotors:
          type: uint8
          description: Ignored

        maxServos:
          type: uint8
          description: Ignored
    reply: null

  MSP2_INAV_OSD_LAYOUTS:
    id: 8210
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves OSD layout metadata or item positions for specific layouts/items.
    notes: Requires `USE_OSD`. Returns `MSP_RESULT_ACK` on success, `MSP_RESULT_ERROR` if indexes are out of range.
    variants:
      dataSize == 0:
        description: Query layout/item counts
        request: null
        reply:
          fields:
            layoutCount:
              type: uint8
              description: Number of OSD layouts (`OSD_LAYOUT_COUNT`)

            itemCount:
              type: uint8
              description: Number of OSD items per layout (`OSD_ITEM_COUNT`)
      dataSize == 1:
        description: Fetch all item positions for a layout
        request:
          fields:

            layoutIndex:
              type: uint8
              description: Layout index (0 to `OSD_LAYOUT_COUNT - 1`)
        reply:
          repeat: OSD_ITEM_COUNT
          fields:

            itemPosition:
              type: uint16
              unit: packed coords
              description: Packed X/Y position (`osdLayoutsConfig()->item_pos[layoutIndex][item]`)
      dataSize == 3:
        description: Fetch a single item position
        request:
          fields:

            layoutIndex:
              type: uint8
              description: Layout index (0 to `OSD_LAYOUT_COUNT - 1`)

            itemIndex:
              type: uint16
              description: OSD item index (0 to `OSD_ITEM_COUNT - 1`)
        reply:
          fields:

            itemPosition:
              type: uint16
              unit: packed coords
              description: Packed X/Y position (`osdLayoutsConfig()->item_pos[layoutIndex][itemIndex]`)

  MSP2_INAV_OSD_SET_LAYOUT_ITEM:
    id: 8211
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the position of a single OSD item within a specific layout.
    notes: Requires `USE_OSD`. Expects 4 bytes. Returns error if indexes are invalid. If the modified layout is not the currently active one, it temporarily overrides the active layout for 10 seconds to show the change. Otherwise, triggers a full OSD redraw.
    request:
      fields:
        layoutIndex:
          type: uint8
          unit: Index
          description: Index of the OSD layout (0 to `OSD_LAYOUT_COUNT - 1`)

        itemIndex:
          type: uint8
          unit: Index
          description: Index of the OSD item

        itemPosition:
          type: uint16
          unit: Coordinates
          description: Packed X/Y position using `OSD_POS(x, y)` with `OSD_VISIBLE_FLAG` bit
    reply: null

  MSP2_INAV_OSD_ALARMS:
    id: 8212
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves OSD alarm threshold settings.
    notes: Requires `USE_OSD`.
    request: null
    reply:
      fields:
        rssiAlarm:
          type: uint8
          unit: '%'
          description: RSSI alarm threshold (`osdConfig()->rssi_alarm`)

        timerAlarm:
          type: uint16
          unit: seconds
          description: Timer alarm threshold (`osdConfig()->time_alarm`)

        altAlarm:
          type: uint16
          unit: meters
          description: Altitude alarm threshold (`osdConfig()->alt_alarm`)

        distAlarm:
          type: uint16
          unit: meters
          description: Distance alarm threshold (`osdConfig()->dist_alarm`)

        negAltAlarm:
          type: uint16
          unit: meters
          description: Negative altitude alarm threshold (`osdConfig()->neg_alt_alarm`)

        gForceAlarm:
          type: uint16
          unit: G * 1000
          description: G-force alarm threshold (`osdConfig()->gforce_alarm * 1000`)

        gForceAxisMinAlarm:
          type: int16
          unit: G * 1000
          description: Min G-force per-axis alarm (`osdConfig()->gforce_axis_alarm_min * 1000`)

        gForceAxisMaxAlarm:
          type: int16
          unit: G * 1000
          description: Max G-force per-axis alarm (`osdConfig()->gforce_axis_alarm_max * 1000`)

        currentAlarm:
          type: uint8
          unit: A
          description: Current draw alarm threshold (`osdConfig()->current_alarm`)

        imuTempMinAlarm:
          type: int16
          unit: degrees C
          description: Min IMU temperature alarm (`osdConfig()->imu_temp_alarm_min`)

        imuTempMaxAlarm:
          type: int16
          unit: degrees C
          description: Max IMU temperature alarm (`osdConfig()->imu_temp_alarm_max`)

        baroTempMinAlarm:
          type: int16
          unit: degrees C
          description: Min Baro temperature alarm (`osdConfig()->baro_temp_alarm_min`). 0 if `USE_BARO` disabled

        baroTempMaxAlarm:
          type: int16
          unit: degrees C
          description: Max Baro temperature alarm (`osdConfig()->baro_temp_alarm_max`). 0 if `USE_BARO` disabled

        adsbWarnDistance:
          type: uint16
          unit: meters
          description: ADSB warning distance (`osdConfig()->adsb_distance_warning`). 0 if `USE_ADSB` disabled

        adsbAlertDistance:
          type: uint16
          unit: meters
          description: ADSB alert distance (`osdConfig()->adsb_distance_alert`). 0 if `USE_ADSB` disabled

  MSP2_INAV_OSD_SET_ALARMS:
    id: 8213
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets OSD alarm threshold settings.
    notes: Requires `USE_OSD`. Expects 24 bytes. ADSB alarms are not settable via this message.
    request:
      fields:
        rssiAlarm:
          type: uint8
          unit: '%'
          description: Sets `osdConfigMutable()->rssi_alarm

        timerAlarm:
          type: uint16
          unit: seconds
          description: Sets `osdConfigMutable()->time_alarm

        altAlarm:
          type: uint16
          unit: meters
          description: Sets `osdConfigMutable()->alt_alarm

        distAlarm:
          type: uint16
          unit: meters
          description: Sets `osdConfigMutable()->dist_alarm

        negAltAlarm:
          type: uint16
          unit: meters
          description: Sets `osdConfigMutable()->neg_alt_alarm`

        gForceAlarm:
          type: uint16
          unit: G * 1000
          description: Sets `osdConfigMutable()->gforce_alarm = value / 1000.0f`

        gForceAxisMinAlarm:
          type: int16
          unit: G * 1000
          description: Sets `osdConfigMutable()->gforce_axis_alarm_min = value / 1000.0f`

        gForceAxisMaxAlarm:
          type: int16
          unit: G * 1000
          description: Sets `osdConfigMutable()->gforce_axis_alarm_max = value / 1000.0f`

        currentAlarm:
          type: uint8
          unit: A
          description: Sets `osdConfigMutable()->current_alarm`

        imuTempMinAlarm:
          type: int16
          unit: degrees C
          description: Sets `osdConfigMutable()->imu_temp_alarm_min`

        imuTempMaxAlarm:
          type: int16
          unit: degrees C
          description: Sets `osdConfigMutable()->imu_temp_alarm_max`

        baroTempMinAlarm:
          type: int16
          unit: degrees C
          description: Sets `osdConfigMutable()->baro_temp_alarm_min` (if `USE_BARO`)

        baroTempMaxAlarm:
          type: int16
          unit: degrees C
          description: Sets `osdConfigMutable()->baro_temp_alarm_max` (if `USE_BARO`)
    reply: null

  MSP2_INAV_OSD_PREFERENCES:
    id: 8214
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves OSD display preferences (video system, units, styles, etc.).
    notes: Requires `USE_OSD`.
    request: null
    reply:
      fields:
        videoSystem:
          type: uint8
          enum: videoSystem_e
          description: 'Enum `videoSystem_e`: Video system (Auto/PAL/NTSC) (`osdConfig()->video_system`)'

        mainVoltageDecimals:
          type: uint8
          description: 'Count: Decimal places for main voltage display (`osdConfig()->main_voltage_decimals`)'

        ahiReverseRoll:
          type: uint8
          description: 'Boolean: Reverse roll direction on Artificial Horizon (`osdConfig()->ahi_reverse_roll`)'

        crosshairsStyle:
          type: uint8
          enum: osd_crosshairs_style_e
          description: 'Enum `osd_crosshairs_style_e`: Style of the center crosshairs (`osdConfig()->crosshairs_style`)'

        leftSidebarScroll:
          type: uint8
          enum: osd_sidebar_scroll_e
          description: 'Enum `osd_sidebar_scroll_e`: Left sidebar scroll behavior (`osdConfig()->left_sidebar_scroll`)'

        rightSidebarScroll:
          type: uint8
          enum: osd_sidebar_scroll_e
          description: 'Enum `osd_sidebar_scroll_e`: Right sidebar scroll behavior (`osdConfig()->right_sidebar_scroll`)'

        sidebarScrollArrows:
          type: uint8
          description: 'Boolean: Show arrows for scrollable sidebars (`osdConfig()->sidebar_scroll_arrows`)'

        units:
          type: uint8
          enum: osd_unit_e
          description: 'Enum: `osd_unit_e` Measurement units (Metric/Imperial) (`osdConfig()->units`)'

        statsEnergyUnit:
          type: uint8
          enum: osd_stats_energy_unit_e
          description: 'Enum `osd_stats_energy_unit_e`: Unit for energy display in post-flight stats (`osdConfig()->stats_energy_unit`)'

        adsbWarningStyle:
          type: uint8
          description: 'Enum `osd_adsb_warning_style_e`: How ADSB proximity warnings are drawn (`osdConfig()->adsb_warning_style`). 0 if `USE_ADSB` disabled'

  MSP2_INAV_OSD_SET_PREFERENCES:
    id: 8215
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets OSD display preferences.
    notes: Requires `USE_OSD`. Expects 9 bytes. Triggers a full OSD redraw.
    request:
      fields:
        videoSystem:
          type: uint8
          enum: videoSystem_e
          description: Sets `osdConfigMutable()->video_system`

        mainVoltageDecimals:
          type: uint8
          description: Sets `osdConfigMutable()->main_voltage_decimals`

        ahiReverseRoll:
          type: uint8
          description: Sets `osdConfigMutable()->ahi_reverse_roll`

        crosshairsStyle:
          type: uint8
          enum: osd_crosshairs_style_e
          description: Sets `osdConfigMutable()->crosshairs_style`

        leftSidebarScroll:
          type: uint8
          enum: osd_sidebar_scroll_e
          description: Sets `osdConfigMutable()->left_sidebar_scroll`

        rightSidebarScroll:
          type: uint8
          enum: osd_sidebar_scroll_e
          description: Sets `osdConfigMutable()->right_sidebar_scroll`

        sidebarScrollArrows:
          type: uint8
          description: Sets `osdConfigMutable()->sidebar_scroll_arrows`

        units:
          type: uint8
          enum: osd_unit_e
          description: Sets `osdConfigMutable()->units` (enum `osd_unit_e`)

        statsEnergyUnit:
          type: uint8
          enum: osd_stats_energy_unit_e
          description: Sets `osdConfigMutable()->stats_energy_unit`

        adsbWarningStyle:
          type: optional uint8
          description: Sets `osdConfigMutable()->adsb_warning_style`. Only read when the payload is at least 10 bytes and the firmware has `USE_ADSB`
    reply: null

  MSP2_INAV_SELECT_BATTERY_PROFILE:
    id: 8216
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Selects the active battery profile and saves configuration.
    notes: Expects 1 byte. Will fail if armed. Calls `setConfigBatteryProfileAndWriteEEPROM()`.
    request:
      fields:
        batteryProfileIndex:
          type: uint8
          description: Index of the battery profile to activate (0-based)
    reply: null

  MSP2_INAV_DEBUG:
    id: 8217
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves values from the firmware's 32-bit `debug[]` array. Supersedes `MSP_DEBUG`.
    notes: '`DEBUG32_VALUE_COUNT` is usually 8.'
    variable_len: true
    request: null
    reply:
      fields:
        debugValues:
          type: int32[DEBUG32_VALUE_COUNT]
          description: Values from the `debug` array (signed, typically 8 entries)

  MSP2_BLACKBOX_CONFIG:
    id: 8218
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the Blackbox configuration. Supersedes `MSP_BLACKBOX_CONFIG`.
    notes: If `USE_BLACKBOX` is disabled, only the first four fields are returned (all zero).
    request: null
    reply:
      fields:
        blackboxSupported:
          type: uint8
          description: 'Boolean: 1 if Blackbox is supported (`USE_BLACKBOX`), 0 otherwise'

        blackboxDevice:
          type: uint8
          enum: BlackboxDevice
          description: 'Enum `BlackboxDevice`: Target device for logging (`blackboxConfig()->device`). 0 if not supported'

        blackboxRateNum:
          type: uint16
          description: Numerator for logging rate divider (`blackboxConfig()->rate_num`). 0 if not supported

        blackboxRateDenom:
          type: uint16
          description: Denominator for logging rate divider (`blackboxConfig()->rate_denom`). 0 if not supported

        blackboxIncludeFlags:
          type: optional uint32
          bitmask: true
          description: 'Bitmask: Flags for fields included/excluded from logging (`blackboxConfig()->includeFlags`). Absent when the firmware was built without `USE_BLACKBOX`, which replies with the first 6 bytes only'

  MSP2_SET_BLACKBOX_CONFIG:
    id: 8219
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the Blackbox configuration. Supersedes `MSP_SET_BLACKBOX_CONFIG`.
    notes: Requires `USE_BLACKBOX`. Expects 9 bytes. Returns error if Blackbox is currently logging (`!blackboxMayEditConfig()`).
    request:
      fields:
        blackboxDevice:
          type: uint8
          enum: BlackboxDevice
          description: Sets `blackboxConfigMutable()->device`

        blackboxRateNum:
          type: uint16
          description: Sets `blackboxConfigMutable()->rate_num`

        blackboxRateDenom:
          type: uint16
          description: Sets `blackboxConfigMutable()->rate_denom`

        blackboxIncludeFlags:
          type: uint32
          description: Sets `blackboxConfigMutable()->includeFlags`
    reply: null

  MSP2_INAV_TEMP_SENSOR_CONFIG:
    id: 8220
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the configuration for all onboard temperature sensors.
    notes: Requires `USE_TEMPERATURE_SENSOR`.
    variable_len: MAX_TEMP_SENSORS
    request: null
    reply:
      repeat: MAX_TEMP_SENSORS
      fields:
        type:
          type: uint8
          enum: tempSensorType_e
          description: 'Enum (`tempSensorType_e`): Type of the temperature sensor'

        address:
          type: uint64
          description: Sensor address/ID (e.g., for 1-Wire sensors)

        alarmMin:
          type: int16
          unit: "0.1\xB0C"
          description: Min temperature alarm threshold (`sensorConfig->alarm_min`)

        alarmMax:
          type: int16
          unit: "0.1\xB0C"
          description: Max temperature alarm threshold (`sensorConfig->alarm_max`)

        osdSymbol:
          type: uint8
          description: 'Index: OSD symbol to use for this sensor (0 to `TEMP_SENSOR_SYM_COUNT`)'

        label:
          type: char[TEMPERATURE_LABEL_LEN]
          description: User-defined label for the sensor

  MSP2_INAV_SET_TEMP_SENSOR_CONFIG:
    id: 8221
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the configuration for all onboard temperature sensors.
    notes: Requires `USE_TEMPERATURE_SENSOR`. Payload must include `MAX_TEMP_SENSORS` consecutive `tempSensorConfig_t` structures (labels are uppercased).
    request:
      repeat: MAX_TEMP_SENSORS
      fields:
        type:
          type: uint8
          enum: tempSensorType_e
          description: Sets sensor type (`tempSensorType_e`)

        address:
          type: uint64
          description: Sets sensor address/ID

        alarmMin:
          type: int16
          unit: "0.1\xB0C"
          description: Sets min alarm threshold (`tempSensorConfigMutable(index)->alarm_min`)

        alarmMax:
          type: int16
          unit: "0.1\xB0C"
          description: Sets max alarm threshold (`tempSensorConfigMutable(index)->alarm_max`)

        osdSymbol:
          type: uint8
          description: Sets OSD symbol index (validated)

        label:
          type: char[TEMPERATURE_LABEL_LEN]
          description: Sets sensor label (converted to uppercase)
    reply: null

  MSP2_INAV_TEMPERATURES:
    id: 8222
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the current readings from all configured temperature sensors.
    notes: Requires `USE_TEMPERATURE_SENSOR`.
    variable_len: MAX_TEMP_SENSORS
    request: null
    reply:
      repeat: MAX_TEMP_SENSORS
      fields:
        temperature:
          type: int16
          unit: "0.1\xB0C"
          description: Current temperature reading. -1000 if sensor is invalid or reading failed

  MSP_SIMULATOR:
    id: 8223
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Handles Hardware-in-the-Loop (HITL) simulation data exchange. Receives simulated sensor data and options, sends back control outputs and debug info.
    notes: Requires `USE_SIMULATOR`. Complex message handling state changes for enabling/disabling HITL. Sensor data is injected directly. OSD data is sent using a custom RLE scheme. See `simulatorData` struct and associated code for details.
    variable_len: true
    request:
      fields:
        simulatorVersion:
          type: uint8
          description: Version of the simulator protocol (`SIMULATOR_MSP_VERSION`)

        simulatorFlags_t:
          type: uint8
          enum: simulatorFlags_t
          bitmask: true
          description: 'Bitmask: Options for HITL (`HITL_*` flags)'

        gpsFixType:
          type: uint8
          enum: gpsFixType_e
          description: Enum `gpsFixType_e` Type of GPS fix (If `HITL_HAS_NEW_GPS_DATA`)

        gpsNumSat:
          type: uint8
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated satellite count

        gpsLat:
          type: int32
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated latitude (1e7 deg)

        gpsLon:
          type: int32
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated longitude (1e7 deg)

        gpsAlt:
          type: int32
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated altitude (cm)

        gpsSpeed:
          type: uint16
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated ground speed (cm/s)

        gpsCourse:
          type: uint16
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated ground course (deci-deg)

        gpsVelN:
          type: int16
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated North velocity (cm/s)

        gpsVelE:
          type: int16
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated East velocity (cm/s)

        gpsVelD:
          type: int16
          description: (If `HITL_HAS_NEW_GPS_DATA`) Simulated Down velocity (cm/s)

        imuRoll:
          type: int16
          description: (If NOT `HITL_USE_IMU`) Simulated Roll (deci-deg)

        imuPitch:
          type: int16
          description: (If NOT `HITL_USE_IMU`) Simulated Pitch (deci-deg)

        imuYaw:
          type: int16
          description: (If NOT `HITL_USE_IMU`) Simulated Yaw (deci-deg)

        accX:
          type: int16
          description: mG (G * 1000)

        accY:
          type: int16
          description: mG (G * 1000)

        accZ:
          type: int16
          description: mG (G * 1000)

        gyroX:
          type: int16
          description: dps * 16

        gyroY:
          type: int16
          description: dps * 16

        gyroZ:
          type: int16
          description: dps * 16

        baroPressure:
          type: uint32
          description: Pa

        magX:
          type: int16
          description: Scaled

        magY:
          type: int16
          description: Scaled

        magZ:
          type: int16
          description: Scaled

        vbat:
          type: uint8
          description: (If `HITL_EXT_BATTERY_VOLTAGE`) Simulated battery voltage (0.1V units)

        airspeed:
          type: uint16
          description: (If `HITL_AIRSPEED`) Simulated airspeed (cm/s)

        extFlags:
          type: uint8
          description: (If `HITL_EXTENDED_FLAGS`) Additional flags (upper 8 bits)
    reply:
      fields:

        stabilizedRoll:
          type: uint16
          description: Stabilized Roll command output (-500 to 500)

        stabilizedPitch:
          type: uint16
          description: Stabilized Pitch command output (-500 to 500)

        stabilizedYaw:
          type: uint16
          description: Stabilized Yaw command output (-500 to 500)

        stabilizedThrottle:
          type: uint16
          description: Stabilized Throttle command output (-500 to 500 if armed, else -500)

        debugFlags:
          type: uint8
          description: 'Packed flags: Debug index (0-7), Platform type, Armed state, OSD feature status'

        debugValue:
          type: uint32
          description: Current debug value (`debug[simulatorData.debugIndex]`)

        attitudeRoll:
          type: int16
          description: Current estimated Roll (deci-deg)

        attitudePitch:
          type: int16
          description: Current estimated Pitch (deci-deg)

        attitudeYaw:
          type: int16
          description: Current estimated Yaw (deci-deg)

        osdHeader:
          type: optional uint8
          description: OSD RLE Header (255)

        osdRows:
          type: optional uint8
          description: (If OSD supported) Number of OSD rows

        osdCols:
          type: optional uint8
          description: (If OSD supported) Number of OSD columns

        osdStartY:
          type: optional uint8
          description: (If OSD supported) Starting row for RLE data

        osdStartX:
          type: optional uint8
          description: (If OSD supported) Starting column for RLE data

        osdRleData:
          type: optional uint8[]
          description: (If OSD supported) Run-length encoded OSD character data. Terminated by `[0, 0]`

  MSP2_INAV_SERVO_MIXER:
    id: 8224
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the custom servo mixer rules, including programming framework condition IDs, for primary and secondary mixer profiles. Supersedes `MSP_SERVO_MIX_RULES`.
    notes: '`conditionId` requires `USE_PROGRAMMING_FRAMEWORK`. If multiple mixer profiles are enabled (`MAX_MIXER_PROFILE_COUNT > 1`), a second block of `MAX_SERVO_RULES` rules for the next profile follows immediately.'
    variable_len: MAX_SERVO_RULES
    request: null
    reply:
      repeat: MAX_SERVO_RULES
      fields:
        targetChannel:
          type: uint8
          description: Servo output channel index (0-based)

        inputSource:
          type: uint8
          enum: inputSource_e
          description: Enum `inputSource_e` Input source

        rate:
          type: int16
          description: Mixing rate/weight

        speed:
          type: uint8
          description: Speed/Slew rate limit (0-100)

        conditionId:
          type: int8
          description: Logic Condition ID (0 to `MAX_LOGIC_CONDITIONS - 1`, or 255/-1 if none/disabled)

  MSP2_INAV_SET_SERVO_MIXER:
    id: 8225
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets a single custom servo mixer rule, including programming framework condition ID. Supersedes `MSP_SET_SERVO_MIX_RULE`.
    notes: Expects 7 bytes. Returns error if index invalid. Calls `loadCustomServoMixer()`.
    request:
      fields:
        ruleIndex:
          type: uint8
          description: Index of the rule to set (0 to `MAX_SERVO_RULES - 1`)

        targetChannel:
          type: uint8
          description: Servo output channel index

        inputSource:
          type: uint8
          enum: inputSource_e
          description: Enum `inputSource_e` Input source

        rate:
          type: int16
          description: Mixing rate/weight

        speed:
          type: uint8
          description: Speed/Slew rate limit (0-100)

        conditionId:
          type: int8
          description: Logic Condition ID (255/-1 if none). Ignored if `USE_PROGRAMMING_FRAMEWORK` is disabled
    reply: null

  MSP2_INAV_LOGIC_CONDITIONS:
    id: 8226
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the configuration of all defined Logic Conditions. Requires `USE_PROGRAMMING_FRAMEWORK`. See `logicCondition_t` structure.
    notes: Deprecated, causes buffer overflow for 14*64 bytes
    variable_len: MAX_LOGIC_CONDITIONS
    not_implemented: true

  MSP2_INAV_SET_LOGIC_CONDITIONS:
    id: 8227
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the configuration for a single Logic Condition by its index.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`. Expects 15 bytes. Returns error if index is invalid.
    request:
      fields:
        conditionIndex:
          type: uint8
          description: Index of the condition to set (0 to `MAX_LOGIC_CONDITIONS - 1`)

        enabled:
          type: uint8
          description: 'Boolean: 1 to enable the condition'

        activatorId:
          type: int8
          description: Activator condition ID (-1/255 if none)

        operation:
          type: uint8
          enum: logicOperation_e
          description: Enum `logicOperation_e` Logical operation

        operandAType:
          type: uint8
          enum: logicOperandType_e
          description: Enum `logicOperandType_e` Type of operand A

        operandAValue:
          type: int32
          description: Value/ID of operand A

        operandBType:
          type: uint8
          enum: logicOperandType_e
          description: Enum `logicOperandType_e` Type of operand B

        operandBValue:
          type: int32
          description: Value/ID of operand B

        flags:
          type: uint8
          enum: logicConditionFlags_e
          bitmask: true
          description: 'Bitmask: Condition flags (`logicConditionFlags_e`)'
    reply: null

  MSP2_INAV_GLOBAL_FUNCTIONS:
    id: 8228
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    not_implemented: true

  MSP2_INAV_SET_GLOBAL_FUNCTIONS:
    id: 8229
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    not_implemented: true

  MSP2_INAV_LOGIC_CONDITIONS_STATUS:
    id: 8230
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the current evaluated status (true/false or numerical value) of all logic conditions.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`.
    variable_len: true
    request: null
    reply:
      fields:
        conditionValues:
          type: int32[MAX_LOGIC_CONDITIONS]
          description: Array of current values for each logic condition (`logicConditionGetValue(i)`). 1 for true, 0 for false, or numerical value depending on operation

  MSP2_INAV_GVAR_STATUS:
    id: 8231
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the current values of all Global Variables (GVARS).
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`.
    variable_len: true
    request: null
    reply:
      fields:
        gvarValues:
          type: int32[MAX_GLOBAL_VARIABLES]
          description: Array of current values for each global variable (`gvGet(i)`)

  MSP2_INAV_PROGRAMMING_PID:
    id: 8232
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the configuration of all Programming PIDs.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`. See `programmingPid_t` structure.
    variable_len: MAX_PROGRAMMING_PID_COUNT
    request: null
    reply:
      repeat: MAX_PROGRAMMING_PID_COUNT
      fields:
        enabled:
          type: uint8
          description: 'Boolean: 1 if the PID is enabled'

        setpointType:
          type: uint8
          enum: logicOperandType_e
          description: Enum (`logicOperandType_e`) Type of the setpoint source

        setpointValue:
          type: int32
          description: Value/ID of the setpoint source

        measurementType:
          type: uint8
          enum: logicOperandType_e
          description: Enum (`logicOperandType_e`) Type of the measurement source

        measurementValue:
          type: int32
          description: Value/ID of the measurement source

        gainP:
          type: uint16
          description: Proportional gain

        gainI:
          type: uint16
          description: Integral gain

        gainD:
          type: uint16
          description: Derivative gain

        gainFF:
          type: uint16
          description: Feed-forward gain

  MSP2_INAV_SET_PROGRAMMING_PID:
    id: 8233
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the configuration for a single Programming PID by its index.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`. Expects 20 bytes. Returns error if index is invalid.
    request:
      fields:
        pidIndex:
          type: uint8
          description: Index of the Programming PID to set (0 to `MAX_PROGRAMMING_PID_COUNT - 1`)

        enabled:
          type: uint8
          description: 'Boolean: 1 to enable the PID'

        setpointType:
          type: uint8
          enum: logicOperandType_e
          description: Enum (`logicOperandType_e`) Type of the setpoint source

        setpointValue:
          type: int32
          description: Value/ID of the setpoint source

        measurementType:
          type: uint8
          enum: logicOperandType_e
          description: Enum (`logicOperandType_e`) Type of the measurement source

        measurementValue:
          type: int32
          description: Value/ID of the measurement source

        gainP:
          type: uint16
          description: Proportional gain

        gainI:
          type: uint16
          description: Integral gain

        gainD:
          type: uint16
          description: Derivative gain

        gainFF:
          type: uint16
          description: Feed-forward gain
    reply: null

  MSP2_INAV_PROGRAMMING_PID_STATUS:
    id: 8234
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the current output value of all Programming PIDs.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`.
    variable_len: true
    request: null
    reply:
      fields:
        pidOutputs:
          type: int32[MAX_PROGRAMMING_PID_COUNT]
          description: Array of current output values for each Programming PID (`programmingPidGetOutput(i)`, signed)

  MSP2_PID:
    id: 8240
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the standard PID controller gains (P, I, D, FF) for the current PID profile.
    notes: '`PID_ITEM_COUNT` defines the number of standard PID controllers (Roll, Pitch, Yaw, Alt, Vel, etc.). Updates from EZ-Tune if enabled.'
    variable_len: PID_ITEM_COUNT
    request: null
    reply:
      repeat: PID_ITEM_COUNT
      fields:
        P:
          type: uint8
          description: Proportional gain (`pidBank()->pid[i].P`), constrained 0-255

        I:
          type: uint8
          description: Integral gain (`pidBank()->pid[i].I`), constrained 0-255

        D:
          type: uint8
          description: Derivative gain (`pidBank()->pid[i].D`), constrained 0-255

        FF:
          type: uint8
          description: Feed-forward gain (`pidBank()->pid[i].FF`), constrained 0-255

  MSP2_SET_PID:
    id: 8241
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the standard PID controller gains (P, I, D, FF) for the current PID profile.
    notes: Expects `PID_ITEM_COUNT * 4` bytes. Calls `schedulePidGainsUpdate()` and `navigationUsePIDs()`.
    variable_len: PID_ITEM_COUNT
    request:
      repeat: PID_ITEM_COUNT
      fields:
        P:
          type: uint8
          description: Sets Proportional gain (`pidBankMutable()->pid[i].P`)

        I:
          type: uint8
          description: Sets Integral gain (`pidBankMutable()->pid[i].I`)

        D:
          type: uint8
          description: Sets Derivative gain (`pidBankMutable()->pid[i].D`)

        FF:
          type: uint8
          description: Sets Feed-forward gain (`pidBankMutable()->pid[i].FF`)
    reply: null

  MSP2_INAV_OPFLOW_CALIBRATION:
    id: 8242
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Starts the optical flow sensor calibration procedure.
    notes: Requires `USE_OPFLOW`. Will fail if armed. Calls `opflowStartCalibration()`.
    request: null
    reply: null

  MSP2_INAV_FWUPDT_PREPARE:
    id: 8243
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Prepares the flight controller to receive a firmware update via MSP.
    notes: Requires `MSP_FIRMWARE_UPDATE`. Expects 4 bytes. Returns error if preparation fails (e.g., no storage, invalid size). Calls `firmwareUpdatePrepare()`.
    request:
      fields:
        firmwareSize:
          type: uint32
          description: Total size of the incoming firmware file in bytes
    reply: null

  MSP2_INAV_FWUPDT_STORE:
    id: 8244
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Stores a chunk of firmware data received via MSP.
    notes: Requires `MSP_FIRMWARE_UPDATE`. Returns error if storage fails (e.g., out of space, checksum error). Called repeatedly until the entire firmware is transferred. Calls `firmwareUpdateStore()`.
    variable_len: true
    request:
      fields:
        firmwareChunk:
          type: uint8[]
          description: Chunk of firmware data
    reply: null

  MSP2_INAV_FWUPDT_EXEC:
    id: 8245
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Executes the firmware update process (flashes the stored firmware and reboots).
    notes: Requires `MSP_FIRMWARE_UPDATE`. Expects 1 byte. Returns error if update cannot start (e.g., not fully received). Calls `firmwareUpdateExec()`. If successful, the device will reboot into the new firmware.
    request:
      fields:
        updateType:
          type: uint8
          description: Type of update (e.g., full flash, specific section - currently ignored/unused)
    reply: null

  MSP2_INAV_FWUPDT_ROLLBACK_PREPARE:
    id: 8246
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Prepares the flight controller to perform a firmware rollback to the previously stored version.
    notes: Requires `MSP_FIRMWARE_UPDATE`. Returns error if rollback preparation fails (e.g., no rollback image available). Calls `firmwareUpdateRollbackPrepare()`.
    request: null
    reply: null

  MSP2_INAV_FWUPDT_ROLLBACK_EXEC:
    id: 8247
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Executes the firmware rollback process (flashes the stored backup firmware and reboots).
    notes: Requires `MSP_FIRMWARE_UPDATE`. Returns error if rollback cannot start. Calls `firmwareUpdateRollbackExec()`. If successful, the device will reboot into the backup firmware.
    request: null
    reply: null

  MSP2_INAV_SAFEHOME:
    id: 8248
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Get or Set configuration for a specific Safe Home location.
    notes: Requires `USE_SAFE_HOME`. Used by `mspFcSafeHomeOutCommand`. See `MSP2_INAV_SET_SAFEHOME` for setting.
    request:
      fields:
        safehomeIndex:
          type: uint8
          description: Index of the safe home location (0 to `MAX_SAFE_HOMES - 1`)
    reply:
      fields:

        safehomeIndex:
          type: uint8
          description: Index requested

        enabled:
          type: uint8
          description: 'Boolean: 1 if this safe home is enabled'

        latitude:
          type: int32
          description: Latitude (1e7 deg)

        longitude:
          type: int32
          description: Longitude (1e7 deg)

  MSP2_INAV_SET_SAFEHOME:
    id: 8249
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the configuration for a specific Safe Home location.
    notes: Requires `USE_SAFE_HOME`. Expects 10 bytes. Returns error if index invalid. Resets corresponding FW autoland approach if `USE_FW_AUTOLAND` is enabled.
    request:
      fields:
        safehomeIndex:
          type: uint8
          description: Index of the safe home location (0 to `MAX_SAFE_HOMES - 1`)

        enabled:
          type: uint8
          description: 'Boolean: 1 to enable this safe home'

        latitude:
          type: int32
          description: Latitude (1e7 deg)

        longitude:
          type: int32
          description: Longitude (1e7 deg)
    reply: null

  MSP2_INAV_MISC2:
    id: 8250
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves miscellaneous runtime information including timers and throttle status.
    request: null
    reply:
      fields:
        uptimeSeconds:
          type: uint32
          unit: Seconds
          description: Time since boot (`micros() / 1000000`)

        flightTimeSeconds:
          type: uint32
          unit: Seconds
          description: Accumulated flight time (`getFlightTime()`)

        throttlePercent:
          type: uint8
          unit: '%'
          description: Current throttle output percentage (`getThrottlePercent(true)`)

        autoThrottleFlag:
          type: uint8
          unit: Boolean
          description: 1 if navigation is controlling throttle, 0 otherwise (`navigationIsControllingThrottle()`)

  MSP2_INAV_LOGIC_CONDITIONS_SINGLE:
    id: 8251
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Gets the configuration for a single Logic Condition by its index.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`. Used by `mspFcLogicConditionCommand`.
    request:
      fields:
        conditionIndex:
          type: uint8
          description: Index of the condition to retrieve (0 to `MAX_LOGIC_CONDITIONS - 1`)
    reply:
      fields:

        enabled:
          type: uint8
          description: 'Boolean: 1 if enabled'

        activatorId:
          type: int8
          description: Activator ID (-1/255 if none)

        operation:
          type: uint8
          enum: logicOperation_e
          description: Enum `logicOperation_e` Logical operation

        operandAType:
          type: uint8
          enum: logicOperandType_e
          description: Enum `logicOperandType_e` Type of operand A

        operandAValue:
          type: int32
          description: Value/ID of operand A

        operandBType:
          type: uint8
          enum: logicOperandType_e
          description: Enum `logicOperandType_e` Type of operand B

        operandBValue:
          type: int32
          description: Value/ID of operand B

        flags:
          type: uint8
          enum: logicConditionFlags_e
          bitmask: true
          description: 'Bitmask: Condition flags (`logicConditionFlags_e`)'

  MSP2_INAV_LOGIC_CONDITIONS_CONFIGURED:
    id: 8252
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Returns a bitmask of which logic conditions are configured, so a client can fetch only the used slots instead of all of them.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`. Fixed 8-byte reply carrying one 64-bit mask as two `uint32_t` halves, low half first. Only the first `MIN(MAX_LOGIC_CONDITIONS, 64)` bits are evaluated. A condition counts as configured when any of `enabled`, `activatorId` (default -1), `operation`, `operandA.type`, `operandA.value`, `operandB.type`, `operandB.value` or `flags` differs from its default.
    request: null
    reply:
      fields:
        configuredMaskLow:
          type: uint32
          description: Bits 0-31 of the bitmask. Bit N is set when logic condition N differs from its default values.

        configuredMaskHigh:
          type: uint32
          description: Bits 32-63 of the bitmask. Always 0 on targets where `MAX_LOGIC_CONDITIONS` is 32 or fewer.

  MSP2_INAV_ESC_RPM:
    id: 8256
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the RPM reported by each ESC via telemetry.
    notes: 'Requires `USE_ESC_SENSOR`. Payload size depends on the number of detected motors with telemetry. Record count is not a constant: loops getMotorCount(); read until the payload is exhausted.'
    variable_len: getMotorCount()
    request: null
    reply:
      repeat: until_end
      fields:
        escRpm:
          type: uint32
          unit: RPM
          description: RPM reported by the ESC

  MSP2_INAV_ESC_TELEM:
    id: 8257
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Retrieves the full telemetry data structure reported by each ESC.
    notes: Requires `USE_ESC_SENSOR`. See `escSensorData_t` in `sensors/esc_sensor.h` for the exact structure fields.
    variable_len: true
    request: null
    reply:
      fields:
        motorCount:
          type: uint8
          description: Number of motors reporting telemetry (`getMotorCount()`)

        escData:
          repeat: motorCount
          fields:
            esc:
              type: escSensorData_t
              description: One ESC's telemetry (voltage, current, temperature, RPM, error count); see `escSensorData_t`

  MSP2_INAV_DRONECAN_NODES:
    id: 8258
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the list of all detected DroneCAN nodes with their current status.
    notes: 'Requires `USE_DRONECAN`. Response is `nodeCount` followed by `nodeCount` records of 13 bytes each: nodeID(1)+health(1)+mode(1)+last_seen_ms(4)+uptime_sec(4)+vendor_status_code(2). Maximum payload 1 + (DRONECAN_MAX_NODES * 13) = 417 bytes. For full node detail (name, SW/HW version, unique ID) use MSP2_INAV_DRONECAN_ASYNC_REQUEST with service_id=DRONECAN_SERVICE_GETNODEINFO(1).'
    variable_len: true
    request: null
    reply:
      fields:
        nodeCount:
          type: uint8
          description: Number of detected DroneCAN nodes

        items:
          repeat: nodeCount
          fields:

            nodeID:
              type: uint8
              description: DroneCAN node ID (1-127)

            health:
              type: uint8
              description: 'Node health: 0=OK, 1=WARNING, 2=ERROR, 3=CRITICAL'

            mode:
              type: uint8
              description: 'Node mode: 0=OPERATIONAL, 1=INITIALIZATION, 2=MAINTENANCE, 3=SOFTWARE_UPDATE, 7=OFFLINE'

            last_seen_ms:
              type: uint32
              unit: ms
              description: Milliseconds since this node was last seen (FC-local timestamp delta)

            uptime_sec:
              type: uint32
              unit: s
              description: Node uptime in seconds (from NodeStatus broadcast)

            vendor_status_code:
              type: uint16
              description: Vendor-specific status code

  MSP2_INAV_DRONECAN_ASYNC_REQUEST:
    id: 8259
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Initiates an asynchronous DroneCAN service request (GetNodeInfo, ParamGetSet, ExecuteOpcode, RestartNode) to a specific node. Result retrieved via MSP2_INAV_DRONECAN_ASYNC_RESULT.
    notes: 'Requires `USE_DRONECAN`. Initiates an async DroneCAN service request; poll MSP2_INAV_DRONECAN_ASYNC_RESULT at ~100ms intervals until state=READY(2) or ERROR(3). Only one request in-flight at a time. Service-specific request fields follow the common header in the request payload: EXECUTE_OPCODE appends opcode(u8); PARAM_GETSET appends index(u16)+is_write(u8) and optionally value_type(u8)+value(variable) for writes, then req_name_len(u8)+req_name(bytes) for named lookup. Param value encoding: INT=lo(u32)+hi(u32), FLOAT=raw(u32), BOOL=u8, STRING=len(u8)+data. Requests time out after DRONECAN_ASYNC_TIMEOUT_MS (2000ms). If bus is not in STATE_DRONECAN_NORMAL, returns accepted=0xFF without dispatching.'
    variable_len: true
    request:
      fields:
        service_id:
          type: uint16
          description: 'Service to invoke: 1=GETNODEINFO, 5=RESTART_NODE, 10=EXECUTE_OPCODE, 11=PARAM_GETSET. Transmitted as u16 for MSP alignment; only low 8 bits used.'

        nodeID:
          type: uint8
          description: Target DroneCAN node ID (1-127)
    reply:
      fields:

        accepted:
          type: uint8
          description: 0=request accepted; 1=busy (slot in use) or unrecognised service_id; 0xFF=bus not in STATE_DRONECAN_NORMAL (not ready)

        seq:
          type: uint8
          description: Sequence number; correlate with MSP2_INAV_DRONECAN_ASYNC_RESULT to verify the result belongs to this request

  MSP2_INAV_DRONECAN_ASYNC_RESULT:
    id: 8260
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Polls the result of the most recent MSP2_INAV_DRONECAN_ASYNC_REQUEST. Poll at ~100ms intervals until state is READY(2) or ERROR(3).
    notes: 'Requires `USE_DRONECAN`. When state=READY(2), service-specific result fields follow the 5-byte common header. GETNODEINFO: name_len(u8)+name(bytes)+sw_major(u8)+sw_minor(u8)+sw_optional_field_flags(u8)+sw_vcs_commit(u32)+hw_major(u8)+hw_minor(u8)+hw_unique_id(u8[16]). PARAM_GETSET: name_len(u8)+name(bytes)+type(u8)+value(variable)+min_type(u8)+min(variable)+max_type(u8)+max(variable); value/min/max encoding: INT=lo(u32)+hi(u32), FLOAT=raw(u32), BOOL=u8, STRING=len(u8)+data; EMPTY(0) min/max type means no bound is present. EXECUTE_OPCODE and RESTART_NODE: ok(u8) where 1=success. Reading result when state=READY transitions slot back to IDLE.'
    variable_len: true
    request: null
    reply:
      fields:
        state:
          type: uint8
          description: 'Async slot state: 0=IDLE, 1=PENDING, 2=READY, 3=ERROR'

        seq:
          type: uint8
          description: Sequence number matching the originating MSP2_INAV_DRONECAN_ASYNC_REQUEST reply

        service_id:
          type: uint16
          description: Service ID of the in-flight or just-completed request

        node_id:
          type: uint8
          description: Node ID of the target

  MSP2_INAV_LED_STRIP_CONFIG_EX:
    id: 8264
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Retrieves the full configuration for each LED on the strip using the `ledConfig_t` structure. Supersedes `MSP_LED_STRIP_CONFIG`.
    notes: Requires `USE_LED_STRIP`. See `ledConfig_t` in `io/ledstrip.h` for structure fields (position, function, overlay, color, direction, params). `ledConfig_t` is a packed bitfield struct of 40 bits = 5 bytes (led_position:8, led_function:8, led_overlay:8, led_color:4, led_direction:6, led_params:6); the reply is `LED_MAX_STRIP_LENGTH` consecutive 5-byte records.
    variable_len: LED_MAX_STRIP_LENGTH
    request: null
    reply:
      repeat: LED_MAX_STRIP_LENGTH
      fields:
        ledConfig:
          type: ledConfig_t
          description: Raw `ledConfig_t` structure (5 bytes) holding position, function, overlay, color, direction, and params bitfields (`io/ledstrip.h`).

  MSP2_INAV_SET_LED_STRIP_CONFIG_EX:
    id: 8265
    inav_version:
      since: "1.0"
    mspv: 2
    group: inav
    description: Sets the configuration for a single LED on the strip using the `ledConfig_t` structure. Supersedes `MSP_SET_LED_STRIP_CONFIG`.
    notes: Requires `USE_LED_STRIP`. Expects `1 + sizeof(ledConfig_t)` bytes. Returns error if index invalid. Calls `reevaluateLedConfig()`.
    request:
      fields:
        ledIndex:
          type: uint8
          description: Index of the LED to configure (0 to `LED_MAX_STRIP_LENGTH - 1`)

        ledConfig:
          type: ledConfig_t
          description: Raw `ledConfig_t` structure (6 bytes) mirroring the firmware layout.
    reply: null

  MSP2_INAV_FW_APPROACH:
    id: 8266
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Get or Set configuration for a specific Fixed Wing Autoland approach.
    notes: Requires `USE_FW_AUTOLAND`. Used by `mspFwApproachOutCommand`. See `MSP2_INAV_SET_FW_APPROACH` for setting.
    request:
      fields:
        approachIndex:
          type: uint8
          description: Index of the approach setting (0 to `MAX_FW_LAND_APPOACH_SETTINGS - 1`)
    reply:
      fields:

        approachIndex:
          type: uint8
          unit: Index
          description: Index requested

        approachAlt:
          type: int32
          unit: cm
          description: Signed altitude for the approach phase (`navFwAutolandApproach_t.approachAlt`)

        landAlt:
          type: int32
          unit: cm
          description: Signed altitude for the final landing phase (`navFwAutolandApproach_t.landAlt`)

        approachDirection:
          type: uint8
          enum: fwAutolandApproachDirection_e
          description: 'Enum `fwAutolandApproachDirection_e`: Direction of approach (From WP, Specific Heading)'

        landHeading1:
          type: int16
          unit: degrees
          description: Primary landing heading (if approachDirection requires it)

        landHeading2:
          type: int16
          unit: degrees
          description: Secondary landing heading (if approachDirection requires it)

        isSeaLevelRef:
          type: uint8
          unit: Boolean
          description: 1 if altitudes are relative to sea level, 0 if relative to home

  MSP2_INAV_SET_FW_APPROACH:
    id: 8267
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Sets the configuration for a specific Fixed Wing Autoland approach.
    notes: Requires `USE_FW_AUTOLAND`. Expects 15 bytes. Returns error if index invalid.
    request:
      fields:
        approachIndex:
          type: uint8
          unit: Index
          description: Index of the approach setting (0 to `MAX_FW_LAND_APPOACH_SETTINGS - 1`)

        approachAlt:
          type: int32
          unit: cm
          description: Signed approach altitude (`navFwAutolandApproach_t.approachAlt`)

        landAlt:
          type: int32
          unit: cm
          description: Signed landing altitude (`navFwAutolandApproach_t.landAlt`)

        approachDirection:
          type: uint8
          enum: fwAutolandApproachDirection_e
          description: Enum `fwAutolandApproachDirection_e` Sets approach direction

        landHeading1:
          type: int16
          unit: degrees
          description: Sets primary landing heading

        landHeading2:
          type: int16
          unit: degrees
          description: Sets secondary landing heading

        isSeaLevelRef:
          type: uint8
          unit: Boolean
          description: Sets altitude reference
    reply: null

  MSP2_INAV_GPS_UBLOX_COMMAND:
    id: 8272
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Sends a raw command directly to a U-Blox GPS module connected to the FC.
    notes: Requires GPS feature enabled (`FEATURE_GPS`) and the GPS driver to be U-Blox (`isGpsUblox()`). Payload must be at least 8 bytes (minimum UBX frame size). Use with extreme caution, incorrect commands can misconfigure the GPS module. Calls `gpsUbloxSendCommand()`.
    variable_len: true
    request:
      fields:
        ubxCommand:
          type: uint8[]
          description: Raw U-Blox UBX protocol command frame (including header, class, ID, length, payload, checksum)
    reply: null

  MSP2_INAV_RATE_DYNAMICS:
    id: 8288
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Retrieves Rate Dynamics configuration parameters for the current control rate profile.
    notes: Requires `USE_RATE_DYNAMICS`.
    request: null
    reply:
      fields:
        sensitivityCenter:
          type: uint8
          unit: '%'
          description: Sensitivity at stick center (`currentControlRateProfile->rateDynamics.sensitivityCenter`)

        sensitivityEnd:
          type: uint8
          unit: '%'
          description: Sensitivity at stick ends (`currentControlRateProfile->rateDynamics.sensitivityEnd`)

        correctionCenter:
          type: uint8
          unit: '%'
          description: Correction strength at stick center (`currentControlRateProfile->rateDynamics.correctionCenter`)

        correctionEnd:
          type: uint8
          unit: '%'
          description: Correction strength at stick ends (`currentControlRateProfile->rateDynamics.correctionEnd`)

        weightCenter:
          type: uint8
          unit: '%'
          description: Transition weight at stick center (`currentControlRateProfile->rateDynamics.weightCenter`)

        weightEnd:
          type: uint8
          unit: '%'
          description: Transition weight at stick ends (`currentControlRateProfile->rateDynamics.weightEnd`)

  MSP2_INAV_SET_RATE_DYNAMICS:
    id: 8289
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Sets Rate Dynamics configuration parameters for the current control rate profile.
    notes: Requires `USE_RATE_DYNAMICS`. Expects 6 bytes.
    request:
      fields:
        sensitivityCenter:
          type: uint8
          unit: '%'
          description: Sets sensitivity at center

        sensitivityEnd:
          type: uint8
          unit: '%'
          description: Sets sensitivity at ends

        correctionCenter:
          type: uint8
          unit: '%'
          description: Sets correction at center

        correctionEnd:
          type: uint8
          unit: '%'
          description: Sets correction at ends

        weightCenter:
          type: uint8
          unit: '%'
          description: Sets weight at center

        weightEnd:
          type: uint8
          unit: '%'
          description: Sets weight at ends
    reply: null

  MSP2_INAV_EZ_TUNE:
    id: 8304
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Retrieves the current EZ-Tune parameters.
    notes: Requires `USE_EZ_TUNE`. Calls `ezTuneUpdate()` before sending.
    request: null
    reply:
      fields:
        enabled:
          type: uint8
          description: 'Boolean: 1 if EZ-Tune is enabled (`ezTune()->enabled`)'

        filterHz:
          type: uint16
          description: Filter frequency used during tuning (`ezTune()->filterHz`)

        axisRatio:
          type: uint8
          description: Roll vs Pitch axis tuning ratio (`ezTune()->axisRatio`)

        response:
          type: uint8
          description: Desired response characteristic (`ezTune()->response`)

        damping:
          type: uint8
          description: Desired damping characteristic (`ezTune()->damping`)

        stability:
          type: uint8
          description: Stability preference (`ezTune()->stability`)

        aggressiveness:
          type: uint8
          description: Aggressiveness preference (`ezTune()->aggressiveness`)

        rate:
          type: uint8
          description: Resulting rate setting (`ezTune()->rate`)

        expo:
          type: uint8
          description: Resulting expo setting (`ezTune()->expo`)

        snappiness:
          type: uint8
          description: Snappiness preference (`ezTune()->snappiness`)

  MSP2_INAV_EZ_TUNE_SET:
    id: 8305
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Sets the EZ-Tune parameters and triggers an update.
    notes: Requires `USE_EZ_TUNE`. Expects 10 or 11 bytes. Calls `ezTuneUpdate()` after setting parameters.
    request:
      fields:
        enabled:
          type: uint8
          description: Sets enabled state

        filterHz:
          type: uint16
          description: Sets filter frequency

        axisRatio:
          type: uint8
          description: Sets axis ratio

        response:
          type: uint8
          description: Sets response characteristic

        damping:
          type: uint8
          description: Sets damping characteristic

        stability:
          type: uint8
          description: Sets stability preference

        aggressiveness:
          type: uint8
          description: Sets aggressiveness preference

        rate:
          type: uint8
          description: Sets rate setting

        expo:
          type: uint8
          description: Sets expo setting

        snappiness:
          type: optional uint8
          description: (Optional) Sets snappiness preference
    reply: null

  MSP2_INAV_SELECT_MIXER_PROFILE:
    id: 8320
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Selects the active mixer profile and saves configuration.
    notes: Expects 1 byte. Will fail if armed. Calls `setConfigMixerProfileAndWriteEEPROM()`. Only applicable if `MAX_MIXER_PROFILE_COUNT` > 1.
    request:
      fields:
        mixerProfileIndex:
          type: uint8
          description: Index of the mixer profile to activate (0-based)
    reply: null

  MSP2_ADSB_VEHICLE_LIST:
    id: 8336
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: "Retrieves the list of currently tracked ADSB (Automatic Dependent Surveillance\u2013Broadcast) vehicles. See `adsbVehicle_t` and `adsbVehicleValues_t` in `io/adsb.h` for the exact structure fields."
    notes: Requires `USE_ADSB`. Only a subset of `adsbVehicle_t` is transmitted (callsign, core values, heading in whole degrees, TSLC, emitter type, TTL).
    variable_len: maxVehicles
    request: null
    reply:
      fields:
        maxVehicles:
          type: uint8
          description: Maximum number of vehicles tracked (`MAX_ADSB_VEHICLES`). 0 if `USE_ADSB` disabled

        callsignLength:
          type: uint8
          description: Maximum length of callsign string (`ADSB_CALL_SIGN_MAX_LENGTH`). 0 if `USE_ADSB` disabled

        totalVehicleMsgs:
          type: uint32
          description: Total vehicle messages received (`getAdsbStatus()->vehiclesMessagesTotal`). 0 if `USE_ADSB` disabled

        totalHeartbeatMsgs:
          type: uint32
          description: Total heartbeat messages received (`getAdsbStatus()->heartbeatMessagesTotal`). 0 if `USE_ADSB` disabled

        items:
          repeat: maxVehicles
          fields:

            callsign:
              type: char[ADSB_CALL_SIGN_MAX_LENGTH]
              description: Fixed-length callsign from `adsbVehicle->vehicleValues.callsign` (padded with NULs if shorter).

            icao:
              type: uint32
              description: ICAO address (`adsbVehicle->vehicleValues.icao`).

            lat:
              type: int32
              unit: 1e-7 deg
              description: Latitude in degrees * 1e7 (`adsbVehicle->vehicleValues.gps.lat`).

            lon:
              type: int32
              unit: 1e-7 deg
              description: Longitude in degrees * 1e7 (`adsbVehicle->vehicleValues.gps.lon`).

            alt:
              type: int32
              unit: cm
              description: Altitude above sea level (`adsbVehicle->vehicleValues.alt`).

            headingDeg:
              type: uint16
              unit: deg
              description: Course over ground in whole degrees (`CENTIDEGREES_TO_DEGREES(vehicleValues.heading)`).

            tslc:
              type: uint8
              unit: s
              description: Time since last communication (`adsbVehicle->vehicleValues.tslc`).

            emitterType:
              type: uint8
              description: Emitter category (`adsbVehicle->vehicleValues.emitterType`) (refers to enum 'ADSB_EMITTER_TYPE', but none found)

            ttl:
              type: uint8
              description: TTL counter used for list maintenance (`adsbVehicle->ttl`).

  MSP2_ADSB_LIMITS:
    id: 8337
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Retrieves the configured ADSB proximity distance limits used for OSD warnings and alerts.
    notes: Requires `USE_ADSB`; all three fields are 0 when it is not compiled in.
    request: null
    reply:
      fields:
        distanceWarning:
          type: uint16
          unit: m
          description: '`osdConfig()->adsb_distance_warning` (setting `osd_adsb_distance_warning`). Distance within which an ADSB vehicle is displayed.'

        distanceAlert:
          type: uint16
          unit: m
          description: '`osdConfig()->adsb_distance_alert` (setting `osd_adsb_distance_alert`). Distance inside which ADSB data flashes as a proximity warning.'

        ignorePlaneAboveMeLimit:
          type: uint16
          unit: m
          description: '`osdConfig()->adsb_ignore_plane_above_me_limit` (setting `osd_adsb_ignore_plane_above_me_limit`). Vehicles higher than this above the craft are ignored; 0 disables the limit.'

  MSP2_ADSB_WARNING_VEHICLE_ICAO:
    id: 8338
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the ICAO address of the ADSB vehicle currently triggering a proximity warning or alert.
    notes: 'Requires `USE_ADSB`. Alert takes priority: `findVehicleForAlert()` is tried first using `osd_adsb_distance_alert`, then `findVehicleForWarning()` using `osd_adsb_distance_warning`, both bounded by `osd_adsb_ignore_plane_above_me_limit`. Replies 0/0 when `USE_ADSB` is not compiled in, when `isEnvironmentOkForCalculatingADSBDistanceBearing()` is false, or when no vehicle matches.'
    request: null
    reply:
      fields:
        icao:
          type: uint32
          description: ICAO address of the vehicle currently triggering an alert or warning; 0 when none applies.

        isAlert:
          type: uint8
          unit: Boolean
          description: 1 when the vehicle matched the alert distance, 0 when it matched only the warning distance or when `icao` is 0.

  MSP2_ADSB_VEHICLE:
    id: 8339
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: 'Retrieves a single tracked ADSB (Automatic Dependent Surveillance-Broadcast) vehicle by slot index. Intended for polling one slot at a time: query `MSP2_ADSB_VEHICLE_COUNT` for the iteration bound, then request indices `0 .. count-1`, skipping slots with `ttl == 0`, and identify each aircraft by its `icao`. See `adsbVehicle_t` / `adsbVehicleValues_t` in `io/adsb.h`.'
    notes: 'Requires `USE_ADSB`. Reads a single ADSB vehicle slot by index. THE INDEX IS NOT A STABLE HANDLE: slots are reused, so a given index may hold a different aircraft (or be empty, `ttl == 0`) between polls. Correlate aircraft by the `icao` field in the reply, never by index. Compared with the bulk `MSP2_ADSB_VEHICLE_LIST`, this message adds horizontal velocity and reports heading at full (centidegree) resolution, and orders the callsign last. Returns an error result for an out-of-range index.'
    request:
      fields:
        index:
          type: uint8
          description: 'Slot index to read, `0 .. (MSP2_ADSB_VEHICLE_COUNT - 1)`. WARNING: this is an iteration cursor over fixed slots, NOT a stable identifier. The same index may return a different aircraft (or an empty slot) on a later poll. Always identify the aircraft by the `icao` field in the reply; never cache or correlate data by index. Returns an error result if the index is out of range.'
    reply:
      fields:

        icao:
          type: uint32
          description: ICAO 24-bit address (`vehicleValues.icao`). This is the stable per-aircraft identifier; use it to correlate replies, not the request index. An empty slot reports `icao == 0` and `ttl == 0`.

        lat:
          type: int32
          unit: 1e-7 deg
          description: Latitude (`vehicleValues.gps.lat`).

        lon:
          type: int32
          unit: 1e-7 deg
          description: Longitude (`vehicleValues.gps.lon`).

        alt:
          type: int32
          unit: cm
          description: Altitude above sea level (`vehicleValues.alt`).

        heading:
          type: uint16
          unit: 1e-2 deg
          description: Course over ground at full resolution (`vehicleValues.heading`). Unlike `MSP2_ADSB_VEHICLE_LIST`, this is in centidegrees, not whole degrees.

        horVelocity:
          type: uint16
          unit: cm/s
          description: Horizontal (ground) speed (`vehicleValues.horVelocity`). Not present in `MSP2_ADSB_VEHICLE_LIST`.

        tslc:
          type: uint8
          unit: s
          description: Time since last communication (`vehicleValues.tslc`).

        emitterType:
          type: uint8
          description: Emitter category (`vehicleValues.emitterType`).

        ttl:
          type: uint8
          unit: s
          description: Remaining time-to-live for this slot (`adsbVehicle->ttl`). `ttl == 0` means the slot is empty/expired and its contents are stale; skip such entries.

        callsign:
          type: char[ADSB_CALL_SIGN_MAX_LENGTH]
          description: Fixed-length callsign (`vehicleValues.callsign`), padded with NULs if shorter.

  MSP2_ADSB_VEHICLE_COUNT:
    id: 8340
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the number of ADSB vehicle slots available to iterate with `MSP2_ADSB_VEHICLE`.
    notes: 'Requires `USE_ADSB`. Returns the iteration bound for `MSP2_ADSB_VEHICLE`: request indices `0 .. count-1` and skip any slot whose `ttl == 0`.'
    request: null
    reply:
      fields:
        count:
          type: uint8
          description: Number of vehicle slots to iterate (`MAX_ADSB_VEHICLES`). This is the slot capacity / iteration bound, not the number of currently active aircraft - some slots may be empty (`ttl == 0`). 0 if `USE_ADSB` is disabled.

  MSP2_INAV_CUSTOM_OSD_ELEMENTS:
    id: 8448
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Retrieves counts related to custom OSD elements defined by the programming framework.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`.
    request: null
    reply:
      fields:
        maxElements:
          type: uint8
          description: Maximum number of custom elements (`MAX_CUSTOM_ELEMENTS`)

        maxTextLength:
          type: uint8
          description: Maximum length of the text part (`OSD_CUSTOM_ELEMENT_TEXT_SIZE - 1`)

        maxParts:
          type: uint8
          description: Maximum number of parts per element (`CUSTOM_ELEMENTS_PARTS`)

  MSP2_INAV_CUSTOM_OSD_ELEMENT:
    id: 8449
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Gets the configuration of a single custom OSD element defined by the programming framework.
    notes: Reply emitted only if idx < MAX_CUSTOM_ELEMENTS; otherwise no body is written.
    request:
      fields:
        elementIndex:
          type: uint8
          description: Index of the custom element (0 to `MAX_CUSTOM_ELEMENTS - 1`)
    reply:
      fields:

        items:
          repeat: CUSTOM_ELEMENTS_PARTS
          fields:

            partType:
              type: uint8
              enum: osdCustomElementType_e
              description: Type of this part

            partValue:
              type: uint16
              description: Value/ID associated with this part

        visibilityType:
          type: uint8
          enum: osdCustomElementTypeVisibility_e
          description: Visibility condition source

        visibilityValue:
          type: uint16
          description: Value/ID of the visibility condition source

        elementText:
          type: char[15]
          description: Static text bytes

  MSP2_INAV_SET_CUSTOM_OSD_ELEMENTS:
    id: 8450
    inav_version:
      since: "7.0"
    mspv: 2
    group: inav
    description: Sets the configuration of one custom OSD element.
    notes: Payload length must be (OSD_CUSTOM_ELEMENT_TEXT_SIZE - 1) + (CUSTOM_ELEMENTS_PARTS * 3) + 4 bytes including elementIndex. elementIndex must be < MAX_CUSTOM_ELEMENTS. Each partType must be < CUSTOM_ELEMENT_TYPE_END. Firmware NUL-terminates elementText internally.
    request:
      fields:
        elementIndex:
          type: uint8
          description: Index of the custom element (0 to `MAX_CUSTOM_ELEMENTS - 1`)

        items:
          repeat: CUSTOM_ELEMENTS_PARTS
          fields:

            partType:
              type: uint8
              enum: osdCustomElementType_e
              description: Type of this part

            partValue:
              type: uint16
              description: Value/ID associated with this part

        visibilityType:
          type: uint8
          enum: osdCustomElementTypeVisibility_e
          description: Visibility condition source

        visibilityValue:
          type: uint16
          description: Value/ID of the visibility condition source

        elementText:
          type: char[15]
          description: Raw bytes
    reply: null

  MSP2_INAV_GET_LINK_STATS:
    id: 8451
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Provides uplink RC link statistics for monitoring on a GCS.
    notes: Useful for GCS monitoring of the active RC link quality and signal margin.
    request: null
    reply:
      fields:
        uplinkRSSI_dBm:
          type: uint8
          unit: -dBm
          description: Uplink RSSI in dBm, sent as a positive magnitude (`getRSSI()`). For example, 70 means -70dBm.

        uplinkLQ:
          type: uint8
          unit: '%'
          description: Uplink Link Quality (`rxLinkStatistics.uplinkLQ`)

        uplinkSNR:
          type: int8
          unit: dB
          description: Uplink Signal-to-Noise Ratio (`rxLinkStatistics.uplinkSNR`)

  MSP2_INAV_OUTPUT_MAPPING_EXT2:
    id: 8461
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Retrieves the full extended output mapping configuration (timer ID, full 32-bit usage flags, and pin label). Supersedes `MSP2_INAV_OUTPUT_MAPPING_EXT`.
    notes: 'Provides complete usage flags and helps identify pins repurposed for functions like LED strip. Record count is not a constant: loops timerHardwareCount, skipping timers flagged TIM_USE_PPM or TIM_USE_PWM; read until the payload is exhausted.'
    variable_len: for each Motor/Servo timer
    request: null
    reply:
      repeat: until_end
      fields:
        timerId:
          type: uint8
          description: Hardware timer identifier (e.g., `TIM1`, `TIM2`). SITL uses index

        usageFlags:
          type: uint32
          description: Full 32-bit timer usage flags (`TIM_USE_*`)

        pinLabel:
          type: uint8
          enum: pinLabel_e
          description: Label for special pin usage (`PIN_LABEL_*` enum, e.g., `PIN_LABEL_LED`). 0 (`PIN_LABEL_NONE`) otherwise

  MSP2_INAV_OUTPUT_ASSIGNMENT:
    id: 8462
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the finalized post-boot mapping of timer outputs to motors, servos and the beeper.
    notes: 'Not available on SITL builds (`#ifndef SITL_BUILD`). The reply is 3 bytes per assigned output with no leading count field: motors first (`maxTimMotorCount`), then servos (`maxTimServoCount`), then at most one beeper record, emitted only when some timer override is set to `OUTPUT_MODE_BEEPER`. Reads the assignment finalized at boot via `pwmGetOutputAssignment()`. Record count is not a constant: maxTimMotorCount motors, then maxTimServoCount servos, then at most one beeper entry (the loop breaks on the first match); read until the payload is exhausted.'
    variable_len: true
    request: null
    reply:
      fields:
        items:
          repeat: until_end
          fields:

            outputIndex:
              type: uint8
              unit: Index
              description: Index into the target's `timerHardware[]` array for this output.

            usageType:
              type: uint8
              description: 'Bit index of the `TIM_USE_*` flag, not the flag value itself: 2 = `TIM_USE_MOTOR`, 3 = `TIM_USE_SERVO`, 25 = `TIM_USE_BEEPER`. Derived in the firmware with `__builtin_ctz(TIM_USE_x)` and matching the `TIM_USE_*` constants in the configurator''s `outputMapping.js`.'

            functionIndex:
              type: uint8
              unit: Index
              description: '1-based ordinal within the usage type: motor 1..n, servo 1..n. Always 1 for the beeper entry.'

  MSP2_INAV_QUERY_OUTPUT_ASSIGNMENT:
    id: 8463
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Previews the output assignment that would result from a proposed set of timer output-mode overrides, without applying them.
    notes: 'Not available on SITL builds (`#ifndef SITL_BUILD`). Nothing is written to the configuration: `pwmCalculateAssignment()` is run against a proposed override array so a client can preview the effect of timer overrides before committing them with `MSP2_INAV_SET_TIMER_OUTPUT_MODE`. The reply has the same 3-byte record layout as `MSP2_INAV_OUTPUT_ASSIGNMENT`. Returns `MSP_RESULT_ERROR` if `timerCount` exceeds `HARDWARE_TIMER_DEFINITION_COUNT` or if the remaining request bytes are not exactly `timerCount * 2`. Pairs whose `timerId` is out of range are ignored rather than rejected. Record count is not a constant: maxTimMotorCount motors, then maxTimServoCount servos, then at most one beeper entry; read until the payload is exhausted.'
    variable_len: true
    variants:
      dataSize == 0:
        description: Preview using the currently stored timer overrides
        request: null
        reply:
          fields:
            items:
              repeat: until_end
              fields:

                outputIndex:
                  type: uint8
                  unit: Index
                  description: Index into the target's `timerHardware[]` array for this output.

                usageType:
                  type: uint8
                  description: 'Bit index of the `TIM_USE_*` flag, not the flag value itself: 2 = `TIM_USE_MOTOR`, 3 = `TIM_USE_SERVO`, 25 = `TIM_USE_BEEPER`. Derived in the firmware with `__builtin_ctz(TIM_USE_x)` and matching the `TIM_USE_*` constants in the configurator''s `outputMapping.js`.'

                functionIndex:
                  type: uint8
                  unit: Index
                  description: '1-based ordinal within the usage type: motor 1..n, servo 1..n. Always 1 for the beeper entry.'
      dataSize >= 1:
        description: Preview using proposed overrides layered over the stored ones
        request:
          fields:

            timerCount:
              type: uint8
              description: Number of override pairs that follow. Must be <= `HARDWARE_TIMER_DEFINITION_COUNT`.

            items:
              repeat: timerCount
              fields:

                timerId:
                  type: uint8
                  unit: Index
                  description: Hardware timer index (0 to `HARDWARE_TIMER_DEFINITION_COUNT - 1`). Out-of-range values are silently skipped.

                outputMode:
                  type: uint8
                  enum: outputMode_e
                  description: Proposed output mode override (`outputMode_e`) for that timer
        reply:
          fields:

            items:
              repeat: until_end
              fields:

                outputIndex:
                  type: uint8
                  unit: Index
                  description: Index into the target's `timerHardware[]` array for this output.

                usageType:
                  type: uint8
                  description: 'Bit index of the `TIM_USE_*` flag, not the flag value itself: 2 = `TIM_USE_MOTOR`, 3 = `TIM_USE_SERVO`, 25 = `TIM_USE_BEEPER`. Derived in the firmware with `__builtin_ctz(TIM_USE_x)` and matching the `TIM_USE_*` constants in the configurator''s `outputMapping.js`.'

                functionIndex:
                  type: uint8
                  unit: Index
                  description: '1-based ordinal within the usage type: motor 1..n, servo 1..n. Always 1 for the beeper entry.'

  MSP2_INAV_OSD_UPDATE_POSITION:
    id: 8472
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Moves a single OSD item within the active layout and redraws it immediately.
    notes: Requires `USE_OSD`. Expects 3 bytes; returns `MSP_RESULT_ERROR` if fewer are supplied or if `itemIndex >= OSD_ITEM_COUNT`, otherwise `MSP_RESULT_ACK`. Writes to the currently active layout (`getCurrentLayout()`) and takes no layout argument; use `MSP2_INAV_OSD_SET_LAYOUT_ITEM` to address a specific layout. Erases the item at its old position and redraws it immediately rather than triggering a full OSD redraw; the erase step only clears custom elements (items 147-149 and 154-158), so moving other item types can leave the old glyphs on screen until the next full redraw.
    request:
      fields:
        itemIndex:
          type: uint8
          unit: Index
          description: OSD item index (0 to `OSD_ITEM_COUNT - 1`)

        itemPosition:
          type: uint16
          unit: Coordinates
          description: Packed X/Y position built with `OSD_POS(x, y)`. The firmware ORs in `OSD_VISIBLE_FLAG` (0x2000), so the item is always made visible regardless of the bit supplied.
    reply: null

  MSP2_INAV_SERVO_CONFIG:
    id: 8704
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Retrieves the configuration parameters for all supported servos (min, max, middle, rate). Supersedes `MSP_SERVO_CONFIGURATIONS`.
    variable_len: MAX_SUPPORTED_SERVOS
    request: null
    reply:
      repeat: MAX_SUPPORTED_SERVOS
      fields:
        min:
          type: int16
          unit: PWM
          description: Minimum servo endpoint (`servoParams(i)->min`)

        max:
          type: int16
          unit: PWM
          description: Maximum servo endpoint (`servoParams(i)->max`)

        middle:
          type: int16
          unit: PWM
          description: Middle/Neutral servo position (`servoParams(i)->middle`)

        rate:
          type: int8
          unit: '% (-125 to 125)'
          description: Servo rate/scaling (`servoParams(i)->rate`)

  MSP2_INAV_SET_SERVO_CONFIG:
    id: 8705
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Sets the configuration parameters for a single servo. Supersedes `MSP_SET_SERVO_CONFIGURATION`.
    notes: Expects 8 bytes. Returns error if index invalid. Calls `servoComputeScalingFactors()`.
    request:
      fields:
        servoIndex:
          type: uint8
          unit: Index
          description: Index of the servo to configure (0 to `MAX_SUPPORTED_SERVOS - 1`)

        min:
          type: int16
          unit: PWM
          description: Sets minimum servo endpoint

        max:
          type: int16
          unit: PWM
          description: Sets maximum servo endpoint

        middle:
          type: int16
          unit: PWM
          description: Sets middle/neutral servo position

        rate:
          type: int8
          unit: '% (-125 to 125)'
          description: Sets servo rate/scaling
    reply: null

  MSP2_INAV_GEOZONE:
    id: 8720
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Get configuration for a specific Geozone.
    notes: Requires `USE_GEOZONE`. Used by `mspFcGeozoneOutCommand`.
    request:
      fields:
        geozoneIndex:
          type: uint8
          description: Index of the geozone (0 to `MAX_GEOZONES_IN_CONFIG - 1`)
    reply:
      fields:

        geozoneIndex:
          type: uint8
          description: Index requested

        type:
          type: uint8
          description: 'Define (`GEOZONE_TYPE_EXCLUSIVE/INCLUSIVE`): Zone type (Inclusion/Exclusion)'

        shape:
          type: uint8
          description: 'Define (`GEOZONE_SHAPE_CIRCULAR/POLYGON`): Zone shape (Polygon/Circular)'

        minAltitude:
          type: int32
          unit: cm
          description: Minimum allowed altitude within the zone (`geoZonesConfig(idx)->minAltitude`)

        maxAltitude:
          type: int32
          unit: cm
          description: Maximum allowed altitude within the zone (`geoZonesConfig(idx)->maxAltitude`)

        isSeaLevelRef:
          type: uint8
          description: 'Boolean: 1 if altitudes are relative to sea level, 0 if relative to home'

        fenceAction:
          type: uint8
          enum: fenceAction_e
          description: 'Enum (`fenceAction_e`): Action to take upon boundary violation'

        vertexCount:
          type: uint8
          description: Number of vertices defined for this zone

  MSP2_INAV_SET_GEOZONE:
    id: 8721
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Sets the main configuration for a specific Geozone (type, shape, altitude, action). **This command resets (clears) all vertices associated with the zone.**
    notes: Requires `USE_GEOZONE`. Expects 14 bytes. Returns error if index invalid. Calls `geozoneResetVertices()`. Vertices must be set subsequently using `MSP2_INAV_SET_GEOZONE_VERTEX`.
    request:
      fields:
        geozoneIndex:
          type: uint8
          description: Index of the geozone (0 to `MAX_GEOZONES_IN_CONFIG - 1`)

        type:
          type: uint8
          description: 'Define (`GEOZONE_TYPE_EXCLUSIVE/INCLUSIVE`): Zone type (Inclusion/Exclusion)'

        shape:
          type: uint8
          description: 'Define (`GEOZONE_SHAPE_CIRCULAR/POLYGON`): Zone shape (Polygon/Circular)'

        minAltitude:
          type: int32
          unit: cm
          description: Minimum allowed altitude (`geoZonesConfigMutable()->minAltitude`)

        maxAltitude:
          type: int32
          unit: cm
          description: Maximum allowed altitude (`geoZonesConfigMutable()->maxAltitude`)

        isSeaLevelRef:
          type: uint8
          description: 'Boolean: Altitude reference'

        fenceAction:
          type: uint8
          enum: fenceAction_e
          description: 'Enum (`fenceAction_e`): Action to take upon boundary violation'

        vertexCount:
          type: uint8
          description: Number of vertices to be defined (used for validation later)
    reply: null

  MSP2_INAV_GEOZONE_VERTEX:
    id: 8722
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Get a specific vertex (or center+radius for circular zones) of a Geozone.
    notes: Requires `USE_GEOZONE`. Returns error if indexes are invalid or vertex doesn't exist. For circular zones, the radius is stored internally as the 'latitude' of the vertex with index 1.
    variable_len: true
    request:
      fields:
        geozoneIndex:
          type: uint8
          description: Index of the geozone

        vertexId:
          type: uint8
          description: Index of the vertex within the zone (0-based). For circles, 0 = center
    reply:
      fields:

        geozoneIndex:
          type: uint8
          unit: Index
          description: Geozone index requested

        vertexId:
          type: uint8
          unit: Index
          description: Vertex index requested

        latitude:
          type: int32
          unit: deg * 1e7
          description: Vertex latitude

        longitude:
          type: int32
          unit: deg * 1e7
          description: Vertex longitude

        radius:
          type: optional int32
          unit: cm
          description: If vertex is circle, Radius of the circular zone

  MSP2_INAV_SET_GEOZONE_VERTEX:
    id: 8723
    inav_version:
      since: "8.0"
    mspv: 2
    group: inav
    description: Sets a specific vertex (or center+radius for circular zones) for a Geozone.
    notes: Requires `USE_GEOZONE`. Expects 10 bytes (Polygon) or 14 bytes (Circular). Returns error if indexes invalid or if trying to set vertex beyond `vertexCount` defined in `MSP2_INAV_SET_GEOZONE`. Calls `geozoneSetVertex()`. For circular zones, sets center (vertex 0) and radius (vertex 1's latitude).
    variants:
      polygon:
        description: Polygonal Geozone
        request:
          fields:
            geozoneIndex:
              type: uint8
              unit: Index
              description: Geozone index requested

            vertexId:
              type: uint8
              unit: Index
              description: Vertex index requested

            latitude:
              type: int32
              unit: deg * 1e7
              description: Vertex latitude

            longitude:
              type: int32
              unit: deg * 1e7
              description: Vertex longitude
        reply: null
      circle:
        description: Circular Geozone
        request:
          fields:

            geozoneIndex:
              type: uint8
              unit: Index
              description: Geozone index requested

            vertexId:
              type: uint8
              unit: Index
              description: Vertex index requested

            latitude:
              type: int32
              unit: deg * 1e7
              description: Vertex/Center latitude

            longitude:
              type: int32
              unit: deg * 1e7
              description: Vertex/Center longitude

            radius:
              type: int32
              unit: cm
              description: Radius of the circular zone
        reply: null

  MSP2_INAV_SET_GVAR:
    id: 8724
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Sets the specified Global Variable (GVAR) to the provided value.
    notes: Requires `USE_PROGRAMMING_FRAMEWORK`. Expects 5 bytes. Returns error if index is outside `MAX_GLOBAL_VARIABLES`.
    request:
      fields:
        gvarIndex:
          type: uint8
          unit: Index
          description: Index of the Global Variable to set

        value:
          type: int32
          description: New value to store (clamped to configured min/max by `gvSet()`)
    reply: null

  MSP2_INAV_SET_ALT_TARGET:
    id: 8725
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Set the active altitude hold target using updateClimbRateToAltitudeController.
    notes: Set new altitude target. Requires 5-byte payload (datum + target) and is set-only. Valid only in NAV or ALTHOLD modes. Command is rejected unless altitude control is active, not landing/emergency landing, altitude estimation is valid, and datum is supported (MSL requires valid GPS origin; TERRAIN is reserved and rejected).
    request:
      fields:
        altitudeDatum:
          type: uint8
          enum: geoAltitudeDatumFlag_e
          description: 'Altitude reference datum flag (`geoAltitudeDatumFlag_e`): `NAV_WP_TAKEOFF_DATUM` (default), `NAV_WP_MSL_DATUM`, `NAV_WP_TERRAIN_DATUM` and `NAV_WP_RELATIVE_DATUM` (not implemented yet)'

        altitudeTarget:
          type: int32
          unit: cm
          description: Desired altitude target according to reference datum
    reply: null

  MSP2_INAV_FLIGHT_AXIS_ANGLE_OVERRIDE:
    id: 8726
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Enables or disables a flight-axis angle override for the selected axis.
    notes: Uses the same override path as logic conditions and bypasses stick-derived angle targets.
    request:
      fields:
        overrideMask:
          type: uint8
          bitmask: true
          description: Bitmask of desired-state fields that follow (Roll, Pitch, Yaw). Non-zero enables the override; zero disables it for that axis.

        angleTargetRoll:
          type: int16
          unit: deci-degrees
          description: Angle target in deci-degrees. Roll/Pitch clamped to configured angle limits

        angleTargetPitch:
          type: int16
          unit: deci-degrees
          description: Angle target in deci-degrees. Roll/Pitch clamped to configured angle limits

        angleTargetYaw:
          type: int16
          unit: deci-degrees
          description: "Angle target in deci-degrees. Yaw clamped to 0\u20133600."
    reply: null

  MSP2_INAV_FLIGHT_AXIS_RATE_OVERRIDE:
    id: 8727
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Enables or disables a flight-axis rate override for the selected axis.
    notes: Expects 7 bytes. Overrides rate targets just before control is applied, bypassing stick-derived setpoints.
    request:
      fields:
        overrideMask:
          type: uint8
          bitmask: true
          description: Bitmask of desired-state fields that follow (Roll, Pitch, Yaw). Non-zero enables the override; zero disables it for that axis.

        rateTargetRoll:
          type: int16
          unit: deg/s
          description: "Rate target, clamped to \xB12000"

        rateTargetPitch:
          type: int16
          unit: deg/s
          description: "Rate target, clamped to \xB12000"

        rateTargetYaw:
          type: int16
          unit: deg/s
          description: "Rate target, clamped to \xB12000"
    reply: null

  MSP2_INAV_SET_LOCAL_TARGET:
    id: 8728
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Sets a body-frame offset target relative to the current vehicle position.
    notes: Offsets are in the vehicle body frame (forward/right/up, cm) and are rotated into the NEU frame using the current yaw, applied relative to current position. Z offset is always provided; Z=0 keeps current altitude, non-zero offsets are relative to current altitude. Requires GCSNAV/offboard to be active and a valid guided poshold; updates the navigation desired position via `setDesiredPosition()`.
    variable_len: true
    request:
      fields:
        offsetForward:
          type: int32
          unit: cm
          description: Body-frame forward offset from the current position, rotated into NEU by the current yaw

        offsetRight:
          type: int32
          unit: cm
          description: Body-frame right offset from the current position, rotated into NEU by the current yaw

        offsetUp:
          type: int32
          unit: cm
          description: Offset above the current altitude (up-positive). 0 keeps the current altitude
    reply: null

  MSP2_INAV_LOCAL_TARGET:
    id: 8729
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the current navigation desired state (position, velocity, yaw, and climb rate).
    notes: Local frame is NEU. Mirrors `posControl.desiredState` (position, velocity, yaw, climb rate) used by the position controller.
    request: null
    reply:
      fields:
        posX:
          type: int32
          unit: cm
          description: Desired X in local NEU frame (`posControl.desiredState.pos.x`)

        posY:
          type: int32
          unit: cm
          description: Desired Y in local NEU frame (`posControl.desiredState.pos.y`)

        posZ:
          type: int32
          unit: cm
          description: Desired Z in local NEU frame (`posControl.desiredState.pos.z`, up-positive)

        velX:
          type: int16
          unit: cm/s
          description: Desired X velocity (`posControl.desiredState.vel.x`)

        velY:
          type: int16
          unit: cm/s
          description: Desired Y velocity (`posControl.desiredState.vel.y`)

        velZ:
          type: int16
          unit: cm/s
          description: Desired Z velocity (`posControl.desiredState.vel.z`)

        yaw:
          type: int32
          unit: centi-degrees
          description: Desired heading (`posControl.desiredState.yaw`)

        climbRate:
          type: int16
          unit: cm/s
          description: Desired climb rate demand (`posControl.desiredState.climbRateDemand`)

  MSP2_INAV_SET_GLOBAL_TARGET:
    id: 8730
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Sets desired GCS Nav position with global coordinates (WP 254/GOTO).
    notes: Uses the GCSNAV/offboard path; rejected when GCSNAV is not active. Rejects `NAV_WP_TERRAIN_DATUM`; other datums are converted to local NEU and applied through `setDesiredPosition()`. Altitude of 0 leaves current Z unchanged. Existing 13-byte payloads are still accepted; 17-byte payloads append `loiterRadius`, where `0` clears the temporary override and non-zero values are centimeters.
    request:
      fields:
        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude coordinate

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude coordinate

        altitudeTarget:
          type: int32
          unit: cm
          description: Desired altitude target according to reference datum (0 keeps current altitude)

        altitudeDatum:
          type: uint8
          enum: geoAltitudeDatumFlag_e
          description: 'Altitude reference datum flag (`geoAltitudeDatumFlag_e`): `NAV_WP_TAKEOFF_DATUM`, `NAV_WP_MSL_DATUM`, `NAV_WP_TERRAIN_DATUM` (not implemented yet)'

        loiterRadius:
          type: optional int32
          unit: cm
          description: Optional temporary fixed-wing PosHold loiter radius override. Appended field; omit to leave unchanged. `0` clears the override and uses `navConfig()->fw.loiter_radius`.
    reply: null

  MSP2_INAV_NAV_TARGET:
    id: 8731
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the current navigation desired global target (lat/lon/alt, heading, climb rate).
    notes: Altitude target is reported in the takeoff datum frame (local Z). Heading is sourced from the heading-hold target. Intended for monitoring the active navigation desired target (Goto/Followme/RTH/Safehome). The appended `loiterRadius` reports the temporary override only; `0` means the configured default is active.
    request: null
    reply:
      fields:
        latTarget:
          type: int32
          unit: 1e-7 deg
          description: Latitude in degrees * 1e7

        lonTarget:
          type: int32
          unit: 1e-7 deg
          description: Longitude in degrees * 1e7

        altitudeTarget:
          type: int32
          unit: cm
          description: Desired altitude target (takeoff datum, cm) as used by altitude/position hold

        headingTarget:
          type: uint16
          unit: degrees
          description: "Current heading-hold target (`getHeadingHoldTarget()`), wrapped to 0\u2013359.99"

        climbRate:
          type: int16
          unit: cm/s
          description: Desired climb rate demand (`posControl.desiredState.climbRateDemand`)

        loiterRadius:
          type: uint32
          unit: cm
          description: Temporary fixed-wing PosHold loiter radius override. `0` means no override; the configured `navConfig()->fw.loiter_radius` is used.

  MSP2_INAV_FULL_LOCAL_POSE:
    id: 8736
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Provides estimates of current attitude, local NEU position, and velocity.
    notes: All attitude angles are in deci-degrees.
    request: null
    reply:
      fields:
        roll:
          type: int16
          unit: deci-degrees
          description: Roll angle (`attitude.values.roll`)

        pitch:
          type: int16
          unit: deci-degrees
          description: Pitch angle (`attitude.values.pitch`)

        yaw:
          type: int16
          unit: deci-degrees
          description: Yaw/Heading angle (`attitude.values.yaw`)

        localPositionNorth:
          type: int32
          unit: cm
          description: Estimated North coordinate in local NEU frame (`posControl.actualState.abs.pos.x`)

        localVelocityNorth:
          type: int16
          unit: cm/s
          description: Estimated North component of velocity in local NEU frame (`posControl.actualState.abs.vel.x`)

        localPositionEast:
          type: int32
          unit: cm
          description: Estimated East coordinate in local NEU frame (`posControl.actualState.abs.pos.y`)

        localVelocityEast:
          type: int16
          unit: cm/s
          description: Estimated East component of velocity in local NEU frame (`posControl.actualState.abs.vel.y`)

        localPositionUp:
          type: int32
          unit: cm
          description: Estimated Up coordinate in local NEU frame (`posControl.actualState.abs.pos.z`)

        localVelocityUp:
          type: int16
          unit: cm/s
          description: Estimated Up component of velocity in local NEU frame (`posControl.actualState.abs.vel.z`)

  MSP2_INAV_SET_WP_INDEX:
    id: 8737
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Jumps to a specific waypoint during an active waypoint mission, causing the aircraft to immediately begin navigating toward the new target waypoint.
    notes: Returns error if the aircraft is not armed, `NAV_WP_MODE` is not active, or the index is outside the valid mission range (`startWpIndex` to `startWpIndex + waypointCount - 1`). On success, sets `posControl.activeWaypointIndex` to the requested index and fires `NAV_FSM_EVENT_SWITCH_TO_WAYPOINT_JUMP`, transitioning the navigation FSM back to `NAV_STATE_WAYPOINT_PRE_ACTION` so the flight controller re-initialises navigation for the new target.
    request:
      fields:
        wp_index:
          type: uint8
          unit: '-'
          description: 0-based waypoint index to jump to, relative to the mission start waypoint (`posControl.startWpIndex`)
    reply: null

  MSP2_INAV_SET_CRUISE_HEADING:
    id: 8739
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Sets the course heading target while Cruise or Course Hold mode is active, causing the aircraft to turn to and maintain the new heading.
    notes: Returns error if the aircraft is not armed or `NAV_COURSE_HOLD_MODE` is not active. On success, sets both `posControl.cruise.course` and `posControl.cruise.previousCourse` to the normalised value, preventing spurious heading adjustments from `getCruiseHeadingAdjustment()` on the next control cycle.
    request:
      fields:
        heading_centidegrees:
          type: int32
          unit: centidegrees
          description: Target heading in centidegrees (0-35999). Values are wrapped modulo 36000 before being applied.
    reply: null

  MSP2_INAV_ACTIVATE_LANDING:
    id: 8740
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Commands an immediate normal landing at the current position.
    notes: Requires the aircraft to be armed with usable position, altitude, and heading estimates. Creates a transient LAND waypoint at the current position without changing the uploaded mission, then enters the normal `NAV_STATE_WAYPOINT_RTH_LAND` path. This is not emergency landing.
    request: null
    reply: null

  MSP2_INAV_ACTIVATE_RTH:
    id: 8741
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Commands the aircraft to execute its configured return-to-home sequence.
    notes: Requires the aircraft to be armed. Enters normal return-to-home mode through the same mode selector path as RC RTH, without setting the failsafe/geozone forced-RTH latch.
    request: null
    reply: null

  MSP2_INAV_ARM_DISARM:
    id: 8743
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Arms or disarms the flight controller using the normal FC arming path.
    notes: Returns an error for values other than 0 or 1, or when the requested armed state is not reached.
    request:
      fields:
        arm:
          type: uint8
          unit: Boolean
          description: 'Requested armed state: 0 disarms, 1 arms through the normal arming checks.'
    reply: null

  MSP2_INAV_TIMESYNC:
    id: 8744
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Returns the local monotonic boot time in nanoseconds.
    notes: The value is little-endian like other MSP integer fields and uses the same boot-time clock returned by MAVLink `TIMESYNC`.
    request: null
    reply:
      fields:
        timeNs:
          type: uint64
          unit: ns
          description: Monotonic flight-controller boot time, calculated as `(uint64_t)micros() * 1000`.

  MSP2_INAV_SET_AUX_RC:
    id: 8752
    inav_version:
      since: "9.0"
    mspv: 2
    group: inav
    description: Bandwidth-efficient auxiliary RC channel update. Sets CH13-CH32 with configurable resolution (2/4/8/16-bit) without affecting primary flight controls. Designed for extending channel count beyond native RC link capacity via MSP passthrough.
    notes: 'CH1-CH12 (index 0-11) are protected and will return `MSP_RESULT_ERROR`. Payload size must be 2-49 bytes. Constraint: `startChannel + channelCount <= 32`. Values persist until overwritten; no timeout. Applied as a post-RX overlay in `calculateRxChannelsAndUpdateFailsafe()` after MSP RC Override but before failsafe. Does not require `USE_RX_MSP` or MSP-RC-OVERRIDE flight mode. Does not affect failsafe detection. When MSP is the primary RX provider, channels covered by `MSP_SET_RAW_RC` are automatically skipped. Channels in the `mspOverrideChannels` bitmask are skipped when MSP RC Override mode is active. Recommended to send with `MSP_FLAG_DONT_REPLY` (flags=0x01) to save bandwidth on telemetry passthrough links. 16-bit mode requires even number of data bytes and values are clamped to 750-2250us.'
    variable_len: true
    request:
      fields:
        definitionByte:
          type: uint8
          description: 'Packed start channel and resolution. Bits 7-3: start channel index (valid range 12-31 for CH13-CH32; 0-11 rejected as error). Bits 2-0: resolution mode (0=2-bit, 1=4-bit, 2=8-bit, 3=16-bit; 4-7 reserved/error).'

        channelData:
          type: uint8[]
          unit: PWM (encoded)
          description: Packed channel values, sequential from start channel. Number of channels is derived from data size and resolution. Value 0 means skip (no update). Sub-byte modes (2-bit, 4-bit) are packed MSB-first. 2-bit values 1-3 map to 1000/1500/2000us. 4-bit values 1-15 map to 1000 + (val-1)*1000/14 us. 8-bit values 1-255 map to 1000 + (val-1)*1000/254 us. 16-bit values are direct PWM, clamped to 750-2250us.
    reply: null

  MSP2_INAV_WIND:
    id: 8753
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Retrieves the estimated horizontal wind speed and direction from the internal wind estimator.
    notes: Requires `USE_WIND_ESTIMATOR`; returns zeroes when wind estimation is not compiled in or not yet valid. Check bit 0 of `flags` before using speed/angle values.
    request: null
    reply:
      fields:
        windSpeed:
          type: uint16
          unit: cm/s
          description: Estimated horizontal wind speed (`getEstimatedHorizontalWindSpeed()`). 0 if unavailable.

        windAngle:
          type: uint16
          unit: degrees
          description: "Estimated wind direction in degrees (0\u2013359, 0 = North). Derived from centidegree value divided by 100. 0 if unavailable."

        flags:
          type: uint8
          description: 'Validity flags. Bit 0: wind estimate valid (`isEstimatedWindSpeedValid()`). Remaining bits reserved.'

  MSP2_INAV_MAG_UNALIGNED:
    id: 8754
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Reads the unaligned magnetometer vector.
    notes: Returns rounded mag.magADCUnaligned values before board alignment. Returns three zeroes without USE_MAG.
    request: null
    reply:
      fields:
        magADCUnaligned:
          type: int16[3]
          description: X, Y and Z components, rounded to signed 16-bit values.

  MSP2_INAV_ESC_SRXL2_STATUS:
    id: 8755
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Reads SRXL2 ESC calibration and connection status.
    notes: Requires USE_MOTOR_SRXL2. Counts report opened motor ports and the current mixer motor count, not hardware capacity.
    request: null
    reply:
      fields:
        phase:
          type: uint8
          description: Calibration phase (srxl2CalPhase_e).

        connected:
          type: uint8
          description: 1 when every opened ESC is connected; otherwise 0.

        lastResult:
          type: uint8
          description: Last calibration start result (srxl2CalResult_e).

        portCount:
          type: uint8
          description: Number of opened SRXL2 motor ports.

        motorCount:
          type: uint8
          description: Number of motors in the current mixer.

  MSP2_INAV_ESC_SRXL2_CALIBRATE:
    id: 8756
    inav_version:
      since: "10.0"
    mspv: 2
    group: inav
    description: Controls SRXL2 ESC throttle-range calibration.
    notes: 'Requires USE_MOTOR_SRXL2 and at least one request byte. Accepted commands: 0 abort, 1 automatic start, 4 manual high, 5 manual low. Driver safety checks can reject start requests; read MSP2_INAV_ESC_SRXL2_STATUS for the reason. Other command values return an MSP error. Remove propellers before calibration.'
    request:
      fields:
        phase:
          type: uint8
          description: 'Requested calibration action (srxl2CalPhase_e): 0, 1, 4 or 5.'
    reply: null

  MSP2_BETAFLIGHT_BIND:
    id: 12288
    inav_version:
      since: "8.0"
    mspv: 2
    group: common
    description: Initiates the receiver binding procedure for supported serial protocols (CRSF, SRXL2).
    notes: Requires `rxConfig()->receiverType == RX_TYPE_SERIAL`. Requires `USE_SERIALRX_CRSF` or `USE_SERIALRX_SRXL2`. Calls `crsfBind()` or `srxl2Bind()` respectively. Returns error if receiver type or provider is not supported for binding.
    request: null
    reply: null

  MSP2_RX_BIND:
    id: 12289
    inav_version:
      since: "9.0"
    mspv: 2
    group: common
    description: Initiates binding for MSP receivers (mLRS).
    notes: Requires a receiver using MSP as the protocol, sends MSP2_RX_BIND to the receiver.
    request:
      fields:
        port_id:
          type: uint8
          description: Port ID

        reserved_for_custom_use:
          type: uint8[3]
          description: Reserved for custom use
    reply:
      fields:

        port_id:
          type: uint8
          description: Port ID

        reserved_for_custom_use:
          type: uint8[3]
          description: Reserved for custom use
