    request:
      fields:
        legacyRollPitchItermIgnore:
          type: uint16
          description: Ignored (legacy compatibility).

        legacyYawItermIgnore:
          type: uint16
          description: Ignored (legacy compatibility).

        legacyYawPLimit:
          type: uint16
          description: Ignored (legacy compatibility).

        bfCompatDeltaMethod:
          type: uint8
          description: Ignored (BF compatibility).

        bfCompatVbatPidComp:
          type: uint8
          description: Ignored (BF compatibility).

        bfCompatSetpointRelaxRatio:
          type: uint8
          description: Ignored (BF compatibility).

        reserved1:
          type: uint8
          description: Ignored (reserved).

        legacyPidSumLimit:
          type: uint16
          description: Ignored (legacy compatibility).

        bfCompatItermThrottleGain:
          type: uint8
          description: Ignored (BF compatibility).

        accelLimitRollPitch:
          type: uint16
          unit: dps / 10
          description: Sets `pidProfileMutable()->axisAccelerationLimitRollPitch = value * 10`.

        accelLimitYaw:
          type: uint16
          unit: dps / 10
          description: Sets `pidProfileMutable()->axisAccelerationLimitYaw = value * 10`.
    reply: null

  MSP_SENSOR_CONFIG:
    id: 96
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the configured hardware type for various sensors.
    request: null
    reply:
      fields:
        accHardware:
          type: uint8
          enum: accelerationSensor_e
          description: 'Enum (`accelerationSensor_e`): Accelerometer hardware type (`accelerometerConfig()->acc_hardware`)'

        baroHardware:
          type: uint8
          enum: baroSensor_e
          description: 'Enum (`baroSensor_e`): Barometer hardware type (`barometerConfig()->baro_hardware`). 0 if `USE_BARO` disabled'

        magHardware:
          type: uint8
          enum: magSensor_e
          description: 'Enum (`magSensor_e`): Magnetometer hardware type (`compassConfig()->mag_hardware`). 0 if `USE_MAG` disabled'

        pitotHardware:
