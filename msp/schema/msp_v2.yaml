# MSP message definitions. Authored: this is the source, nothing generates it.

version: 1
package: inav.msp

imports:
  - inav.enums
  - inav.constants

# Payload types INAV declares itself. Their interior is not restated here --
# generator/extract_wire_types.py vendors the real declarations -- but their
# width is protocol, so it is declared and checked against INAV at build time.
external_types:
  escSensorData_t:
    size: 16
    description: ESC telemetry record; sensors/esc_sensor.h, written to the wire unpacked.
  ledConfig_t:
    size: 5
    description: One LED's configuration; io/ledstrip.h, a packed bitfield struct.
  boxBitmask_t:
    size: 8
    description: Active-mode bitarray; fc/rc_modes.h, sized by CHECKBOX_ITEM_COUNT.


messages:
  MSP_API_VERSION:
    id: 1
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the MSP protocol version and the INAV API version.
    notes: Used by configurators to check compatibility.
    request: null
    reply:
      fields:
        mspProtocolVersion:
          type: uint8
          description: MSP Protocol version (`MSP_PROTOCOL_VERSION`, typically 0)

        apiVersionMajor:
          type: uint8
          description: INAV API Major version (`API_VERSION_MAJOR`)

        apiVersionMinor:
          type: uint8
          description: INAV API Minor version (`API_VERSION_MINOR`)

  MSP_FC_VARIANT:
    id: 2
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Identifies the flight controller firmware variant (e.g., INAV, Betaflight).
    notes: See `FLIGHT_CONTROLLER_IDENTIFIER_LENGTH`.
    request: null
    reply:
      fields:
        fcVariantIdentifier:
          type: char[4]
          description: 4-character identifier string (e.g., "INAV"). Defined by `flightControllerIdentifier`.

  MSP_FC_VERSION:
    id: 3
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the specific version number of the flight controller firmware.
    request: null
    reply:
      fields:
        fcVersionMajor:
          type: uint8
          description: Firmware Major version (`FC_VERSION_MAJOR`)

        fcVersionMinor:
          type: uint8
          description: Firmware Minor version (`FC_VERSION_MINOR`)

        fcVersionPatch:
          type: uint8
          description: Firmware Patch level (`FC_VERSION_PATCH_LEVEL`)

  MSP_BOARD_INFO:
    id: 4
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides information about the specific hardware board and its capabilities.
    notes: '`BOARD_IDENTIFIER_LENGTH` is 4.'
    variable_len: true
    request: null
    reply:
      fields:
        boardIdentifier:
          type: char[4]
          description: 4-character UPPER CASE board identifier (`TARGET_BOARD_IDENTIFIER`)

        hardwareRevision:
          type: uint16
          description: Hardware revision number. 0 if not detected (`USE_HARDWARE_REVISION_DETECTION`)

        osdSupport:
          type: uint8
          description: 'OSD chip type: 0=None, 2=Onboard (`USE_OSD`). INAV does not support slave OSD (1)'

        commCapabilities:
          type: uint8
          bitmask: true
          description: 'Bitmask: Communication capabilities: Bit 0=VCP support (`USE_VCP`), Bit 1=SoftSerial support (`USE_SOFTSERIAL1`/`2`), Bit 2=compass orientation auto-detection during mag calibration (`USE_MAG_CALIBRATION_ORIENTATION`)'

        targetNameLength:
          type: uint8
          description: Length of the target name string that follows

        targetName:
          type: char[]
          description: Target name string (e.g., "MATEKF405"). Length given by previous field

  MSP_BUILD_INFO:
    id: 5
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides build date, time, and Git revision of the firmware.
    request: null
    reply:
      fields:
        buildDate:
          type: char[BUILD_DATE_LENGTH]
          description: Build date string (e.g., "Dec 31 2023"). `BUILD_DATE_LENGTH`.

        buildTime:
          type: char[BUILD_TIME_LENGTH]
          description: Build time string (e.g., "23:59:59"). `BUILD_TIME_LENGTH`.

        gitRevision:
          type: char[GIT_SHORT_REVISION_LENGTH]
          description: Short Git revision string. `GIT_SHORT_REVISION_LENGTH`.

  MSP_INAV_PID:
    id: 6
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves legacy INAV-specific PID controller related settings. Many fields are now obsolete or placeholders.
    notes: Superseded by `MSP2_PID` for core PIDs and other specific messages for filter settings.
    request: null
    reply:
      fields:
        legacyAsyncProcessing:
          type: uint8
          description: Legacy, unused. Always 0
          value: 0

        legacyAsyncValue1:
          type: uint16
          description: Legacy, unused. Always 0
          value: 0

        legacyAsyncValue2:
          type: int16
          description: Legacy, unused. Always 0
          value: 0

        headingHoldRateLimit:
          type: uint8
          unit: deg/s
          description: Max rate for heading hold P term (`pidProfile()->heading_hold_rate_limit`)

        headingHoldLpfFreq:
          type: uint8
          unit: Hz
          description: Fixed LPF frequency for heading hold error (`HEADING_HOLD_ERROR_LPF_FREQ`)

        legacyYawJumpLimit:
          type: int16
          description: Legacy, unused. Always 0
          value: 0

        legacyGyroLpf:
          type: uint8
          unit: Hz
          description: Fixed value `GYRO_LPF_256HZ`

        accLpfHz:
          type: uint8
          unit: Hz
          description: Accelerometer LPF frequency (`accelerometerConfig()->acc_lpf_hz`) cutoff frequency for the low pass filter used on the acc z-axis for althold in Hz

        reserved1:
          type: uint8
          description: Reserved. Always 0
          value: 0

        reserved2:
          type: uint8
          description: Reserved. Always 0
          value: 0

        reserved3:
          type: uint8
          description: Reserved. Always 0
          value: 0

        reserved4:
          type: uint8
          description: Reserved. Always 0
          value: 0

  MSP_SET_INAV_PID:
    id: 7
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets legacy INAV-specific PID controller related settings.
    notes: Expects 15 bytes.
    request:
      fields:
        legacyAsyncProcessing:
          type: uint8
          description: Legacy, ignored

        legacyAsyncValue1:
          type: int16
          description: Legacy, ignored

        legacyAsyncValue2:
          type: int16
          description: Legacy, ignored

        headingHoldRateLimit:
          type: uint8
          unit: deg/s
          description: Sets `pidProfileMutable()->heading_hold_rate_limit`.

        headingHoldLpfFreq:
          type: uint8
          unit: Hz
          description: Ignored (fixed value `HEADING_HOLD_ERROR_LPF_FREQ` used)

        legacyYawJumpLimit:
          type: int16
          description: Legacy, ignored

        legacyGyroLpf:
          type: uint8
          description: Ignored (historically mapped to `gyro_lpf_e` values).

        accLpfHz:
          type: uint8
          unit: Hz
          description: Sets `accelerometerConfigMutable()->acc_lpf_hz`.

        reserved1:
          type: uint8
          description: Ignored

        reserved2:
          type: uint8
          description: Ignored

        reserved3:
          type: uint8
          description: Ignored

        reserved4:
          type: uint8
          description: Ignored
    reply: null

  MSP_NAME:
    id: 10
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Returns the user-defined craft name.
    variable_len: true
    request: null
    reply:
      fields:
        craftName:
          type: char[]
          description: The craft name string (`systemConfig()->craftName`). Null termination is *not* explicitly sent, the length is determined by the payload size

  MSP_SET_NAME:
    id: 11
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the user-defined craft name.
    notes: Maximum length is `MAX_NAME_LENGTH`.
    variable_len: true
    request:
      fields:
        craftName:
          type: cstring
          description: The new craft name string. Automatically null-terminated by the FC
    reply: null

  MSP_NAV_POSHOLD:
    id: 12
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves navigation position hold and general manual/auto flight parameters. Some parameters depend on the platform type (Multirotor vs Fixed Wing).
    request: null
    reply:
      fields:
        userControlMode:
          type: uint8
          description: Navigation user control mode NAV_GPS_ATTI (0) or NAV_GPS_CRUISE (1)

        maxAutoSpeed:
          type: uint16
          unit: cm/s
          description: Max speed in autonomous modes (`navConfig()->general.max_auto_speed`)

        maxAutoClimbRate:
          type: uint16
          unit: cm/s
          description: Max climb rate in autonomous modes (uses `fw.max_auto_climb_rate` or `mc.max_auto_climb_rate` based on platform)

        maxManualSpeed:
          type: uint16
          unit: cm/s
          description: Max speed in manual modes with GPS aiding (`navConfig()->general.max_manual_speed`)

        maxManualClimbRate:
          type: uint16
          unit: cm/s
          description: Max climb rate in manual modes with GPS aiding (uses `fw.max_manual_climb_rate` or `mc.max_manual_climb_rate`)

        mcMaxBankAngle:
          type: uint8
          unit: degrees
          description: Max bank angle for multirotor position hold (`navConfig()->mc.max_bank_angle`)

        mcAltHoldThrottleType:
          type: uint8
          enum: navMcAltHoldThrottle_e
          description: Enum `navMcAltHoldThrottle_e` mirrored from `navConfig()->mc.althold_throttle_type`.

        mcHoverThrottle:
          type: uint16
          unit: PWM
          description: Multirotor hover throttle PWM value (`currentBatteryProfile->nav.mc.hover_throttle`).

  MSP_SET_NAV_POSHOLD:
    id: 13
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets navigation position hold and general manual/auto flight parameters.
    notes: Expects 13 bytes.
    request:
      fields:
        userControlMode:
          type: uint8
          enum: nav_control_type_e
          description: 'Sets `navConfigMutable()->general.flags.user_control_mode`. WARNING: uses unnamed enum in navigation.h ''NAV_GPS_ATTI/NAV_GPS_CRUISE'''

        maxAutoSpeed:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->general.max_auto_speed`.

        maxAutoClimbRate:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->fw.max_auto_climb_rate` or `navConfigMutable()->mc.max_auto_climb_rate` based on `mixerConfig()->platformType`.

        maxManualSpeed:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->general.max_manual_speed`.

        maxManualClimbRate:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->fw.max_manual_climb_rate` or `navConfigMutable()->mc.max_manual_climb_rate`.

        mcMaxBankAngle:
          type: uint8
          unit: degrees
          description: Sets `navConfigMutable()->mc.max_bank_angle`.

        mcAltHoldThrottleType:
          type: uint8
          enum: navMcAltHoldThrottle_e
          description: Enum `navMcAltHoldThrottle_e`; updates `navConfigMutable()->mc.althold_throttle_type`.

        mcHoverThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->nav.mc.hover_throttle`.
    reply: null

  MSP_CALIBRATION_DATA:
    id: 14
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves sensor calibration data (Accelerometer zero/gain, Magnetometer zero/gain, Optical Flow scale).
    notes: Total size 27 bytes. Fields related to optional sensors are zero if the sensor is not used.
    request: null
    reply:
      fields:
        accCalibAxisFlags:
          type: uint8
          bitmask: true
          description: 'Bitmask: Flags indicating which axes of the accelerometer have been calibrated (`accGetCalibrationAxisFlags()`)'

        accZeroX:
          type: int16
          unit: Raw ADC
          description: Accelerometer zero offset for X-axis (`accelerometerConfig()->accZero.raw[X]`)

        accZeroY:
          type: int16
          unit: Raw ADC
          description: Accelerometer zero offset for Y-axis (`accelerometerConfig()->accZero.raw[Y]`)

        accZeroZ:
          type: int16
          unit: Raw ADC
          description: Accelerometer zero offset for Z-axis (`accelerometerConfig()->accZero.raw[Z]`)

        accGainX:
          type: int16
          unit: Raw ADC
          description: Accelerometer gain/scale for X-axis (`accelerometerConfig()->accGain.raw[X]`)

        accGainY:
          type: int16
          unit: Raw ADC
          description: Accelerometer gain/scale for Y-axis (`accelerometerConfig()->accGain.raw[Y]`)

        accGainZ:
          type: int16
          unit: Raw ADC
          description: Accelerometer gain/scale for Z-axis (`accelerometerConfig()->accGain.raw[Z]`)

        magZeroX:
          type: int16
          unit: Raw ADC
          description: Magnetometer zero offset for X-axis (`compassConfig()->magZero.raw[X]`). 0 if `USE_MAG` disabled

        magZeroY:
          type: int16
          unit: Raw ADC
          description: Magnetometer zero offset for Y-axis (`compassConfig()->magZero.raw[Y]`). 0 if `USE_MAG` disabled

        magZeroZ:
          type: int16
          unit: Raw ADC
          description: Magnetometer zero offset for Z-axis (`compassConfig()->magZero.raw[Z]`). 0 if `USE_MAG` disabled

        opflowScale:
          type: uint16
          unit: Scale * 256
          description: Optical flow scale factor (`opticalFlowConfig()->opflow_scale * 256`). 0 if `USE_OPFLOW` disabled

        magGainX:
          type: int16
          unit: Raw ADC
          description: Magnetometer gain/scale for X-axis (`compassConfig()->magGain[X]`). 0 if `USE_MAG` disabled

        magGainY:
          type: int16
          unit: Raw ADC
          description: Magnetometer gain/scale for Y-axis (`compassConfig()->magGain[Y]`). 0 if `USE_MAG` disabled

        magGainZ:
          type: int16
          unit: Raw ADC
          description: Magnetometer gain/scale for Z-axis (`compassConfig()->magGain[Z]`). 0 if `USE_MAG` disabled

  MSP_SET_CALIBRATION_DATA:
    id: 15
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets sensor calibration data.
    notes: Minimum payload 18 bytes. Adds +6 bytes for magnetometer zeros, +2 for optical flow scale, and +6 for magnetometer gains when those features (`USE_MAG`, `USE_OPFLOW`) are compiled in.
    request:
      fields:
        accZeroX:
          type: int16
          unit: Raw ADC
          description: Sets `accelerometerConfigMutable()->accZero.raw[X]`.

        accZeroY:
          type: int16
          unit: Raw ADC
          description: Sets `accelerometerConfigMutable()->accZero.raw[Y]`.

        accZeroZ:
          type: int16
          unit: Raw ADC
          description: Sets `accelerometerConfigMutable()->accZero.raw[Z]`.

        accGainX:
          type: int16
          unit: Raw ADC
          description: Sets `accelerometerConfigMutable()->accGain.raw[X]`.

        accGainY:
          type: int16
          unit: Raw ADC
          description: Sets `accelerometerConfigMutable()->accGain.raw[Y]`.

        accGainZ:
          type: int16
          unit: Raw ADC
          description: Sets `accelerometerConfigMutable()->accGain.raw[Z]`.

        magZeroX:
          type: int16
          unit: Raw ADC
          description: Sets `compassConfigMutable()->magZero.raw[X]` (if `USE_MAG`)

        magZeroY:
          type: int16
          unit: Raw ADC
          description: Sets `compassConfigMutable()->magZero.raw[Y]` (if `USE_MAG`)

        magZeroZ:
          type: int16
          unit: Raw ADC
          description: Sets `compassConfigMutable()->magZero.raw[Z]` (if `USE_MAG`)

        opflowScale:
          type: optional uint16
          unit: Scale * 256
          description: Sets `opticalFlowConfigMutable()->opflow_scale = value / 256.0f` (if `USE_OPFLOW`)

        magGainX:
          type: optional int16
          unit: Raw ADC
          description: Sets `compassConfigMutable()->magGain[X]` (if `USE_MAG`)

        magGainY:
          type: optional int16
          unit: Raw ADC
          description: Sets `compassConfigMutable()->magGain[Y]` (if `USE_MAG`)

        magGainZ:
          type: optional int16
          unit: Raw ADC
          description: Sets `compassConfigMutable()->magGain[Z]` (if `USE_MAG`)
    reply: null

  MSP_POSITION_ESTIMATION_CONFIG:
    id: 16
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves parameters related to the INAV position estimation fusion weights and GPS minimum satellite count.
    replaced_by:
      - MSP2_COMMON_SETTING
    request: null
    reply:
      fields:
        weightZBaroP:
          type: uint16
          unit: Weight * 100
          description: Barometer Z position fusion weight (`positionEstimationConfig()->w_z_baro_p * 100`)

        weightZGPSP:
          type: uint16
          unit: Weight * 100
          description: GPS Z position fusion weight (`positionEstimationConfig()->w_z_gps_p * 100`)

        weightZGPSV:
          type: uint16
          unit: Weight * 100
          description: GPS Z velocity fusion weight (`positionEstimationConfig()->w_z_gps_v * 100`)

        weightXYGPSP:
          type: uint16
          unit: Weight * 100
          description: GPS XY position fusion weight (`positionEstimationConfig()->w_xy_gps_p * 100`)

        weightXYGPSV:
          type: uint16
          unit: Weight * 100
          description: GPS XY velocity fusion weight (`positionEstimationConfig()->w_xy_gps_v * 100`)

        minSats:
          type: uint8
          unit: Count
          description: Minimum satellites required for GPS use (`gpsConfigMutable()->gpsMinSats`)

        useGPSVelNED:
          type: uint8
          unit: Boolean
          description: Legacy flag, always 1 (GPS velocity is always used if available)
          value: 1

  MSP_SET_POSITION_ESTIMATION_CONFIG:
    id: 17
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets parameters related to the INAV position estimation fusion weights and GPS minimum satellite count.
    notes: Expects 12 bytes.
    replaced_by:
      - MSP2_COMMON_SET_SETTING
    request:
      fields:
        weightZBaroP:
          type: uint16
          unit: Weight * 100
          description: Sets `positionEstimationConfigMutable()->w_z_baro_p = value / 100.0f` (constrained 0.0-10.0)

        weightZGPSP:
          type: uint16
          unit: Weight * 100
          description: Sets `positionEstimationConfigMutable()->w_z_gps_p = value / 100.0f` (constrained 0.0-10.0)

        weightZGPSV:
          type: uint16
          unit: Weight * 100
          description: Sets `positionEstimationConfigMutable()->w_z_gps_v = value / 100.0f` (constrained 0.0-10.0)

        weightXYGPSP:
          type: uint16
          unit: Weight * 100
          description: Sets `positionEstimationConfigMutable()->w_xy_gps_p = value / 100.0f` (constrained 0.0-10.0)

        weightXYGPSV:
          type: uint16
          unit: Weight * 100
          description: Sets `positionEstimationConfigMutable()->w_xy_gps_v = value / 100.0f` (constrained 0.0-10.0)

        minSats:
          type: uint8
          unit: Count
          description: Sets `gpsConfigMutable()->gpsMinSats` (constrained 5-10)

        useGPSVelNED:
          type: uint8
          unit: Boolean
          description: Legacy flag, ignored
    reply: null

  MSP_WP_MISSION_LOAD:
    id: 18
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Commands the FC to load the waypoint mission stored in non-volatile memory (e.g., EEPROM or FlashFS) into the active mission buffer.
    notes: Only functional if `NAV_NON_VOLATILE_WAYPOINT_STORAGE` is defined. Requires 1 byte payload. Returns error if loading fails.
    request:
      fields:
        missionID:
          type: uint8
          description: Reserved for future use, currently ignored
    reply: null

  MSP_WP_MISSION_SAVE:
    id: 19
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Commands the FC to save the currently active waypoint mission from RAM to non-volatile memory (e.g., EEPROM or FlashFS).
    notes: Only functional if `NAV_NON_VOLATILE_WAYPOINT_STORAGE` is defined. Requires 1 byte payload. Returns error if saving fails.
    request:
      fields:
        missionID:
          type: uint8
          description: Reserved for future use, currently ignored
    reply: null

  MSP_WP_GETINFO:
    id: 20
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves information about the waypoint mission capabilities and the status of the currently loaded mission.
    request: null
    reply:
      fields:
        wpCapabilities:
          type: uint8
          description: Reserved for future waypoint capabilities flags. Currently always 0
          value: 0

        maxWaypoints:
          type: uint8
          description: Maximum number of waypoints supported (`NAV_MAX_WAYPOINTS`)

        missionValid:
          type: uint8
          description: Boolean flag indicating if the current mission in RAM is valid (`isWaypointListValid()`)

        waypointCount:
          type: uint8
          description: Number of waypoints currently defined in the mission (`getWaypointCount()`)

  MSP_RTH_AND_LAND_CONFIG:
    id: 21
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves configuration parameters related to Return-to-Home (RTH) and automatic landing behaviors.
    request: null
    reply:
      fields:
        minRthDistance:
          type: uint16
          unit: cm
          description: Minimum distance from home required for RTH to engage (`navConfig()->general.min_rth_distance`)

        rthClimbFirst:
          type: uint8
          unit: Boolean
          description: 'Flag: Climb to RTH altitude before returning (`navConfig()->general.flags.rth_climb_first`)'

        rthClimbIgnoreEmerg:
          type: uint8
          unit: Boolean
          description: 'Flag: Climb even in emergency RTH (`navConfig()->general.flags.rth_climb_ignore_emerg`)'

        rthTailFirst:
          type: uint8
          unit: Boolean
          description: 'Flag: Return tail-first during RTH (`navConfig()->general.flags.rth_tail_first`)'

        rthAllowLanding:
          type: uint8
          unit: Boolean
          description: 'Flag: Allow automatic landing after RTH (`navConfig()->general.flags.rth_allow_landing`)'

        rthAltControlMode:
          type: uint8
          enum: nav_rth_alt_profile_e
          description: 'RTH altitude control mode (`navConfig()->general.flags.rth_alt_control_mode`). WARNING: uses unnamed enum in navigation.h:253 ''NAV_RTH_NO_ALT...'''

        rthAbortThreshold:
          type: uint16
          unit: cm
          description: Distance increase threshold to abort RTH (`navConfig()->general.rth_abort_threshold`)

        rthAltitude:
          type: uint16
          unit: cm
          description: Target RTH altitude (`navConfig()->general.rth_altitude`)

        landMinAltVspd:
          type: uint16
          unit: cm/s
          description: Landing vertical speed at minimum slowdown altitude (`navConfig()->general.land_minalt_vspd`)

        landMaxAltVspd:
          type: uint16
          unit: cm/s
          description: Landing vertical speed at maximum slowdown altitude (`navConfig()->general.land_maxalt_vspd`)

        landSlowdownMinAlt:
          type: uint16
          unit: cm
          description: Altitude below which `landMinAltVspd` applies (`navConfig()->general.land_slowdown_minalt`)

        landSlowdownMaxAlt:
          type: uint16
          unit: cm
          description: Altitude above which `landMaxAltVspd` applies (`navConfig()->general.land_slowdown_maxalt`)

        emergDescentRate:
          type: uint16
          unit: cm/s
          description: Vertical speed during emergency landing descent (`navConfig()->general.emerg_descent_rate`)

  MSP_SET_RTH_AND_LAND_CONFIG:
    id: 22
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets configuration parameters related to Return-to-Home (RTH) and automatic landing behaviors.
    notes: Expects 21 bytes.
    request:
      fields:
        minRthDistance:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->general.min_rth_distance`.

        rthClimbFirst:
          type: uint8
          unit: Boolean
          description: Sets `navConfigMutable()->general.flags.rth_climb_first`.

        rthClimbIgnoreEmerg:
          type: uint8
          unit: Boolean
          description: Sets `navConfigMutable()->general.flags.rth_climb_ignore_emerg`.

        rthTailFirst:
          type: uint8
          unit: Boolean
          description: Sets `navConfigMutable()->general.flags.rth_tail_first`.

        rthAllowLanding:
          type: uint8
          unit: Boolean
          description: Sets `navConfigMutable()->general.flags.rth_allow_landing`.

        rthAltControlMode:
          type: uint8
          enum: nav_rth_alt_profile_e
          description: 'Sets `navConfigMutable()->general.flags.rth_alt_control_mode`. WARNING: uses unnamed enum in navigation.h:253'

        rthAbortThreshold:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->general.rth_abort_threshold`.

        rthAltitude:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->general.rth_altitude`.

        landMinAltVspd:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->general.land_minalt_vspd`.

        landMaxAltVspd:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->general.land_maxalt_vspd`.

        landSlowdownMinAlt:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->general.land_slowdown_minalt`.

        landSlowdownMaxAlt:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->general.land_slowdown_maxalt`.

        emergDescentRate:
          type: uint16
          unit: cm/s
          description: Sets `navConfigMutable()->general.emerg_descent_rate`.
    reply: null

  MSP_FW_CONFIG:
    id: 23
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves configuration parameters specific to Fixed Wing navigation.
    request: null
    reply:
      fields:
        cruiseThrottle:
          type: uint16
          unit: PWM
          description: Cruise throttle command (`currentBatteryProfile->nav.fw.cruise_throttle`).

        minThrottle:
          type: uint16
          unit: PWM
          description: Minimum throttle during autonomous flight (`currentBatteryProfile->nav.fw.min_throttle`).

        maxThrottle:
          type: uint16
          unit: PWM
          description: Maximum throttle during autonomous flight (`currentBatteryProfile->nav.fw.max_throttle`).

        maxBankAngle:
          type: uint8
          unit: degrees
          description: Maximum bank angle allowed (`navConfig()->fw.max_bank_angle`)

        maxClimbAngle:
          type: uint8
          unit: degrees
          description: Maximum pitch angle during climb (`navConfig()->fw.max_climb_angle`)

        maxDiveAngle:
          type: uint8
          unit: degrees
          description: Maximum negative pitch angle during descent (`navConfig()->fw.max_dive_angle`)

        pitchToThrottle:
          type: uint8
          unit: us/deg
          description: "Pitch-to-throttle gain (`currentBatteryProfile->nav.fw.pitch_to_throttle`); PWM microseconds per degree (10 units \u2248 1% throttle)."

        loiterRadius:
          type: uint16
          unit: cm
          description: Default loiter radius (`navConfig()->fw.loiter_radius`).

  MSP_SET_FW_CONFIG:
    id: 24
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets configuration parameters specific to Fixed Wing navigation.
    notes: Expects 12 bytes.
    request:
      fields:
        cruiseThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->nav.fw.cruise_throttle`.

        minThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->nav.fw.min_throttle`.

        maxThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->nav.fw.max_throttle`.

        maxBankAngle:
          type: uint8
          unit: degrees
          description: Sets `navConfigMutable()->fw.max_bank_angle`.

        maxClimbAngle:
          type: uint8
          unit: degrees
          description: Sets `navConfigMutable()->fw.max_climb_angle`.

        maxDiveAngle:
          type: uint8
          unit: degrees
          description: Sets `navConfigMutable()->fw.max_dive_angle`.

        pitchToThrottle:
          type: uint8
          unit: us/deg
          description: "Sets `currentBatteryProfileMutable->nav.fw.pitch_to_throttle` (PWM microseconds per degree; 10 units \u2248 1% throttle)."

        loiterRadius:
          type: uint16
          unit: cm
          description: Sets `navConfigMutable()->fw.loiter_radius`.
    reply: null

  MSP_MODE_RANGES:
    id: 34
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Returns all defined mode activation ranges (aux channel assignments for flight modes).
    notes: The number of steps and mapping to PWM values depends on internal range calculations.
    request: null
    reply:
      repeat: MAX_MODE_ACTIVATION_CONDITION_COUNT
      fields:
        modePermanentId:
          type: uint8
          unit: ID
          description: Permanent ID of the flight mode (maps to `boxId` via `findBoxByActiveBoxId`). 0 if entry unused

        auxChannelIndex:
          type: uint8
          unit: Index
          description: 0-based index of the AUX channel used for activation

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.

  MSP_SET_MODE_RANGE:
    id: 35
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets a single mode activation range by its index.
    notes: Expects 5 bytes. Updates the mode configuration and recalculates used mode flags. Returns error if `rangeIndex` or `modePermanentId` is invalid.
    request:
      fields:
        rangeIndex:
          type: uint8
          unit: Index
          description: Index of the mode range to set (0 to `MAX_MODE_ACTIVATION_CONDITION_COUNT - 1`)

        modePermanentId:
          type: uint8
          unit: ID
          description: Permanent ID of the flight mode to assign

        auxChannelIndex:
          type: uint8
          unit: Index
          description: 0-based index of the AUX channel

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.
    reply: null

  MSP_FEATURE:
    id: 36
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Returns a bitmask of enabled features.
    notes: Feature bits are defined in `feature.h`.
    request: null
    reply:
      fields:
        featureMask:
          type: uint32
          enum: features_e
          bitmask: true
          description: 'Bitmask: active features (see `featureMask()`)'

  MSP_SET_FEATURE:
    id: 37
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the enabled features using a bitmask. Clears all previous features first.
    notes: Expects 4 bytes. Updates feature configuration and related settings (e.g., RSSI source).
    request:
      fields:
        featureMask:
          type: uint32
          enum: features_e
          bitmask: true
          description: 'Bitmask: features to enable'
    reply: null

  MSP_BOARD_ALIGNMENT:
    id: 38
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Returns the sensor board alignment angles relative to the craft frame.
    notes: "Ranges are typically -1800 to +1800 (i.e. -180.0\xB0 to +180.0\xB0)."
    request: null
    reply:
      fields:
        rollAlign:
          type: int16
          unit: deci-degrees
          description: Board alignment roll angle (`boardAlignment()->rollDeciDegrees`). Negative values tilt left.

        pitchAlign:
          type: int16
          unit: deci-degrees
          description: Board alignment pitch angle (`boardAlignment()->pitchDeciDegrees`). Negative values nose down.

        yawAlign:
          type: int16
          unit: deci-degrees
          description: Board alignment yaw angle (`boardAlignment()->yawDeciDegrees`). Negative values rotate counter-clockwise.

  MSP_SET_BOARD_ALIGNMENT:
    id: 39
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the sensor board alignment angles.
    notes: Expects 6 bytes encoded as little-endian signed deci-degrees (-1800 to +1800 typical).
    request:
      fields:
        rollAlign:
          type: int16
          unit: deci-degrees
          description: Sets `boardAlignmentMutable()->rollDeciDegrees`.

        pitchAlign:
          type: int16
          unit: deci-degrees
          description: Sets `boardAlignmentMutable()->pitchDeciDegrees`.

        yawAlign:
          type: int16
          unit: deci-degrees
          description: Sets `boardAlignmentMutable()->yawDeciDegrees`.
    reply: null

  MSP_CURRENT_METER_CONFIG:
    id: 40
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the configuration for the current sensor.
    notes: Scale and offset are signed values matching `batteryMetersConfig()->current` fields.
    request: null
    reply:
      fields:
        scale:
          type: int16
          unit: 0.1 mV/A
          description: Current sensor scale factor (`batteryMetersConfig()->current.scale`). Stored in 0.1 mV/A; signed for calibration.

        offset:
          type: int16
          unit: mV
          description: Current sensor offset (`batteryMetersConfig()->current.offset`). Signed millivolt adjustment.

        type:
          type: uint8
          enum: currentSensor_e
          description: Enum `currentSensor_e` Type of current sensor hardware

        capacity:
          type: uint16
          unit: mAh (legacy)
          description: 'Battery capacity (constrained 0-65535) (`currentBatteryProfile->capacity.value`). Note: This is legacy, use `MSP2_INAV_BATTERY_CONFIG` for full 32-bit capacity'

  MSP_SET_CURRENT_METER_CONFIG:
    id: 41
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the configuration for the current sensor.
    notes: Expects 7 bytes. Signed values use little-endian two's complement.
    request:
      fields:
        scale:
          type: int16
          unit: 0.1 mV/A
          description: Sets `batteryMetersConfigMutable()->current.scale` (0.1 mV/A, signed).

        offset:
          type: int16
          unit: mV
          description: Sets `batteryMetersConfigMutable()->current.offset` (signed millivolts).

        type:
          type: uint8
          enum: currentSensor_e
          description: Enum `currentSensor_e` Sets `batteryMetersConfigMutable()->current.type`.

        capacity:
          type: uint16
          unit: mAh (legacy)
          description: Sets `currentBatteryProfileMutable->capacity.value` (truncated to 16 bits)
    reply: null

  MSP_MIXER:
    id: 42
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the mixer type (Legacy, INAV always returns QuadX).
    notes: This command is largely obsolete. Mixer configuration is handled differently in INAV (presets, custom mixes). See `MSP2_INAV_MIXER`.
    request: null
    reply:
      fields:
        mixerMode:
          type: uint8
          description: Always 3 (QuadX) in INAV for compatibility
          value: 3

  MSP_SET_MIXER:
    id: 43
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the mixer type (Legacy, ignored by INAV).
    notes: Expects 1 byte. Calls `mixerUpdateStateFlags()` for potential side effects related to presets.
    request:
      fields:
        mixerMode:
          type: uint8
          description: Mixer mode to set (ignored by INAV)
    reply: null

  MSP_RX_CONFIG:
    id: 44
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves receiver configuration settings. Some fields are Betaflight compatibility placeholders.
    request: null
    reply:
      fields:
        serialRxProvider:
          type: uint8
          enum: rxSerialReceiverType_e
          description: Enum `rxSerialReceiverType_e`. Serial RX provider (`rxConfig()->serialrx_provider`).

        maxCheck:
          type: uint16
          unit: PWM
          description: Upper channel value threshold for stick commands (`rxConfig()->maxcheck`)

        midRc:
          type: uint16
          unit: PWM
          description: Center channel value (`PWM_RANGE_MIDDLE`, typically 1500)

        minCheck:
          type: uint16
          unit: PWM
          description: Lower channel value threshold for stick commands (`rxConfig()->mincheck`)

        spektrumSatBind:
          type: uint8
          unit: Count/Flag
          description: Spektrum bind pulses (`rxConfig()->spektrum_sat_bind`). 0 if `USE_SPEKTRUM_BIND` disabled.

        rxMinUsec:
          type: uint16
          unit: PWM
          description: Minimum expected pulse width (`rxConfig()->rx_min_usec`)

        rxMaxUsec:
          type: uint16
          unit: PWM
          description: Maximum expected pulse width (`rxConfig()->rx_max_usec`)

        bfCompatRcInterpolation:
          type: uint8
          description: BF compatibility. Always 0
          value: 0

        bfCompatRcInterpolationInt:
          type: uint8
          description: BF compatibility. Always 0
          value: 0

        bfCompatAirModeThreshold:
          type: uint16
          description: BF compatibility. Always 0
          value: 0

        reserved1:
          type: uint8
          description: Reserved/Padding. Always 0
          value: 0

        reserved2:
          type: uint32
          description: Reserved/Padding. Always 0
          value: 0

        reserved3:
          type: uint8
          description: Reserved/Padding. Always 0
          value: 0

        bfCompatFpvCamAngle:
          type: uint8
          description: BF compatibility. Always 0
          value: 0

        receiverType:
          type: uint8
          enum: rxReceiverType_e
          description: Enum `rxReceiverType_e` Receiver type (Parallel PWM, PPM, Serial) ('rxConfig()->receiverType')

  MSP_SET_RX_CONFIG:
    id: 45
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets receiver configuration settings.
    notes: Expects 24 bytes.
    request:
      fields:
        serialRxProvider:
          type: uint8
          enum: rxSerialReceiverType_e
          description: Enum `rxSerialReceiverType_e`. Sets `rxConfigMutable()->serialrx_provider`.

        maxCheck:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->maxcheck`.

        midRc:
          type: uint16
          unit: PWM
          description: Ignored (`PWM_RANGE_MIDDLE` is used)

        minCheck:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->mincheck`.

        spektrumSatBind:
          type: uint8
          unit: Count/Flag
          description: Sets `rxConfigMutable()->spektrum_sat_bind` (if `USE_SPEKTRUM_BIND`).

        rxMinUsec:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->rx_min_usec`.

        rxMaxUsec:
          type: uint16
          unit: PWM
          description: Sets `rxConfigMutable()->rx_max_usec`.

        bfCompatRcInterpolation:
          type: uint8
          description: Ignored

        bfCompatRcInterpolationInt:
          type: uint8
          description: Ignored

        bfCompatAirModeThreshold:
          type: uint16
          description: Ignored

        reserved1:
          type: uint8
          description: Ignored

        reserved2:
          type: uint32
          description: Ignored

        reserved3:
          type: uint8
          description: Ignored

        bfCompatFpvCamAngle:
          type: uint8
          description: Ignored

        receiverType:
          type: uint8
          enum: rxReceiverType_e
          description: Enum `rxReceiverType_e` Sets `rxConfigMutable()->receiverType`.
    reply: null

  MSP_LED_COLORS:
    id: 46
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the HSV color definitions for configurable LED colors.
    notes: Only available if `USE_LED_STRIP` is defined.
    request: null
    reply:
      repeat: LED_CONFIGURABLE_COLOR_COUNT
      fields:
        hue:
          type: uint16
          description: Hue value (0-359)

        saturation:
          type: uint8
          description: Saturation value (0-255)

        value:
          type: uint8
          description: Value/Brightness (0-255)

  MSP_SET_LED_COLORS:
    id: 47
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the HSV color definitions for configurable LED colors.
    notes: Only available if `USE_LED_STRIP` is defined. Expects `LED_CONFIGURABLE_COLOR_COUNT * 4` bytes.
    request:
      repeat: LED_CONFIGURABLE_COLOR_COUNT
      fields:
        hue:
          type: uint16
          description: Hue value (0-359)

        saturation:
          type: uint8
          description: Saturation value (0-255)

        value:
          type: uint8
          description: Value/Brightness (0-255)
    reply: null

  MSP_LED_STRIP_CONFIG:
    id: 48
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the configuration for each LED on the strip (legacy packed format).
    notes: Only available if `USE_LED_STRIP` is defined. Superseded by `MSP2_INAV_LED_STRIP_CONFIG_EX` which uses a clearer struct.
    variable_len: LED_MAX_STRIP_LENGTH
    request: null
    reply:
      repeat: LED_MAX_STRIP_LENGTH
      fields:
        legacyLedConfig:
          type: uint32
          description: Packed LED configuration (position, function, overlay, color, direction, params). See C code for bit packing details

  MSP_SET_LED_STRIP_CONFIG:
    id: 49
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the configuration for a single LED on the strip using the legacy packed format.
    notes: Only available if `USE_LED_STRIP` is defined. Expects 5 bytes. Calls `reevaluateLedConfig()`. Superseded by `MSP2_INAV_SET_LED_STRIP_CONFIG_EX`.
    request:
      fields:
        ledIndex:
          type: uint8
          description: Index of the LED to configure (0 to `LED_MAX_STRIP_LENGTH - 1`)

        legacyLedConfig:
          type: uint32
          description: Packed LED configuration to set
    reply: null

  MSP_RSSI_CONFIG:
    id: 50
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the channel used for analog RSSI input.
    request: null
    reply:
      fields:
        rssiChannel:
          type: uint8
          description: AUX channel index (1-based) used for RSSI, or 0 if disabled (`rxConfig()->rssi_channel`)

  MSP_SET_RSSI_CONFIG:
    id: 51
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the channel used for analog RSSI input.
    notes: Expects 1 byte. Input value is constrained 0 to `MAX_SUPPORTED_RC_CHANNEL_COUNT`. Updates the effective RSSI source.
    request:
      fields:
        rssiChannel:
          type: uint8
          description: AUX channel index (1-based) to use for RSSI, or 0 to disable
    reply: null

  MSP_ADJUSTMENT_RANGES:
    id: 52
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Returns all defined RC adjustment ranges (tuning via aux channels).
    notes: See `adjustmentRange_t`.
    request: null
    reply:
      repeat: MAX_ADJUSTMENT_RANGE_COUNT
      fields:
        adjustmentIndex:
          type: uint8
          description: Index of the adjustment slot (0 to `MAX_SIMULTANEOUS_ADJUSTMENT_COUNT - 1`)

        auxChannelIndex:
          type: uint8
          description: 0-based index of the AUX channel controlling the adjustment value

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.

        adjustmentFunction:
          type: uint8
          enum: adjustmentFunction_e
          description: Function/parameter being adjusted (see `adjustmentFunction_e`).

        auxSwitchChannelIndex:
          type: uint8
          description: 0-based index of the AUX channel acting as an enable switch (or 0 if always enabled)

  MSP_SET_ADJUSTMENT_RANGE:
    id: 53
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets a single RC adjustment range configuration by its index.
    notes: Expects 7 bytes. Returns error if `rangeIndex` or `adjustmentIndex` is invalid.
    request:
      fields:
        rangeIndex:
          type: uint8
          description: Index of the adjustment range to set (0 to `MAX_ADJUSTMENT_RANGE_COUNT - 1`)

        adjustmentIndex:
          type: uint8
          description: Adjustment slot index (0 to `MAX_SIMULTANEOUS_ADJUSTMENT_COUNT - 1`)

        auxChannelIndex:
          type: uint8
          description: 0-based index of the control AUX channel

        rangeStartStep:
          type: uint8
          unit: step
          description: Start step (0-48). Each step is 25 PWM units; 0 is <=900 and 48 is >=2100.

        rangeEndStep:
          type: uint8
          unit: step
          description: End step (0-48). Uses the same 25-PWM step mapping as rangeStartStep.

        adjustmentFunction:
          type: uint8
          enum: adjustmentFunction_e
          description: Function/parameter being adjusted.

        auxSwitchChannelIndex:
          type: uint8
          description: 0-based index of the enable switch AUX channel (or 0)
    reply: null

  MSP_CF_SERIAL_CONFIG:
    id: 54
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Deprecated command to get serial port configuration.
    notes: Not implemented in INAV `fc_msp.c`. Use `MSP2_COMMON_SERIAL_CONFIG`.
    not_implemented: true

  MSP_SET_CF_SERIAL_CONFIG:
    id: 55
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Deprecated command to set serial port configuration.
    notes: Not implemented in INAV `fc_msp.c`. Use `MSP2_COMMON_SET_SERIAL_CONFIG`.
    not_implemented: true

  MSP_VOLTAGE_METER_CONFIG:
    id: 56
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves legacy voltage meter configuration (scaled values).
    notes: Superseded by `MSP2_INAV_BATTERY_CONFIG`.
    request: null
    reply:
      fields:
        vbatScale:
          type: uint8
          unit: Scale / 10
          description: Voltage sensor scale factor / 10 (`batteryMetersConfig()->voltage.scale / 10`). 0 if `USE_ADC` disabled

        vbatMinCell:
          type: uint8
          unit: 0.1V
          description: Minimum cell voltage / 10 (`currentBatteryProfile->voltage.cellMin / 10`). 0 if `USE_ADC` disabled

        vbatMaxCell:
          type: uint8
          unit: 0.1V
          description: Maximum cell voltage / 10 (`currentBatteryProfile->voltage.cellMax / 10`). 0 if `USE_ADC` disabled

        vbatWarningCell:
          type: uint8
          unit: 0.1V
          description: Warning cell voltage / 10 (`currentBatteryProfile->voltage.cellWarning / 10`). 0 if `USE_ADC` disabled

  MSP_SET_VOLTAGE_METER_CONFIG:
    id: 57
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets legacy voltage meter configuration (scaled values).
    notes: Expects 4 bytes. Superseded by `MSP2_INAV_SET_BATTERY_CONFIG`.
    request:
      fields:
        vbatScale:
          type: uint8
          unit: Scale / 10
          description: Sets `batteryMetersConfigMutable()->voltage.scale = value * 10` (if `USE_ADC`)

        vbatMinCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellMin = value * 10` (if `USE_ADC`)

        vbatMaxCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellMax = value * 10` (if `USE_ADC`)

        vbatWarningCell:
          type: uint8
          unit: 0.1V
          description: Sets `currentBatteryProfileMutable->voltage.cellWarning = value * 10` (if `USE_ADC`)
    reply: null

  MSP_SONAR_ALTITUDE:
    id: 58
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the altitude measured by the primary rangefinder (sonar or lidar).
    request: null
    reply:
      fields:
        rangefinderAltitude:
          type: int32
          unit: cm
          description: Latest altitude reading from the rangefinder (`rangefinderGetLatestAltitude()`). 0 if `USE_RANGEFINDER` disabled or no reading.

  MSP_RX_MAP:
    id: 64
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the RC channel mapping array (AETR, etc.).
    notes: '`MAX_MAPPABLE_RX_INPUTS` is currently 4 (Roll, Pitch, Yaw, Throttle).'
    request: null
    reply:
      fields:
        rcMap:
          type: uint8[MAX_MAPPABLE_RX_INPUTS]
          description: Array defining the mapping from input channel index to logical function (Roll, Pitch, Yaw, Throttle, Aux1...)

  MSP_SET_RX_MAP:
    id: 65
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the RC channel mapping array.
    notes: Expects `MAX_MAPPABLE_RX_INPUTS` bytes (currently 4).
    request:
      fields:
        rcMap:
          type: uint8[MAX_MAPPABLE_RX_INPUTS]
          description: Array defining the new channel mapping
    reply: null

  MSP_REBOOT:
    id: 68
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Commands the flight controller to reboot.
    notes: The FC sends an ACK *before* rebooting. The `mspPostProcessFn` is set to `mspRebootFn` to perform the reboot after the reply is sent. Will fail if the craft is armed.
    request: null
    reply: null

  MSP_DATAFLASH_SUMMARY:
    id: 70
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves summary information about the onboard dataflash chip (if present and used for Blackbox via FlashFS).
    notes: Requires `USE_FLASHFS`.
    request: null
    reply:
      fields:
        flashReady:
          type: uint8
          description: 'Boolean: 1 if flash chip is ready, 0 otherwise. (`flashIsReady()`). 0 if `USE_FLASHFS` disabled'

        sectorCount:
          type: uint32
          description: Total number of sectors on the flash chip (`geometry->sectors`). 0 if `USE_FLASHFS` disabled

        totalSize:
          type: uint32
          description: Total size of the flash chip in bytes (`geometry->totalSize`). 0 if `USE_FLASHFS` disabled

        usedSize:
          type: uint32
          description: Currently used size in bytes (FlashFS offset) (`flashfsGetOffset()`). 0 if `USE_FLASHFS` disabled

  MSP_DATAFLASH_READ:
    id: 71
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Reads a block of data from the onboard dataflash (FlashFS).
    notes: Requires `USE_FLASHFS`. Read length may be truncated by buffer size or end of flashfs volume.
    variable_len: true
    request:
      fields:
        address:
          type: uint32
          description: Starting address to read from within the FlashFS volume

        size:
          type: optional uint16
          description: (Optional) Number of bytes to read. Defaults to 128 if not provided
    reply:
      fields:

        address:
          type: uint32
          description: The starting address from which data was actually read

        data:
          type: uint8[]
          description: The data read from flash. Length is MIN(requested size, remaining buffer space, remaining flashfs data)

  MSP_DATAFLASH_ERASE:
    id: 72
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Erases the entire onboard dataflash chip (FlashFS volume).
    notes: Requires `USE_FLASHFS`. This is a potentially long operation. Use with caution.
    request: null
    reply: null

  MSP_LOOP_TIME:
    id: 73
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the configured loop time (PID loop frequency denominator).
    notes: This is the *configured* target loop time, not necessarily the *actual* measured cycle time (see `MSP_STATUS`).
    request: null
    reply:
      fields:
        looptime:
          type: uint16
          unit: PWM
          description: Configured loop time (`gyroConfig()->looptime`)

  MSP_SET_LOOP_TIME:
    id: 74
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the configured loop time.
    notes: Expects 2 bytes.
    request:
      fields:
        looptime:
          type: uint16
          unit: PWM
          description: New loop time to set (`gyroConfigMutable()->looptime`)
    reply: null

  MSP_FAILSAFE_CONFIG:
    id: 75
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the failsafe configuration settings.
    request: null
    reply:
      fields:
        failsafeDelay:
          type: uint8
          unit: 0.1s
          description: Delay before failsafe stage 1 activates (`failsafeConfig()->failsafe_delay`)

        failsafeOffDelay:
          type: uint8
          unit: 0.1s
          description: Delay after signal recovery before returning control (`failsafeConfig()->failsafe_off_delay`)

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Throttle level during failsafe stage 2 (`currentBatteryProfile->failsafe_throttle`)

        legacyKillSwitch:
          type: uint8
          description: Legacy flag, always 0
          value: 0

        failsafeThrottleLowDelay:
          type: uint16
          unit: 0.1s
          description: Delay for throttle-based failsafe detection (`failsafeConfig()->failsafe_throttle_low_delay`). Units of 0.1 seconds.

        failsafeProcedure:
          type: uint8
          enum: failsafeProcedure_e
          description: Enum `failsafeProcedure_e` Failsafe procedure (Drop, RTH, Land, etc.) ('failsafeConfig()->failsafe_procedure')

        failsafeRecoveryDelay:
          type: uint8
          unit: 0.1s
          description: Delay after RTH finishes before attempting recovery (`failsafeConfig()->failsafe_recovery_delay`)

        failsafeFWRollAngle:
          type: int16
          unit: deci-degrees
          description: Fixed-wing failsafe roll angle (`failsafeConfig()->failsafe_fw_roll_angle`). Signed deci-degrees.

        failsafeFWPitchAngle:
          type: int16
          unit: deci-degrees
          description: Fixed-wing failsafe pitch angle (`failsafeConfig()->failsafe_fw_pitch_angle`). Signed deci-degrees.

        failsafeFWYawRate:
          type: int16
          unit: deg/s
          description: Fixed-wing failsafe yaw rate (`failsafeConfig()->failsafe_fw_yaw_rate`). Signed degrees per second.

        failsafeStickThreshold:
          type: uint16
          unit: PWM units
          description: Stick movement threshold to exit failsafe (`failsafeConfig()->failsafe_stick_motion_threshold`)

        failsafeMinDistance:
          type: uint16
          unit: cm
          description: Minimum distance from home for RTH failsafe (`failsafeConfig()->failsafe_min_distance`). Units of centimeters.

        failsafeMinDistanceProc:
          type: uint8
          enum: failsafeProcedure_e
          description: Enum `failsafeProcedure_e` Failsafe procedure if below min distance ('failsafeConfig()->failsafe_min_distance_procedure')

  MSP_SET_FAILSAFE_CONFIG:
    id: 76
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets the failsafe configuration settings.
    notes: Expects 20 bytes.
    request:
      fields:
        failsafeDelay:
          type: uint8
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_delay`.

        failsafeOffDelay:
          type: uint8
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_off_delay`.

        failsafeThrottle:
          type: uint16
          unit: PWM
          description: Sets `currentBatteryProfileMutable->failsafe_throttle`.

        legacyKillSwitch:
          type: uint8
          description: Ignored

        failsafeThrottleLowDelay:
          type: uint16
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_throttle_low_delay`. Units of 0.1 seconds.

        failsafeProcedure:
          type: uint8
          enum: failsafeProcedure_e
          description: Enum `failsafeProcedure_e`. Sets `failsafeConfigMutable()->failsafe_procedure`.

        failsafeRecoveryDelay:
          type: uint8
          unit: 0.1s
          description: Sets `failsafeConfigMutable()->failsafe_recovery_delay`.

        failsafeFWRollAngle:
          type: int16
          unit: deci-degrees
          description: Sets `failsafeConfigMutable()->failsafe_fw_roll_angle`. Signed deci-degrees.

        failsafeFWPitchAngle:
          type: int16
          unit: deci-degrees
          description: Sets `failsafeConfigMutable()->failsafe_fw_pitch_angle`. Signed deci-degrees.

        failsafeFWYawRate:
          type: int16
          unit: deg/s
          description: Sets `failsafeConfigMutable()->failsafe_fw_yaw_rate`. Signed degrees per second.

        failsafeStickThreshold:
          type: uint16
          unit: PWM units
          description: Sets `failsafeConfigMutable()->failsafe_stick_motion_threshold`.

        failsafeMinDistance:
          type: uint16
          unit: cm
          description: Sets `failsafeConfigMutable()->failsafe_min_distance`. Units of centimeters.

        failsafeMinDistanceProc:
          type: uint8
          enum: failsafeProcedure_e
          description: Enum `failsafeProcedure_e`. Sets `failsafeConfigMutable()->failsafe_min_distance_procedure`.
    reply: null

  MSP_SDCARD_SUMMARY:
    id: 79
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves summary information about the SD card status and filesystem.
    notes: Requires `USE_SDCARD` and `USE_ASYNCFATFS`.
    request: null
    reply:
      fields:
        sdCardSupported:
          type: uint8
          bitmask: true
          description: 'Bitmask: Bit 0 = 1 if SD card support compiled in (`USE_SDCARD`)'

        sdCardState:
          type: uint8
          enum: mspSDCardState_e
          description: 'Enum (`mspSDCardState_e`): Current state (Not Present, Fatal, Card Init, FS Init, Ready). 0 if `USE_SDCARD` disabled'

        fsError:
          type: uint8
          description: Last filesystem error code (`afatfs_getLastError()`). 0 if `USE_SDCARD` disabled

        freeSpaceKB:
          type: uint32
          description: Free space in KiB (`afatfs_getContiguousFreeSpace() / 1024`). 0 if `USE_SDCARD` disabled

        totalSpaceKB:
          type: uint32
          description: Total space in KiB (`sdcard_getMetadata()->numBlocks / 2`). 0 if `USE_SDCARD` disabled

  MSP_BLACKBOX_CONFIG:
    id: 80
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Legacy command to retrieve Blackbox configuration. Superseded by `MSP2_BLACKBOX_CONFIG`.
    notes: Returns fixed zero values. Use `MSP2_BLACKBOX_CONFIG`.
    replaced_by:
      - MSP2_BLACKBOX_CONFIG
    request: null
    reply:
      fields:
        blackboxDevice:
          type: uint8
          description: Always 0 (API no longer supported)
          value: 0

        blackboxRateNum:
          type: uint8
          description: Always 0
          value: 0

        blackboxRateDenom:
          type: uint8
          description: Always 0
          value: 0

        blackboxPDenom:
          type: uint8
          description: Always 0
          value: 0

  MSP_SET_BLACKBOX_CONFIG:
    id: 81
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Legacy command to set Blackbox configuration. Superseded by `MSP2_SET_BLACKBOX_CONFIG`.
    notes: Not implemented in `fc_msp.c`. Use `MSP2_SET_BLACKBOX_CONFIG`.
    replaced_by:
      - MSP2_SET_BLACKBOX_CONFIG
    not_implemented: true

  MSP_TRANSPONDER_CONFIG:
    id: 82
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Get VTX Transponder settings (likely specific to RaceFlight/Betaflight, not standard INAV VTX).
    notes: Not implemented in INAV `fc_msp.c`.
    not_implemented: true

  MSP_SET_TRANSPONDER_CONFIG:
    id: 83
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Set VTX Transponder settings.
    notes: Not implemented in INAV `fc_msp.c`.
    not_implemented: true

  MSP_OSD_CONFIG:
    id: 84
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves OSD configuration settings and layout for screen 0. Coordinates are packed as `(Y << 8) | X`. When `USE_OSD` is not compiled in, only `osdDriverType` = `OSD_DRIVER_NONE` is returned.
    notes: 1 byte if `USE_OSD` disabled; full payload (1 + fields + 2*OSD_ITEM_COUNT bytes) otherwise.
    variable_len: true
    replaced_by:
      - MSP2_INAV_OSD_LAYOUTS
      - MSP2_INAV_OSD_ALARMS
      - MSP2_INAV_OSD_PREFERENCES
    request: null
    reply:
      fields:
        osdDriverType:
          type: uint8
          enum: osdDriver_e
          description: 'Enum `osdDriver_e`: `OSD_DRIVER_MAX7456` if `USE_OSD`, else `OSD_DRIVER_NONE`.'

        videoSystem:
          type: optional uint8
          enum: videoSystem_e
          description: 'Enum `videoSystem_e`: Video system (Auto/PAL/NTSC) (`osdConfig()->video_system`). Absent when `USE_OSD` is not compiled in'

        units:
          type: optional uint8
          enum: osd_unit_e
          description: Enum `osd_unit_e` Measurement units (Metric/Imperial) (`osdConfig()->units`). Absent when `USE_OSD` is not compiled in

        rssiAlarm:
          type: optional uint8
          unit: '%'
          description: RSSI alarm threshold (`osdConfig()->rssi_alarm`). Absent when `USE_OSD` is not compiled in

        capAlarm:
          type: optional uint16
          unit: mAh/mWh
          description: Capacity alarm threshold (`currentBatteryProfile->capacity.warning`). Truncated to 16 bits. Absent when `USE_OSD` is not compiled in.

        timerAlarm:
          type: optional uint16
          unit: minutes
          description: Timer alarm threshold in minutes (`osdConfig()->time_alarm`). Absent when `USE_OSD` is not compiled in.

        altAlarm:
          type: optional uint16
          unit: meters
          description: Altitude alarm threshold (`osdConfig()->alt_alarm`). Absent when `USE_OSD` is not compiled in

        distAlarm:
          type: optional uint16
          unit: meters
          description: Distance alarm threshold (`osdConfig()->dist_alarm`). Absent when `USE_OSD` is not compiled in

        negAltAlarm:
          type: optional uint16
          unit: meters
          description: Negative altitude alarm threshold (`osdConfig()->neg_alt_alarm`). Absent when `USE_OSD` is not compiled in

        itemPositions:
          type: optional uint16[OSD_ITEM_COUNT]
          unit: packed
          description: Packed X/Y position for each OSD item on screen 0 (`osdLayoutsConfig()->item_pos[0][i]`). Absent when `USE_OSD` is not compiled in

  MSP_SET_OSD_CONFIG:
    id: 85
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets OSD configuration or a single item's position on screen 0.
    notes: Requires `USE_OSD`. Distinguishes formats based on the first byte. Format 1 requires at least 10 bytes. Format 2 requires 3 bytes. Triggers an OSD redraw. See `MSP2_INAV_OSD_SET_*` for more advanced control.
    replaced_by:
      - MSP2_INAV_OSD_SET_LAYOUT_ITEM
      - MSP2_INAV_OSD_SET_ALARMS
      - MSP2_INAV_OSD_SET_PREFERENCES
    variants:
      dataSize >= 10:
        description: dataSize >= 10
        request:
          fields:
            selector:
              type: uint8
              description: Must be 0xFF (-1) to indicate a configuration update.
              value: 255

            videoSystem:
              type: uint8
              enum: videoSystem_e
              description: 'Enum `videoSystem_e`: Video system (Auto/PAL/NTSC) (`osdConfig()->video_system`).'

            units:
              type: uint8
              enum: osd_unit_e
              description: Enum `osd_unit_e` Measurement units (Metric/Imperial) (`osdConfig()->units`).

            rssiAlarm:
              type: uint8
              unit: '%'
              description: RSSI alarm threshold (`osdConfig()->rssi_alarm`).

            capAlarm:
              type: uint16
              unit: mAh/mWh
              description: Capacity alarm threshold (`currentBatteryProfile->capacity.warning`). Truncated to 16 bits.

            timerAlarm:
              type: uint16
              unit: minutes
              description: Timer alarm threshold in minutes (`osdConfig()->time_alarm`).

            altAlarm:
              type: uint16
              unit: meters
              description: Altitude alarm threshold (`osdConfig()->alt_alarm`).

            distAlarm:
              type: optional uint16
              unit: meters
              description: Distance alarm threshold (`osdConfig()->dist_alarm`). Optional trailing field.

            negAltAlarm:
              type: optional uint16
              unit: meters
              description: Negative altitude alarm threshold (`osdConfig()->neg_alt_alarm`). Optional trailing field.
        reply: null
      dataSize == 3:
        description: Single item position update
        request:
          fields:

            itemIndex:
              type: uint8
              unit: Index
              description: Index of the OSD item to update (0 to `OSD_ITEM_COUNT - 1`).

            itemPosition:
              type: uint16
              unit: packed
              description: Packed X/Y position (`(Y << 8) | X`) for the specified item.
        reply: null

  MSP_OSD_CHAR_READ:
    id: 86
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Reads character data from the OSD font memory.
    notes: Not implemented in INAV `fc_msp.c`. Requires direct hardware access, typically done via DisplayPort.
    not_implemented: true

  MSP_OSD_CHAR_WRITE:
    id: 87
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Writes character data to the OSD font memory.
    notes: Requires `USE_OSD`. Minimum payload is `OSD_CHAR_VISIBLE_BYTES + 1` (8-bit address + 54 bytes). Payload size determines the address width and whether the extra metadata bytes are present. Writes characters via `displayWriteFontCharacter()`.
    variable_len: true
    variants:
      payloadSize >= OSD_CHAR_BYTES + 2 (>=66 bytes):
        description: 16-bit character index with full 64-byte payload (visible + metadata).
        request:
          fields:
            address:
              type: uint16
              description: Character slot index (0-1023).

            charData:
              type: uint8[OSD_CHAR_BYTES]
              description: All 64 bytes, including driver metadata.
        reply: null
      payloadSize == OSD_CHAR_BYTES + 1 (65 bytes):
        description: 8-bit character index with full 64-byte payload.
        request:
          fields:

            address:
              type: uint8
              description: Character slot index (0-255).

            charData:
              type: uint8[OSD_CHAR_BYTES]
              description: All 64 bytes, including driver metadata.
        reply: null
      payloadSize == OSD_CHAR_VISIBLE_BYTES + 2 (56 bytes):
        description: 16-bit character index with only the 54 visible bytes.
        request:
          fields:

            address:
              type: uint16
              description: Character slot index (0-1023).

            charData:
              type: uint8[OSD_CHAR_VISIBLE_BYTES]
              description: Visible pixel data only (no metadata).
        reply: null
      payloadSize == OSD_CHAR_VISIBLE_BYTES + 1 (55 bytes):
        description: 8-bit character index with only the 54 visible bytes.
        request:
          fields:

            address:
              type: uint8
              description: Character slot index (0-255).

            charData:
              type: uint8[OSD_CHAR_VISIBLE_BYTES]
              description: Visible pixel data only (no metadata).
        reply: null

  MSP_VTX_CONFIG:
    id: 88
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves the current VTX (Video Transmitter) configuration and capabilities.
    notes: Returns 1 byte (`VTXDEV_UNKNOWN`) when no VTX is detected or `USE_VTX_CONTROL` is disabled; otherwise sends full payload. BF compatibility field `frequency` (uint16) is missing compared to some BF versions. Use `MSP_VTXTABLE_BAND` and `MSP_VTXTABLE_POWERLEVEL` for details.
    variable_len: true
    request: null
    reply:
      fields:
        vtxDeviceType:
          type: uint8
          enum: vtxDevType_e
          description: 'Enum (`vtxDevType_e`): Type of VTX device detected/configured. `VTXDEV_UNKNOWN` if none'

        band:
          type: optional uint8
          description: VTX band number (from `vtxSettingsConfig`)

        channel:
          type: optional uint8
          description: VTX channel number (from `vtxSettingsConfig`)

        power:
          type: optional uint8
          description: VTX power level index (from `vtxSettingsConfig()`).

        pitMode:
          type: optional uint8
          description: 'Boolean: 1 if VTX is currently in pit mode, 0 otherwise.'

        vtxReady:
          type: optional uint8
          description: 'Boolean: 1 if VTX device reported ready, 0 otherwise'

        lowPowerDisarm:
          type: optional uint8
          enum: vtxLowerPowerDisarm_e
          description: 'Enum `vtxLowerPowerDisarm_e`: Low-power behaviour while disarmed (`vtxSettingsConfig()->lowPowerDisarm`).'

        vtxTableAvailable:
          type: optional uint8
          description: 'Boolean: 1 if VTX tables (band/power) are available for query'

        bandCount:
          type: optional uint8
          description: Number of bands supported by the VTX device

        channelCount:
          type: optional uint8
          description: Number of channels per band supported by the VTX device

        powerCount:
          type: optional uint8
          description: Number of power levels supported by the VTX device
        minPowerIndex:
          type: optional uint8
          description: Lowest selectable power index; 0 for `VTXDEV_MSP`, otherwise 1.

  MSP_SET_VTX_CONFIG:
    id: 89
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets VTX band/channel and related options. Fields are a progressive superset based on payload length.
    notes: Requires dataSize >= 2. If no VTX device or device type is VTXDEV_UNKNOWN, fields are read and discarded. The first uint16 is interpreted as band/channel when value <= VTXCOMMON_MSP_BANDCHAN_CHKVAL, otherwise treated as a frequency value that is not applied by this path. Subsequent fields are applied only if present. If dataSize < 2 the command returns MSP_RESULT_ERROR.
    variable_len: true
    variants:
      payloadSize >= 14:
        description: 'Full payload (Betaflight 1.42+): includes explicit band/channel/frequency and capability counts.'
        request:
          fields:
            bandChanOrFreq:
              type: uint16
              description: Encoded band/channel if <= `VTXCOMMON_MSP_BANDCHAN_CHKVAL`; otherwise frequency placeholder.

            power: uint8
            pitMode: uint8
            lowPowerDisarm:
              type: uint8
              enum: vtxLowerPowerDisarm_e
            pitModeFreq: uint16
            band: uint8
            channel: uint8
            frequency: uint16
            bandCount:
              type: uint8
              description: Read and ignored.

            channelCount:
              type: uint8
              description: Read and ignored.

            powerCount:
              type: uint8
              description: If 0 < value < current capability, caps `vtxDevice->capability.powerCount`.
        reply: null
      payloadSize >= 11:
        description: Extends payload with explicit frequency.
        request:
          fields:

            bandChanOrFreq: uint16
            power: uint8
            pitMode: uint8
            lowPowerDisarm:
              type: uint8
              enum: vtxLowerPowerDisarm_e
            pitModeFreq: uint16
            band: uint8
            channel: uint8
            frequency:
              type: uint16
              description: Read and ignored by INAV.
        reply: null
      payloadSize >= 9:
        description: Adds explicit band/channel overrides (API 1.42 extension).
        request:
          fields:

            bandChanOrFreq: uint16
            power: uint8
            pitMode: uint8
            lowPowerDisarm:
              type: uint8
              enum: vtxLowerPowerDisarm_e
            pitModeFreq: uint16
            band:
              type: uint8
              description: 1..N; overrides band when present.

            channel:
              type: uint8
              description: 1..8; overrides channel when present.
        reply: null
      payloadSize >= 7:
        description: Adds pit-mode frequency placeholder.
        request:
          fields:

            bandChanOrFreq: uint16
            power: uint8
            pitMode: uint8
            lowPowerDisarm:
              type: uint8
              enum: vtxLowerPowerDisarm_e
            pitModeFreq:
              type: uint16
              description: Read and skipped.
        reply: null
      payloadSize >= 5:
        description: Adds low-power disarm behaviour.
        request:
          fields:

            bandChanOrFreq: uint16
            power: uint8
            pitMode: uint8
            lowPowerDisarm:
              type: uint8
              enum: vtxLowerPowerDisarm_e
              description: 0=Off, 1=Always, 2=Until first arm.
        reply: null
      payloadSize >= 4:
        description: Adds power index and pit mode flag.
        request:
          fields:

            bandChanOrFreq: uint16
            power: uint8
            pitMode: uint8
        reply: null
      payloadSize == 2:
        description: Minimum payload (band/channel encoded in 0..63).
        request:
          fields:

            bandChanOrFreq:
              type: uint16
              description: If <= `VTXCOMMON_MSP_BANDCHAN_CHKVAL`, decoded as band/channel; otherwise treated as a frequency placeholder.
        reply: null

  MSP_ADVANCED_CONFIG:
    id: 90
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Retrieves advanced hardware-related configuration (PWM protocols, rates). Some fields are BF compatibility placeholders.
    request: null
    reply:
      fields:
        gyroSyncDenom:
          type: uint8
          description: Always 1 (BF compatibility)
          value: 1

        pidProcessDenom:
          type: uint8
          description: Always 1 (BF compatibility)
          value: 1

        useUnsyncedPwm:
          type: uint8
          description: Always 1 (BF compatibility, INAV uses async PWM based on protocol)
          value: 1

        motorPwmProtocol:
          type: uint8
          enum: motorPwmProtocolTypes_e
          description: Motor PWM protocol type (`motorConfig()->motorPwmProtocol`).

        motorPwmRate:
          type: uint16
          unit: Hz
          description: Motor PWM rate (if applicable) (`motorConfig()->motorPwmRate`).

        servoPwmRate:
          type: uint16
          unit: Hz
          description: Servo PWM rate (`servoConfig()->servoPwmRate`).

        legacyGyroSync:
          type: uint8
          description: Always 0 (BF compatibility)
          value: 0

  MSP_SET_ADVANCED_CONFIG:
    id: 91
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Sets advanced hardware-related configuration (PWM protocols, rates).
    notes: Expects 9 bytes.
    request:
      fields:
        gyroSyncDenom:
          type: uint8
          description: Ignored (legacy Betaflight field).

