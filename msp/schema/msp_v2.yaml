          description: 'Enum (`pitotSensor_e`): Pitot tube hardware type (`pitotmeterConfig()->pitot_hardware`). 0 if `USE_PITOT` disabled'

        rangefinderHardware:
          type: uint8
          enum: rangefinderType_e
          description: 'Enum (`rangefinderType_e`): Rangefinder hardware type (`rangefinderConfig()->rangefinder_hardware`). 0 if `USE_RANGEFINDER` disabled'

        opflowHardware:
          type: uint8
