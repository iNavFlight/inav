  MSP_SPECIAL_PARAMETERS:
    id: 98
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Betaflight specific
    notes: Not implemented in INAV `fc_msp.c`.
    not_implemented: true

  MSP_SET_SPECIAL_PARAMETERS:
    id: 99
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Betaflight specific
    notes: Not implemented in INAV `fc_msp.c`.
    not_implemented: true

  MSP_STATUS:
    id: 101
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides basic flight controller status including cycle time, errors, sensor status, active modes (first 32), and the current configuration profile.
    notes: 'Superseded by `MSP_STATUS_EX` and `MSP2_INAV_STATUS`. `sensorStatus` bitmask: (Bit 0: ACC, 1: BARO, 2: MAG, 3: GPS, 4: RANGEFINDER, 5: OPFLOW, 6: PITOT, 7: TEMP; Bit 15: hardware failure). `activeModesLow` only contains the first 32 modes; use `MSP_ACTIVEBOXES` for the full set.'
    replaced_by:
      - MSP2_INAV_STATUS
    request: null
    reply:
      fields:
        cycleTime:
          type: uint16
          unit: "\xB5s"
          description: Main loop cycle time (`cycleTime`)

        i2cErrors:
          type: uint16
          unit: Count
          description: Number of I2C errors encountered (`i2cGetErrorCounter()`). 0 if `USE_I2C` not defined

        sensorStatus:
          type: uint16
          enum: sensors_e
          bitmask: true
          description: 'Bitmask: available/active sensors (`packSensorStatus()`). See notes'

        activeModesLow:
          type: uint32
          bitmask: true
          description: 'Bitmask: First 32 bits of the active flight modes bitmask (`packBoxModeFlags()`)'

        profile:
          type: uint8
          unit: Index
          description: Current configuration profile index (0-based) (`getConfigProfile()`)

  MSP_RAW_IMU:
    id: 102
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides raw sensor readings from the IMU (Accelerometer, Gyroscope, Magnetometer).
    notes: Acc scaling is approximate (512 LSB/G). Mag units depend on the sensor.
    request: null
    reply:
      fields:
        accX:
          type: int16
          unit: ~1/512 G
          description: Raw accelerometer X reading, scaled (`acc.accADCf[X] * 512`)

        accY:
          type: int16
          unit: ~1/512 G
          description: Raw accelerometer Y reading, scaled (`acc.accADCf[Y] * 512`)

        accZ:
          type: int16
          unit: ~1/512 G
          description: Raw accelerometer Z reading, scaled (`acc.accADCf[Z] * 512`)

        gyroX:
          type: int16
          unit: deg/s
          description: Gyroscope X-axis rate (`gyroRateDps(X)`)

        gyroY:
          type: int16
          unit: deg/s
          description: Gyroscope Y-axis rate (`gyroRateDps(Y)`)

        gyroZ:
          type: int16
          unit: deg/s
          description: Gyroscope Z-axis rate (`gyroRateDps(Z)`)

        magX:
          type: int16
          unit: Raw units
          description: Raw magnetometer X reading (`mag.magADC[X]`). 0 if `USE_MAG` disabled

        magY:
          type: int16
          unit: Raw units
          description: Raw magnetometer Y reading (`mag.magADC[Y]`). 0 if `USE_MAG` disabled

        magZ:
          type: int16
          unit: Raw units
          description: Raw magnetometer Z reading (`mag.magADC[Z]`). 0 if `USE_MAG` disabled

  MSP_SERVO:
    id: 103
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the current output values for all supported servos.
    variable_len: true
    request: null
    reply:
      fields:
        servoOutputs:
          type: int16[MAX_SUPPORTED_SERVOS]
          unit: PWM
          description: Array of current servo output values (typically 1000-2000)

  MSP_MOTOR:
    id: 104
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the current output values for the first 8 motors.
    request: null
    reply:
      fields:
        motorOutputs:
          type: int16[8]
          unit: PWM
          description: Array of current motor output values (typically 1000-2000). Values beyond `MAX_SUPPORTED_MOTORS` are 0

  MSP_RC:
    id: 105
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the current values of the received RC channels.
    notes: Array length equals `rxRuntimeConfig.channelCount`.
    variable_len: true
    request: null
    reply:
      fields:
        rcChannels:
          type: int16[]
          unit: PWM
          description: Array of current RC channel values (typically 1000-2000). Length depends on detected channels

  MSP_RAW_GPS:
    id: 106
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides raw GPS data (fix status, coordinates, altitude, speed, course).
    notes: Only available if `USE_GPS` is defined. Altitude is truncated to meters.
    request: null
    reply:
      fields:
        fixType:
          type: uint8
          enum: gpsFixType_e
          description: Enum `gpsFixType_e` GPS fix type (`gpsSol.fixType`)

        numSat:
          type: uint8
          unit: Count
          description: Number of satellites used in solution (`gpsSol.numSat`)

        latitude:
          type: int32
          unit: deg * 1e7
          description: Latitude (`gpsSol.llh.lat`)

        longitude:
          type: int32
          unit: deg * 1e7
          description: Longitude (`gpsSol.llh.lon`)

        altitude:
          type: int16
          unit: m
          description: Altitude above MSL, sent as whole metres (`gpsSol.llh.alt / 100`)

        speed:
          type: int16
          unit: cm/s
          description: Ground speed (`gpsSol.groundSpeed`)

        groundCourse:
          type: int16
          unit: deci-degrees
          description: Ground course (`gpsSol.groundCourse`)

        hdop:
          type: uint16
          unit: HDOP * 100
          description: Horizontal Dilution of Precision (`gpsSol.hdop`)

  MSP_COMP_GPS:
    id: 107
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: 'Provides computed GPS values: distance and direction to home.'
    notes: Only available if `USE_GPS` is defined.
    request: null
    reply:
      fields:
        distanceToHome:
          type: uint16
          unit: meters
          description: Distance to the home point (`GPS_distanceToHome`)

        directionToHome:
          type: int16
          unit: degrees
          description: Direction to the home point (0-360) (`GPS_directionToHome`)

        gpsHeartbeat:
          type: uint8
          unit: Boolean
          description: Indicates if GPS data is being received (`gpsSol.flags.gpsHeartbeat`)

  MSP_ATTITUDE:
    id: 108
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides the current attitude estimate (roll, pitch, yaw).
    notes: Yaw is in degrees.
    request: null
    reply:
      fields:
        roll:
          type: int16
          unit: deci-degrees
          description: Roll angle (`attitude.values.roll`)

        pitch:
          type: int16
          unit: deci-degrees
          description: Pitch angle (`attitude.values.pitch`)

        yaw:
          type: int16
          unit: degrees
          description: Yaw/Heading angle (`DECIDEGREES_TO_DEGREES(attitude.values.yaw)`)

  MSP_ALTITUDE:
    id: 109
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: Provides estimated altitude, vertical speed (variometer), and raw barometric altitude.
    request: null
    reply:
      fields:
        estimatedAltitude:
          type: int32
          unit: cm
          description: Estimated altitude above home/sea level (`getEstimatedActualPosition(Z)`)

        variometer:
          type: int16
          unit: cm/s
          description: Estimated vertical speed (`getEstimatedActualVelocity(Z)`)

        baroAltitude:
          type: int32
          unit: cm
          description: Latest raw altitude from barometer (`baroGetLatestAltitude()`). 0 if `USE_BARO` disabled

  MSP_ANALOG:
    id: 110
    inav_version:
      since: "1.0"
    mspv: 1
    group: v1
    description: 'Provides analog sensor readings: battery voltage, current consumption (mAh), RSSI, and current draw (Amps).'
    notes: Superseded by `MSP2_INAV_ANALOG` which provides higher precision and more fields.
    replaced_by:
