name: Sync maintenance branches

# Carries fixes down the chain so the holding branches never fall behind:
#
#   maintenance-10.x -> next-10.1 -> maintenance-11.x
#
# For each link: fast-forward if possible, otherwise a regular merge commit
# (never squash or rebase). If the merge conflicts, or the push is refused,
# a PR from the source into the target is opened for a human to resolve.
# Do not use GitHub's "Resolve conflicts" button on those PRs; merge the
# source into the target locally.

on:
  push:
    branches:
      - maintenance-10.x
      - next-10.1
  workflow_dispatch:

# One run at a time; queued runs wait rather than cancel so no push is skipped.
concurrency:
  group: sync-maintenance-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'iNavFlight/inav'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          open_pr() {
            local src=$1 tgt=$2
            local existing
            existing=$(gh pr list --head "$src" --base "$tgt" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "::warning::$src -> $tgt needs manual merge; PR #$existing already open"
              return
            fi
            gh pr create --head "$src" --base "$tgt" \
              --title "Sync $src into $tgt" \
              --body "Automatic sync of \`$src\` into \`$tgt\` could not be completed (merge conflict or push refused). Merge \`$src\` into \`$tgt\` locally, resolve conflicts, and push. Use a merge commit, not squash or rebase. Do not use GitHub's \"Resolve conflicts\" button." \
              && echo "::warning::$src -> $tgt needs manual merge; PR opened"
          }

          sync() {
            local src=$1 tgt=$2
            git fetch origin "+refs/heads/$src:refs/remotes/origin/$src" "+refs/heads/$tgt:refs/remotes/origin/$tgt" || return
            if git merge-base --is-ancestor "origin/$src" "origin/$tgt"; then
              echo "$tgt already contains $src"
              return
            fi
            git checkout -q -B "$tgt" "origin/$tgt"
            if ! git merge --ff-only "origin/$src" \
               && ! git merge --no-ff -m "Merge $src into $tgt (automatic sync)" "origin/$src"; then
              git merge --abort 2>/dev/null
              open_pr "$src" "$tgt"
              return
            fi
            if git push origin "$tgt"; then
              echo "Synced $src into $tgt"
            else
              open_pr "$src" "$tgt"
            fi
          }

          sync maintenance-10.x next-10.1
          sync next-10.1 maintenance-11.x
