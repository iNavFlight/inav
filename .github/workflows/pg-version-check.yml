name: Parameter Group Version Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - maintenance-9.x
      - maintenance-10.x
      - release/9.1
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - '.github/scripts/check-pg-versions.sh'
      - '.github/scripts/check-pg-versions.py'
      - '.github/scripts/test-check-pg-versions.py'
      - '.github/workflows/pg-version-check.yml'

jobs:
  check-pg-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to compare with base branch

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Test PG version checker
        run: python3 .github/scripts/test-check-pg-versions.py

      - name: Run PG version check script
        id: pg_check
        run: |
          set +e  # Don't fail the workflow, just capture exit code
          # Run script and capture output. Exit code 1 is expected for issues.
          # The output is captured and encoded to be passed between steps.
          output=$(bash .github/scripts/check-pg-versions.sh 2>&1)
          exit_code=$?
          if [ "$exit_code" -gt 1 ] || { [ "$exit_code" -eq 1 ] && ! grep -q '^PG version issue:' <<< "$output"; }; then
            printf '%s\n' "$output"
            exit 2
          fi
          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}

      - name: Stage PG check result for the comment workflow
        env:
          # Multi-line output travels through the environment so shell
          # metacharacters in it are not reinterpreted.
          PG_CHECK_OUTPUT: ${{ steps.pg_check.outputs.output }}
        run: |
          printf '%s\n' "$PG_CHECK_OUTPUT" > pg_output.txt

      - name: Upload PG check result
        uses: actions/upload-artifact@v4
        with:
          name: pg-check-result
          path: pg_output.txt
          retention-days: 1
